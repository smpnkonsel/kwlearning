<!DOCTYPE html>
<html lang="id">
<head>

<style>
:root{--paper:#F0F2F5;--panel:#fff;--ink:#1B2430;--soft:#5B6473;--navy:#0F3D63;--deep:#0A2B48;--gold:#D79A2C;--line:#DDE2E8;
--sedang:#2E86AB;--sedang-bg:#EAF3F8;--sulit:#C9642A;--sulit-bg:#FBEEE4;--hots:#7B4FA6;--hots-bg:#F1EAF8;--olimpiade:#B23A48;--olimpiade-bg:#FAEBEC;--ok:#2F9E5B;--ok-bg:#E7F5EC;--bad:#C0392B;--bad-bg:#FBEBE9;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper)}
body{color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;overflow:hidden}
h2,h3{font-family:'Fraunces',Georgia,serif;margin:0}button{font-family:inherit}
.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{flex:none;background:linear-gradient(120deg,var(--navy),var(--deep));color:#fff;padding:10px 26px 0}
.row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
.brand{font-size:13px;color:#B9C6D6;font-weight:600}.et{font-family:'Fraunces',serif;font-weight:600;font-size:18px}
.sub{margin:4px 0 8px;color:#C7D2DE;font-size:12.5px}
.strip{display:flex;height:4px}.strip span{flex:1}
.body{flex:1;display:flex;min-height:0}
aside{width:270px;flex:none;background:var(--panel);border-right:1px solid var(--line);border-top:3px solid var(--gold);display:flex;flex-direction:column;min-height:0}
.sc{flex:1;overflow-y:auto;padding:18px}
aside h2{font-size:13px;color:var(--soft);margin-bottom:10px;font-family:'Public Sans',sans-serif;font-weight:700}
.pt{height:7px;background:#E7EAEF;border-radius:99px;overflow:hidden;margin-bottom:6px}.pf{height:100%;background:var(--gold);width:0;transition:width .25s}
.pl{font-size:12.5px;color:var(--soft);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.cell{aspect-ratio:1;border-radius:6px;border:1.5px solid;font-size:12.5px;font-weight:700;cursor:pointer;padding:0;background:#fff}
.sedang{--c:var(--sedang);--b:var(--sedang-bg)}.sulit{--c:var(--sulit);--b:var(--sulit-bg)}.hots{--c:var(--hots);--b:var(--hots-bg)}.olimpiade{--c:var(--olimpiade);--b:var(--olimpiade-bg)}
.cell{border-color:var(--c);color:var(--c);background:var(--b)}.cell.answered{background:var(--c);color:#fff}.cell.current{outline:2.5px solid var(--gold);outline-offset:1px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--soft)}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:8px}
.sf{padding:14px 18px;border-top:1px solid var(--line)}
.bs{width:100%;background:var(--gold);color:#2A1D06;border:0;border-radius:8px;padding:12px;font-size:14.5px;font-weight:700;cursor:pointer}
main{flex:1;min-width:0;overflow-y:auto;display:flex;justify-content:center;padding:28px 24px 40px}
.card{width:100%;max-width:760px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--c,var(--navy));border-radius:10px;padding:24px 28px 28px;align-self:flex-start}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--b);color:var(--c)}
.tc{font-size:12.5px;color:var(--soft);border:1px solid var(--line);padding:5px 12px;border-radius:99px}
.qn{font-family:'Fraunces',serif;font-size:14.5px;color:var(--soft);margin-bottom:6px}
.qt{font-size:18.5px;line-height:1.55;margin:0 0 16px}
.figbox{display:flex;justify-content:center;background:#F7F9FB;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:18px}
.fig{width:100%;max-width:340px;height:auto}
fieldset{border:0;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px 16px;cursor:pointer}
.opt:hover{border-color:var(--navy)}.opt.sel{border-color:var(--navy);background:#F2F6FA}.opt input{margin-top:4px;accent-color:var(--navy)}.ol{font-weight:700;color:var(--navy);width:18px;flex:none}
.nb{display:flex;justify-content:space-between;gap:12px}
.g,.p{font-size:15px;font-weight:700;border-radius:8px;padding:11px 22px;cursor:pointer;border:1px solid transparent}
.g{background:#fff;border-color:var(--line);color:var(--ink)}.g:disabled{opacity:.4;cursor:not-allowed}.p{background:var(--c,var(--navy));color:#fff}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rw{max-width:820px;margin:0 auto;width:100%}.rw h2{font-size:24px}
.hero{display:flex;align-items:baseline;gap:10px;margin:10px 0 20px}.hero .n{font-family:'Fraunces',serif;font-size:52px;font-weight:600}.hero .o{color:var(--soft)}
.bd{display:grid;grid-template-columns:90px 1fr 50px;gap:12px;align-items:center;font-size:14px;margin-bottom:10px}
.bt{height:9px;background:#E7EAEF;border-radius:99px;overflow:hidden}.bt div{height:100%;background:var(--c)}
.ri{border-top:1px solid var(--line);padding:18px 0}.rq{font-size:16px;margin:10px 0}
.ro{padding:7px 12px;border-radius:6px;font-size:14px;margin-bottom:6px;border:1px solid var(--line)}
.ro.c{border-color:var(--ok);background:var(--ok-bg);color:#1E6B3E}.ro.w{border-color:var(--bad);background:var(--bad-bg);color:#8E2A20}
.ex{font-size:14px;color:var(--soft);background:#F6F4EC;border-radius:8px;padding:12px 14px;margin-top:10px}.ex b{color:var(--ink)}
.hidden{display:none!important}
.ov{position:fixed;inset:0;background:rgba(10,20,32,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.mb{background:#fff;border-radius:12px;padding:24px 26px;max-width:380px;border-top:4px solid var(--gold)}
.mb p{font-size:14.5px;color:var(--soft);margin:8px 0 18px}.ma{display:flex;justify-content:flex-end;gap:10px}
@media(max-width:820px){.body{flex-direction:column}aside{width:100%;max-height:36vh;border-right:0}main{padding:18px 14px 30px}}
</style>

<body>
<div class="app">
<header>
<div class="row"><span class="brand">KW Learning · Ruang Belajar Matematika</span><span class="et">Ujian Relasi dan Fungsi</span></div>
<p class="sub">45 soal pilihan ganda dengan gambar diagram panah, grafik, dan diagram Cartesius — sedang, sulit, HOTS, dan olimpiade.</p>
<div class="strip"><span style="background:var(--sedang)"></span><span style="background:var(--sulit)"></span><span style="background:var(--hots)"></span><span style="background:var(--olimpiade)"></span></div>
</header>
<div class="body">
<aside id="side"><div class="sc">
<h2>Progres</h2><div class="pt"><div class="pf" id="pf"></div></div><div class="pl" id="pl"></div>
<h2>Navigasi soal</h2><div class="grid" id="grid"></div>
<div class="legend"><span class="sedang"><i></i>Sedang (1–15)</span><span class="sulit"><i></i>Sulit (16–30)</span><span class="hots"><i></i>HOTS (31–40)</span><span class="olimpiade"><i></i>Olimpiade (41–45)</span></div>
</div><div class="sf"><button class="bs" id="bsub">Kumpulkan jawaban</button></div></aside>
<main id="panel" aria-live="polite"></main>
</div></div>
<div class="ov hidden" id="ov"><div class="mb"><h3>Kumpulkan jawaban?</h3><p id="cm"></p><div class="ma"><button class="g" id="no">Kembali</button><button class="p" id="yes">Ya, kumpulkan</button></div></div></div>

<script>
const NS='http://www.w3.org/2000/svg';
// Gambar: diagram panah
function arrow(A,B,P){
  const n=Math.max(A.length,B.length),H=n*34+24,y=(l,i)=>12+i*34+(n-l)*17+17;
  let s=`<svg class="fig" viewBox="0 0 320 ${H+22}" role="img" aria-label="Diagram panah dari A ke B"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#0F3D63"/></marker></defs>
  <ellipse cx="80" cy="${H/2}" rx="48" ry="${H/2-2}" fill="#EAF3F8" stroke="#2E86AB" stroke-width="1.5"/><ellipse cx="240" cy="${H/2}" rx="48" ry="${H/2-2}" fill="#FBEEE4" stroke="#C9642A" stroke-width="1.5"/>
  <text x="80" y="${H+16}" text-anchor="middle" font-weight="700" fill="#2E86AB">A</text><text x="240" y="${H+16}" text-anchor="middle" font-weight="700" fill="#C9642A">B</text>`;
  P.forEach(([i,j])=>{s+=`<line x1="100" y1="${y(A.length,i)}" x2="218" y2="${y(B.length,j)}" stroke="#0F3D63" stroke-width="1.6" marker-end="url(#ah)"/>`});
  A.forEach((t,i)=>{s+=`<circle cx="80" cy="${y(A.length,i)}" r="3" fill="#0F3D63"/><text x="66" y="${y(A.length,i)+5}" text-anchor="end" font-size="14">${t}</text>`});
  B.forEach((t,i)=>{s+=`<circle cx="240" cy="${y(B.length,i)}" r="3" fill="#0F3D63"/><text x="254" y="${y(B.length,i)+5}" font-size="14">${t}</text>`});
  return s+'</svg>';
}
// Gambar: grafik Cartesius
function graph(pts,o){
  const [x0,x1]=o.x,[y0,y1]=o.y,W=320,Hh=250,L=24,T=12,pw=W-L-14,ph=Hh-T-22;
  const X=v=>L+(v-x0)/(x1-x0)*pw,Y=v=>T+ph-(v-y0)/(y1-y0)*ph;
  let s=`<svg class="fig" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Grafik pada bidang Cartesius">`;
  for(let i=x0;i<=x1;i++)s+=`<line x1="${X(i)}" y1="${T}" x2="${X(i)}" y2="${T+ph}" stroke="#DDE2E8"/>`+(i?`<text x="${X(i)}" y="${Y(Math.max(y0,0))+13}" font-size="10" text-anchor="middle" fill="#5B6473">${i}</text>`:'');
  for(let i=y0;i<=y1;i++)s+=`<line x1="${L}" y1="${Y(i)}" x2="${L+pw}" y2="${Y(i)}" stroke="#DDE2E8"/>`+(i?`<text x="${X(Math.max(x0,0))-5}" y="${Y(i)+3}" font-size="10" text-anchor="end" fill="#5B6473">${i}</text>`:'');
  s+=`<line x1="${L}" y1="${Y(0)}" x2="${L+pw}" y2="${Y(0)}" stroke="#1B2430" stroke-width="1.5"/><line x1="${X(0)}" y1="${T}" x2="${X(0)}" y2="${T+ph}" stroke="#1B2430" stroke-width="1.5"/><text x="${L+pw}" y="${Y(0)-5}" font-size="11" text-anchor="end">x</text><text x="${X(0)+6}" y="${T+8}" font-size="11">y</text>`;
  if(o.line){const [a,b]=pts,m=(b[1]-a[1])/(b[0]-a[0]),f=x=>a[1]+m*(x-a[0]);s+=`<line x1="${X(x0)}" y1="${Y(f(x0))}" x2="${X(x1)}" y2="${Y(f(x1))}" stroke="#0F3D63" stroke-width="2"/>`}
  pts.forEach(p=>{s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4.5" fill="#D79A2C" stroke="#0F3D63"/>`+(o.lab?`<text x="${X(p[0])+7}" y="${Y(p[1])-7}" font-size="11" font-weight="700">(${p[0]},${p[1]})</text>`:'')});
  return s+'</svg>';
}
const F=(h)=>`<div class="figbox">${h}</div>`;
const Q=[
// SEDANG
{l:"sedang",t:"Relasi",f:F(arrow([1,2,3],[2,4,6],[[0,0],[1,1],[2,2]])),q:"Perhatikan diagram panah di atas. Relasi dari himpunan A ke himpunan B adalah ...",o:["dua kali dari","setengah dari","kurang dari","akar dari"],c:0,e:"Setiap anggota A dipasangkan dengan 2 kali nilainya di B: 1→2, 2→4, 3→6."},
{l:"sedang",t:"Domain, Kodomain, Range",f:F(arrow([1,2,3],['a','b','c','d'],[[0,0],[1,1],[2,2]])),q:"Dari diagram di atas, kodomain relasinya adalah ...",o:["{1, 2, 3}","{a, b, c}","{a, b, c, d}","{1, 2, 3, a, b, c, d}"],c:2,e:"Kodomain adalah seluruh anggota himpunan B, yaitu {a, b, c, d}. Range-nya hanya {a, b, c}."},
{l:"sedang",t:"Pengertian Fungsi",f:F(arrow([1,2,3],['a','b','c'],[[0,0],[0,1],[1,1],[2,2]])),q:"Diagram panah di atas bukan merupakan fungsi karena ...",o:["ada anggota A yang mempunyai dua pasangan di B","ada anggota B yang tidak punya pasangan","semua anggota A punya pasangan","banyak anggota A sama dengan banyak anggota B"],c:0,e:"Pada fungsi, setiap anggota A tepat punya satu pasangan. Angka 1 berpasangan dengan a dan b, sehingga bukan fungsi."},
{l:"sedang",t:"Nilai Fungsi",q:"Diketahui f(x) = 2x + 3. Nilai f(4) adalah ...",o:["8","9","10","11"],c:3,e:"f(4) = 2(4) + 3 = 8 + 3 = 11."},
{l:"sedang",t:"Banyak Pemetaan",q:"Jika A = {a, b} dan B = {1, 2, 3}, banyak pemetaan dari A ke B adalah ...",o:["6","8","9","12"],c:2,e:"Banyak pemetaan dari A ke B = n(B)^n(A) = 3² = 9."},
{l:"sedang",t:"Grafik Fungsi",f:F(graph([[1,2],[2,4],[3,6]],{x:[-1,4],y:[-1,7],lab:1})),q:"Titik-titik pada grafik di atas menunjukkan fungsi ...",o:["y = x + 1","y = 2x","y = 3x","y = x²"],c:1,e:"Setiap titik memenuhi y = 2x: 2 = 2·1, 4 = 2·2, 6 = 2·3."},
{l:"sedang",t:"Relasi",f:F(arrow([2,3,4],[1,2,3],[[0,0],[1,0],[1,1],[2,0],[2,1],[2,2]])),q:"Relasi dari himpunan A ke himpunan B pada diagram di atas adalah ...",o:["kurang dari","lebih dari","faktor dari","setengah dari"],c:1,e:"3 > 1; 3 > 2; 4 > 1; 4 > 2; 4 > 3; dan 2 > 1. Semuanya berelasi lebih dari."},
{l:"sedang",t:"Domain, Kodomain, Range",q:"Diketahui f = {(1,2), (2,4), (3,6)}. Range (daerah hasil) fungsi tersebut adalah ...",o:["{1, 2, 3}","{2, 4, 6}","{1, 2, 3, 4, 6}","{(2, 4)}"],c:1,e:"Range adalah himpunan anggota kodomain yang punya pasangan, yaitu {2, 4, 6}."},
{l:"sedang",t:"Nilai Fungsi",q:"Diketahui f(x) = x + 7. Nilai f(3) adalah ...",o:["9","10","11","12"],c:1,e:"f(3) = 3 + 7 = 10."},
{l:"sedang",t:"Nilai Fungsi",q:"Diketahui f(x) = 5x. Nilai f(−2) adalah ...",o:["−10","−7","7","10"],c:0,e:"f(−2) = 5 × (−2) = −10."},
{l:"sedang",t:"Pengertian Fungsi",f:F(arrow([1,2,3],['a','b','c'],[[0,0],[1,0],[2,1]])),q:"Diagram di atas merupakan fungsi karena ...",o:["setiap anggota A tepat mempunyai satu pasangan di B","setiap anggota B mempunyai pasangan di A","ada anggota A yang tidak mempunyai pasangan","ada anggota A yang mempunyai dua pasangan"],c:0,e:"Syarat fungsi: setiap anggota A berpasangan tepat satu kali. Anggota B boleh tidak berpasangan atau dipakai berkali-kali."},
{l:"sedang",t:"Banyak Pemetaan",q:"Jika n(A) = 2 dan n(B) = 4, banyak pemetaan dari A ke B adalah ...",o:["8","12","16","64"],c:2,e:"Banyak pemetaan dari A ke B = n(B)^n(A) = 4² = 16."},
{l:"sedang",t:"Grafik Fungsi",f:F(graph([[0,1],[1,2],[2,3]],{x:[-1,4],y:[-1,5],lab:1})),q:"Titik-titik pada grafik di atas menunjukkan fungsi ...",o:["y = x","y = x + 1","y = 2x + 1","y = x + 2"],c:1,e:"Setiap titik memenuhi y = x + 1: 1 = 0 + 1, 2 = 1 + 1, 3 = 2 + 1."},
{l:"sedang",t:"Pengertian Fungsi",q:"Himpunan pasangan berurutan yang merupakan fungsi adalah ...",o:["{(1,a), (1,b), (2,c)}","{(1,a), (2,a), (3,b)}","{(1,a), (2,b), (2,c)}","{(a,1), (a,2), (b,3)}"],c:1,e:"Pada pilihan B, tiap anggota pertama (1, 2, 3) muncul tepat satu kali. Pilihan lain ada anggota pertama yang muncul dua kali."},
{l:"sedang",t:"Nilai Fungsi",q:"Diketahui f(x) = x/2 + 1. Nilai f(8) adalah ...",o:["4","5","6","9"],c:1,e:"f(8) = 8/2 + 1 = 4 + 1 = 5."},
// SULIT
{l:"sulit",t:"Nilai Fungsi",q:"Fungsi f(x) = 3x − 5. Jika f(a) = 10, maka nilai a adalah ...",o:["3","4","5","6"],c:2,e:"3a − 5 = 10 → 3a = 15 → a = 5."},
{l:"sulit",t:"Menentukan Rumus Fungsi",q:"Fungsi f(x) = ax + b dengan f(1) = 5 dan f(2) = 8. Nilai f(5) adalah ...",o:["14","15","16","17"],c:3,e:"f(2) − f(1) = a = 3, lalu b = 5 − 3 = 2. Maka f(x) = 3x + 2 dan f(5) = 17."},
{l:"sulit",t:"Range Fungsi",q:"Fungsi f(x) = x + 2 dengan domain {−1, 0, 1, 2}. Range fungsi tersebut adalah ...",o:["{1, 2, 3, 4}","{0, 1, 2, 3}","{−1, 0, 1, 2}","{2, 3, 4, 5}"],c:0,e:"f(−1)=1, f(0)=2, f(1)=3, f(2)=4. Range = {1, 2, 3, 4}."},
{l:"sulit",t:"Grafik Fungsi",f:F(graph([[0,-2],[2,2]],{x:[-2,4],y:[-4,6],line:1,lab:1})),q:"Grafik di atas adalah garis lurus yang melalui (0, −2) dan (2, 2). Nilai f(3) adalah ...",o:["2","3","4","6"],c:2,e:"Gradien = (2 − (−2))/(2 − 0) = 2, sehingga f(x) = 2x − 2. Maka f(3) = 6 − 2 = 4."},
{l:"sulit",t:"Korespondensi Satu-satu",f:F(arrow(['a','b','c'],[1,2,3],[[0,1],[1,0],[2,2]])),q:"Diagram di atas adalah korespondensi satu-satu dari P = {a, b, c} ke Q = {1, 2, 3}. Banyak seluruh korespondensi satu-satu yang mungkin dari P ke Q adalah ...",o:["3","6","9","27"],c:1,e:"Banyak korespondensi satu-satu = n! = 3! = 3 × 2 × 1 = 6."},
{l:"sulit",t:"Rumus dari Diagram",f:F(arrow([1,2,3,4],[1,4,9,16],[[0,0],[1,1],[2,2],[3,3]])),q:"Rumus fungsi dari diagram panah di atas adalah f(x) = ...",o:["2x","x + 3","x²","x³"],c:2,e:"1→1, 2→4, 3→9, 4→16 adalah kuadrat dari masing-masing anggota, sehingga f(x) = x²."},
{l:"sulit",t:"Nilai Fungsi",q:"Diketahui f(x) = 2x² − 3. Nilai f(−2) adalah ...",o:["1","5","11","−11"],c:1,e:"f(−2) = 2(−2)² − 3 = 2(4) − 3 = 5."},
{l:"sulit",t:"Range Fungsi",q:"Fungsi f(x) = 3x − 1 dengan domain {0, 1, 2, 3}. Range fungsi tersebut adalah ...",o:["{−1, 2, 5, 8}","{0, 3, 6, 9}","{−1, 1, 3, 5}","{1, 4, 7, 10}"],c:0,e:"f(0)=−1, f(1)=2, f(2)=5, f(3)=8. Range = {−1, 2, 5, 8}."},
{l:"sulit",t:"Grafik Fungsi",f:F(graph([[0,3],[3,0]],{x:[-2,6],y:[-3,5],line:1,lab:1})),q:"Grafik di atas adalah garis lurus yang melalui (0, 3) dan (3, 0). Nilai f(5) adalah ...",o:["−2","2","3","8"],c:0,e:"Gradien = (0 − 3)/(3 − 0) = −1, sehingga f(x) = −x + 3. Maka f(5) = −5 + 3 = −2."},
{l:"sulit",t:"Menentukan Rumus Fungsi",q:"Fungsi f(x) = ax + b dengan f(0) = 4 dan f(2) = 10. Nilai f(−1) adalah ...",o:["−1","1","7","13"],c:1,e:"f(0) = b = 4. Lalu 2a + 4 = 10 → a = 3. Jadi f(x) = 3x + 4 dan f(−1) = −3 + 4 = 1."},
{l:"sulit",t:"Nilai Fungsi",q:"Fungsi f(x) = 5 − 2x. Jika f(a) = −3, maka nilai a adalah ...",o:["2","3","4","5"],c:2,e:"5 − 2a = −3 → −2a = −8 → a = 4."},
{l:"sulit",t:"Korespondensi Satu-satu",q:"Himpunan P dan Q masing-masing memiliki 4 anggota. Banyak korespondensi satu-satu dari P ke Q adalah ...",o:["4","12","24","16"],c:2,e:"Banyak korespondensi satu-satu = 4! = 4 × 3 × 2 × 1 = 24."},
{l:"sulit",t:"Range Fungsi",f:F(arrow([-2,-1,0,1],[0,1,4],[[0,2],[1,1],[2,0],[3,1]])),q:"Range dari fungsi pada diagram panah di atas adalah ...",o:["{−2, −1, 0, 1}","{0, 1, 4}","{0, 1, 2, 4}","{1, 4}"],c:1,e:"Range adalah anggota B yang mempunyai pasangan, yaitu {0, 1, 4}."},
{l:"sulit",t:"Nilai Fungsi",q:"Diketahui f(x) = x² + 2x. Nilai f(3) adalah ...",o:["9","12","15","18"],c:2,e:"f(3) = 9 + 6 = 15."},
{l:"sulit",t:"Rumus dari Pasangan Berurutan",q:"Fungsi f = {(1,2), (2,4), (3,6), (4,8)}. Nilai f(10) adalah ...",o:["12","16","20","24"],c:2,e:"Pola: f(x) = 2x, sehingga f(10) = 20."},
// HOTS
{l:"hots",t:"Fungsi dalam Kehidupan",q:"Tarif taksi online ditentukan f(x) = 4.000 + 3.000x, dengan x adalah jarak tempuh dalam km. Tarif untuk perjalanan 5 km adalah ...",o:["Rp15.000","Rp17.000","Rp19.000","Rp21.000"],c:2,e:"f(5) = 4.000 + 3.000 × 5 = 4.000 + 15.000 = Rp19.000."},
{l:"hots",t:"Menentukan Rumus Fungsi",q:"Fungsi linear f memenuhi f(2) = 1 dan f(−1) = −8. Nilai f(4) adalah ...",o:["5","6","7","8"],c:2,e:"Gradien = (1 − (−8))/(2 − (−1)) = 3. Lalu 3(2) + b = 1 → b = −5. Maka f(4) = 12 − 5 = 7."},
{l:"hots",t:"Fungsi Kuadrat",q:"Diketahui f(x) = x² − 4. Nilai dari f(−3) + f(2) adalah ...",o:["1","3","5","9"],c:2,e:"f(−3) = 9 − 4 = 5 dan f(2) = 4 − 4 = 0. Jumlahnya = 5."},
{l:"hots",t:"Fungsi Linear",q:"Fungsi f(x) = ax + b, dengan f(3) = 7 dan f(−1) = −1. Nilai a + b adalah ...",o:["1","2","3","4"],c:2,e:"Selisih: 4a = 8 → a = 2. Lalu 6 + b = 7 → b = 1. Jadi a + b = 3."},
{l:"hots",t:"Banyak Pemetaan",q:"Himpunan A memiliki 3 anggota dan B memiliki 2 anggota. Selisih banyak pemetaan dari B ke A dan dari A ke B adalah ...",o:["0","1","2","3"],c:1,e:"B ke A = 3² = 9, A ke B = 2³ = 8. Selisihnya = 9 − 8 = 1."},
{l:"hots",t:"Fungsi dalam Kehidupan",q:"Tarif parkir: Rp2.000 untuk jam pertama dan Rp1.000 untuk setiap jam berikutnya. Biaya parkir selama 6 jam adalah ...",o:["Rp6.000","Rp7.000","Rp8.000","Rp12.000"],c:1,e:"Biaya = 2.000 + 5 × 1.000 = Rp7.000."},
{l:"hots",t:"Grafik Fungsi",f:F(graph([[1,3],[3,9]],{x:[-1,4],y:[-1,10],line:1,lab:1})),q:"Garis pada grafik di atas melalui (1, 3) dan (3, 9). Nilai f(5) pada fungsi tersebut adalah ...",o:["12","15","18","21"],c:1,e:"Gradien = (9 − 3)/(3 − 1) = 3. Lalu 3(1) + b = 3 → b = 0. Jadi f(x) = 3x dan f(5) = 15."},
{l:"hots",t:"Fungsi dalam Kehidupan",q:"Rumus konversi suhu Celsius ke Fahrenheit adalah F = 9/5 C + 32. Suhu 25 °C sama dengan ... °F.",o:["57","72","77","80"],c:2,e:"F = 9/5 × 25 + 32 = 45 + 32 = 77 °F."},
{l:"hots",t:"Menentukan Rumus Fungsi",q:"Fungsi f(x) = ax + b dengan f(−2) = −7 dan f(1) = 2. Nilai f(3) adalah ...",o:["6","8","10","11"],c:1,e:"Selisih: 3a = 9 → a = 3. Lalu 3 + b = 2 → b = −1. Jadi f(3) = 9 − 1 = 8."},
{l:"hots",t:"Fungsi Kuadrat",q:"Fungsi f(x) = x² + px dengan f(2) = 10. Nilai f(3) adalah ...",o:["12","15","18","21"],c:2,e:"4 + 2p = 10 → p = 3. Maka f(3) = 9 + 9 = 18."},
// OLIMPIADE
{l:"olimpiade",t:"Fungsi Bersyarat",q:"Jika f(x + 1) = 2x + 3, maka nilai f(4) adalah ...",o:["7","9","11","13"],c:1,e:"Misalkan x + 1 = 4 → x = 3. Maka f(4) = 2(3) + 3 = 9."},
{l:"olimpiade",t:"Fungsi Komposisi",q:"Diketahui f(x) = 2x + 1. Nilai f(f(2)) adalah ...",o:["9","10","11","12"],c:2,e:"f(2) = 5, lalu f(5) = 2(5) + 1 = 11."},
{l:"olimpiade",t:"Fungsi Injektif",q:"Banyak fungsi satu-satu (injektif) dari A = {1, 2, 3} ke B = {a, b, c, d, e} adalah ...",o:["15","60","125","243"],c:1,e:"Pilihan untuk 1 ada 5, untuk 2 ada 4, untuk 3 ada 3. Total = 5 × 4 × 3 = 60."},
{l:"olimpiade",t:"Fungsi Komposisi",q:"Diketahui f(x) = 3x − 2 dan g(x) = x + 4. Nilai (f ∘ g)(1) adalah ...",o:["9","11","13","15"],c:2,e:"g(1) = 5, lalu f(5) = 3(5) − 2 = 13."},
{l:"olimpiade",t:"Fungsi Bersyarat",q:"Jika f(2x − 1) = x + 3, maka nilai f(5) adalah ...",o:["5","6","7","8"],c:1,e:"Misalkan 2x − 1 = 5 → x = 3. Maka f(5) = 3 + 3 = 6."}
];
const LB={sedang:"Sedang",sulit:"Sulit",hots:"HOTS",olimpiade:"Olimpiade"},LT=['A','B','C','D'];
const S={cur:0,ans:Q.map(()=>null),done:false};
const $=id=>document.getElementById(id),panel=$('panel'),grid=$('grid');
Q.forEach((q,i)=>{const b=document.createElement('button');b.type='button';b.className='cell '+q.l;b.textContent=i+1;b.setAttribute('aria-label','Soal '+(i+1)+', '+LB[q.l]);b.onclick=()=>{S.cur=i;render()};grid.appendChild(b)});
function upd(){grid.childNodes.forEach((c,i)=>{c.classList.toggle('answered',S.ans[i]!==null);c.classList.toggle('current',i===S.cur&&!S.done)});
 const n=S.ans.filter(a=>a!==null).length;$('pf').style.width=Math.round(n/Q.length*100)+'%';$('pl').textContent=n+' dari '+Q.length+' soal terjawab'}
function confirmBox(msg,ok){$('cm').textContent=msg;$('ov').classList.remove('hidden');$('no').onclick=()=>$('ov').classList.add('hidden');$('yes').onclick=()=>{$('ov').classList.add('hidden');ok()}}
function submit(){const u=S.ans.filter(a=>a===null).length;const go=()=>{S.done=true;results()};u?confirmBox('Masih ada '+u+' soal belum dijawab. Tetap kumpulkan?',go):go()}
$('bsub').onclick=submit;
function question(){
  const i=S.cur,q=Q[i];
  panel.innerHTML=`<div class="card ${q.l}"><div class="chips"><span class="chip">${LB[q.l]}</span><span class="tc">${q.t}</span></div>
  <div class="qn">Soal ${i+1} dari ${Q.length}</div>${q.f||''}<p class="qt">${q.q}</p>
  <fieldset>${q.o.map((o,k)=>`<label class="opt${S.ans[i]===k?' sel':''}"><input type="radio" name="o" value="${k}"${S.ans[i]===k?' checked':''}><span class="ol">${LT[k]}.</span><span>${o}</span></label>`).join('')}</fieldset>
  <div class="nb"><button type="button" class="g" id="pv"${i?'':' disabled'}>Sebelumnya</button><button type="button" class="p" id="nx">${i===Q.length-1?'Ke ringkasan':'Berikutnya'}</button></div></div>`;
  panel.querySelectorAll('input').forEach(inp=>inp.onchange=e=>{S.ans[i]=+e.target.value;panel.querySelectorAll('.opt').forEach((el,k)=>el.classList.toggle('sel',k===S.ans[i]));upd()});
  $('pv').onclick=()=>{S.cur--;render()};
  $('nx').onclick=()=>i===Q.length-1?submit():(S.cur++,render());
}
function results(){
  const cnt={};Object.keys(LB).forEach(k=>cnt[k]=[0,0]);let tot=0;
  Q.forEach((q,i)=>{cnt[q.l][1]++;if(S.ans[i]===q.c){cnt[q.l][0]++;tot++}});
  const sc=Math.round(tot/Q.length*100),col=sc>=75?'var(--ok)':sc>=50?'var(--gold)':'var(--bad)';
  $('side').classList.add('hidden');
  panel.innerHTML=`<div class="rw"><h2>Hasil ujian</h2><div class="hero"><span class="n" style="color:${col}">${tot}</span><span class="o">dari ${Q.length} soal benar · nilai akhir <b style="color:${col}">${sc}</b></span></div>
  ${Object.keys(LB).map(k=>`<div class="bd ${k}"><span>${LB[k]}</span><div class="bt"><div style="width:${cnt[k][1]?cnt[k][0]/cnt[k][1]*100:0}%"></div></div><span>${cnt[k][0]}/${cnt[k][1]}</span></div>`).join('')}
  <button class="g" id="rt">Ulangi ujian</button>
  <div style="margin-top:24px">${Q.map((q,i)=>{const a=S.ans[i],ok=a===q.c;return `<div class="ri ${q.l}"><div class="chips"><span class="chip">${LB[q.l]}</span><span class="tc">${q.t}</span><span class="tc" style="color:${ok?'var(--ok)':'var(--bad)'};border-color:currentColor">${ok?'Benar':a===null?'Tidak dijawab':'Salah'}</span></div>${q.f||''}<p class="rq">${i+1}. ${q.q}</p>${q.o.map((o,k)=>`<div class="ro ${k===q.c?'c':k===a?'w':''}">${LT[k]}. ${o}</div>`).join('')}<div class="ex"><b>Pembahasan:</b> ${q.e}</div></div>`}).join('')}</div></div>`;
  $('rt').onclick=()=>{S.cur=0;S.ans=Q.map(()=>null);S.done=false;$('side').classList.remove('hidden');render()};
  panel.scrollTo(0,0);
}
function render(){if(S.done)return results();question();upd();panel.scrollTo(0,0)}
render();
</script>
</body>
