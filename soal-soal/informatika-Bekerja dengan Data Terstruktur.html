<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ujian Bekerja dengan Data Terstruktur — KW Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F0F2F5;--panel:#fff;--ink:#1B2430;--soft:#5B6473;--navy:#0F3D63;--deep:#0A2B48;--gold:#D79A2C;--line:#DDE2E8;
--sedang:#2E86AB;--sedang-bg:#EAF3F8;--sulit:#C9642A;--sulit-bg:#FBEEE4;--hots:#7B4FA6;--hots-bg:#F1EAF8;--olimpiade:#B23A48;--olimpiade-bg:#FAEBEC;--ok:#2F9E5B;--ok-bg:#E7F5EC;--bad:#C0392B;--bad-bg:#FBEBE9;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper)}
body{color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;overflow:hidden}
h2,h3{font-family:'Fraunces',Georgia,serif;margin:0}button{font-family:inherit}
.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{flex:none;background:linear-gradient(120deg,var(--navy),var(--deep));color:#fff;padding:10px 26px 0}
.row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
.brand{font-size:13px;color:#B9C6D6;font-weight:600}.et{font-family:'Fraunces',serif;font-weight:600;font-size:18px}
.sub{margin:4px 0 8px;color:#C7D2DE;font-size:12.5px}
.strip{display:flex;height:4px}.strip span{flex:1}
.body{flex:1;display:flex;min-height:0}
aside{width:270px;flex:none;background:var(--panel);border-right:1px solid var(--line);border-top:3px solid var(--gold);display:flex;flex-direction:column;min-height:0}
.sc{flex:1;overflow-y:auto;padding:18px}
aside h2{font-size:13px;color:var(--soft);margin-bottom:10px;font-family:'Public Sans',sans-serif;font-weight:700}
.pt{height:7px;background:#E7EAEF;border-radius:99px;overflow:hidden;margin-bottom:6px}.pf{height:100%;background:var(--gold);width:0;transition:width .25s}
.pl{font-size:12.5px;color:var(--soft);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.cell{aspect-ratio:1;border-radius:6px;border:1.5px solid;font-size:12.5px;font-weight:700;cursor:pointer;padding:0;background:#fff}
.sedang{--c:var(--sedang);--b:var(--sedang-bg)}.sulit{--c:var(--sulit);--b:var(--sulit-bg)}.hots{--c:var(--hots);--b:var(--hots-bg)}.olimpiade{--c:var(--olimpiade);--b:var(--olimpiade-bg)}
.cell{border-color:var(--c);color:var(--c);background:var(--b)}.cell.answered{background:var(--c);color:#fff}.cell.current{outline:2.5px solid var(--gold);outline-offset:1px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--soft)}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:8px}
.sf{padding:14px 18px;border-top:1px solid var(--line)}
.bs{width:100%;background:var(--gold);color:#2A1D06;border:0;border-radius:8px;padding:12px;font-size:14.5px;font-weight:700;cursor:pointer}
main{flex:1;min-width:0;overflow-y:auto;display:flex;justify-content:center;padding:28px 24px 40px}
.card{width:100%;max-width:760px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--c,var(--navy));border-radius:10px;padding:24px 28px 28px;align-self:flex-start}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--b);color:var(--c)}
.tc{font-size:12.5px;color:var(--soft);border:1px solid var(--line);padding:5px 12px;border-radius:99px}
.qn{font-family:'Fraunces',serif;font-size:14.5px;color:var(--soft);margin-bottom:6px}
.qt{font-size:18.5px;line-height:1.55;margin:0 0 16px}
.figbox{display:flex;justify-content:center;background:#F7F9FB;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:18px}
.fig{width:100%;max-width:340px;height:auto}
fieldset{border:0;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px 16px;cursor:pointer}
.opt:hover{border-color:var(--navy)}.opt.sel{border-color:var(--navy);background:#F2F6FA}.opt input{margin-top:4px;accent-color:var(--navy)}.ol{font-weight:700;color:var(--navy);width:18px;flex:none}
.nb{display:flex;justify-content:space-between;gap:12px}
.g,.p{font-size:15px;font-weight:700;border-radius:8px;padding:11px 22px;cursor:pointer;border:1px solid transparent}
.g{background:#fff;border-color:var(--line);color:var(--ink)}.g:disabled{opacity:.4;cursor:not-allowed}.p{background:var(--c,var(--navy));color:#fff}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rw{max-width:820px;margin:0 auto;width:100%}.rw h2{font-size:24px}
.hero{display:flex;align-items:baseline;gap:10px;margin:10px 0 20px}.hero .n{font-family:'Fraunces',serif;font-size:52px;font-weight:600}.hero .o{color:var(--soft)}
.bd{display:grid;grid-template-columns:90px 1fr 50px;gap:12px;align-items:center;font-size:14px;margin-bottom:10px}
.bt{height:9px;background:#E7EAEF;border-radius:99px;overflow:hidden}.bt div{height:100%;background:var(--c)}
.ri{border-top:1px solid var(--line);padding:18px 0}.rq{font-size:16px;margin:10px 0}
.ro{padding:7px 12px;border-radius:6px;font-size:14px;margin-bottom:6px;border:1px solid var(--line)}
.ro.c{border-color:var(--ok);background:var(--ok-bg);color:#1E6B3E}.ro.w{border-color:var(--bad);background:var(--bad-bg);color:#8E2A20}
.ex{font-size:14px;color:var(--soft);background:#F6F4EC;border-radius:8px;padding:12px 14px;margin-top:10px}.ex b{color:var(--ink)}
.hidden{display:none!important}
.ov{position:fixed;inset:0;background:rgba(10,20,32,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.mb{background:#fff;border-radius:12px;padding:24px 26px;max-width:380px;border-top:4px solid var(--gold)}
.mb p{font-size:14.5px;color:var(--soft);margin:8px 0 18px}.ma{display:flex;justify-content:flex-end;gap:10px}
@media(max-width:820px){.body{flex-direction:column}aside{width:100%;max-height:36vh;border-right:0}main{padding:18px 14px 30px}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="row"><span class="brand">KW Learning · Ruang Belajar Informatika</span><span class="et">Ujian Bekerja dengan Data Terstruktur</span></div>
<p class="sub">45 soal pilihan ganda dengan gambar lembar kerja, tabel basis data, dan berkas CSV — sedang, sulit, HOTS, dan olimpiade.</p>
<div class="strip"><span style="background:var(--sedang)"></span><span style="background:var(--sulit)"></span><span style="background:var(--hots)"></span><span style="background:var(--olimpiade)"></span></div>
</header>
<div class="body">
<aside id="side"><div class="sc">
<h2>Progres</h2><div class="pt"><div class="pf" id="pf"></div></div><div class="pl" id="pl"></div>
<h2>Navigasi soal</h2><div class="grid" id="grid"></div>
<div class="legend"><span class="sedang"><i></i>Sedang (1–15)</span><span class="sulit"><i></i>Sulit (16–30)</span><span class="hots"><i></i>HOTS (31–40)</span><span class="olimpiade"><i></i>Olimpiade (41–45)</span></div>
</div><div class="sf"><button class="bs" id="bsub">Kumpulkan jawaban</button></div></aside>
<main id="panel" aria-live="polite"></main>
</div></div>
<div class="ov hidden" id="ov"><div class="mb"><h3>Kumpulkan jawaban?</h3><p id="cm"></p><div class="ma"><button class="g" id="no">Kembali</button><button class="p" id="yes">Ya, kumpulkan</button></div></div></div>

<script>
const NS='http://www.w3.org/2000/svg';
// Gambar: lembar kerja, tabel basis data, CSV
const TX=(x,y,t,o)=>`<text x="${x}" y="${y}" font-size="${(o&&o.s)||12}" ${(o&&o.b)?'font-weight="700"':''} text-anchor="${(o&&o.a)||'start'}" fill="${(o&&o.c)||'#1B2430'}" ${(o&&o.m)?'font-family="monospace"':''}>${t}</text>`;
function sheet(d,hl){
  const cw=72,rh=26,L=28,Tt=24,nc=d[0].length,W=L+cw*nc+2,H=Tt+rh*d.length+2;
  let s=`<svg class="fig" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lembar kerja (spreadsheet)">`;
  for(let c=0;c<nc;c++)s+=`<rect x="${L+c*cw}" y="0" width="${cw}" height="${Tt}" fill="#E7EAEF" stroke="#9AA5B1"/>`+TX(L+c*cw+cw/2,16,String.fromCharCode(65+c),{b:1,a:'middle',c:'#5B6473'});
  d.forEach((row,r)=>{s+=`<rect x="0" y="${Tt+r*rh}" width="${L}" height="${rh}" fill="#E7EAEF" stroke="#9AA5B1"/>`+TX(L/2,Tt+r*rh+17,r+1,{b:1,a:'middle',c:'#5B6473'});
    row.forEach((v,c)=>{const h=hl&&r>=hl[0]&&r<=hl[2]&&c>=hl[1]&&c<=hl[3];s+=`<rect x="${L+c*cw}" y="${Tt+r*rh}" width="${cw}" height="${rh}" fill="${h?'#F7E3B5':'#fff'}" stroke="#9AA5B1"/>`+TX(L+c*cw+6,Tt+r*rh+17,v)})});
  return s+'</svg>';
}
function tbl(h,d){
  const nc=h.length,cw=Math.floor(300/nc),rh=28,H=rh*(d.length+1)+16;
  let s=`<svg class="fig" viewBox="0 0 320 ${H}" role="img" aria-label="Tabel basis data">`;
  h.forEach((t,c)=>{s+=`<rect x="${10+c*cw}" y="8" width="${cw}" height="${rh}" fill="#0F3D63" stroke="#0A2B48"/>`+TX(10+c*cw+cw/2,8+18,t,{b:1,a:'middle',c:'#fff',s:13})});
  d.forEach((row,r)=>row.forEach((v,c)=>{s+=`<rect x="${10+c*cw}" y="${8+(r+1)*rh}" width="${cw}" height="${rh}" fill="${r%2?'#F2F6FA':'#fff'}" stroke="#9AA5B1"/>`+TX(10+c*cw+cw/2,8+(r+1)*rh+18,v,{a:'middle',s:13})}));
  return s+'</svg>';
}
function csv(lines){
  const H=lines.length*24+20;let s=`<svg class="fig" viewBox="0 0 320 ${H}" role="img" aria-label="Isi berkas CSV"><rect x="4" y="4" width="312" height="${H-8}" rx="8" fill="#1B2430"/>`;
  lines.forEach((t,i)=>{s+=TX(20,30+i*24,t,{m:1,s:14,c:'#F0F2F5'})});
  return s+'</svg>';
}
const F=(h)=>`<div class="figbox">${h}</div>`;
const S1d=[['Nama','Mat','IPA'],['Ani',80,70],['Budi',90,85],['Citra',70,95],['Dedi',60,75]];
const S1=F(sheet(S1d)),S1B=F(sheet(S1d,[1,1,4,1])),S1C=F(sheet(S1d,[1,2,4,2]));
const S2=F(sheet([['Barang','Harga','Jumlah','Total'],['Pensil',2000,5,10000],['Buku',5000,3,15000],['Penghapus',1500,4,6000]]));
const S3=F(sheet([[2,3,'=A1*B1+A1']]));
const T2=F(tbl(['NIS','Nama','Kelas'],[[1001,'Ani','7A'],[1002,'Budi','7B'],[1003,'Citra','7A'],[1004,'Dedi','7C']]));
const C1=F(csv(['nama,umur,kota','Ani,13,Bogor','Budi,14,Depok']));
const Q=[
// SEDANG
{l:"sedang",t:"Lembar Kerja",f:S1,q:"Pada lembar kerja di atas, sel B3 berisi ...",o:["80","90","Budi","85"],c:1,e:"Kolom B baris 3 adalah nilai Mat milik Budi, yaitu 90."},
{l:"sedang",t:"Lembar Kerja",f:S1,q:"Teks \"Citra\" pada lembar kerja di atas berada pada sel ...",o:["A3","B4","A4","C4"],c:2,e:"Citra berada di kolom A baris 4, yaitu A4."},
{l:"sedang",t:"Rumus",f:S1B,q:"Rumus untuk menjumlahkan seluruh nilai Mat (sel berwarna) adalah ...",o:["=SUM(B2:B5)","=ADD(B2:B5)","=TOTAL(B2,B5)","=B2+B5"],c:0,e:"SUM adalah fungsi penjumlahan, dan B2:B5 adalah rentang sel dari B2 sampai B5."},
{l:"sedang",t:"Rumus",f:S1B,q:"Hasil dari =SUM(B2:B5) pada lembar kerja di atas adalah ...",o:["280","320","300","380"],c:2,e:"80 + 90 + 70 + 60 = 300."},
{l:"sedang",t:"Rumus",f:S1C,q:"Hasil dari =MAX(C2:C5) pada lembar kerja di atas adalah ...",o:["70","85","95","75"],c:2,e:"MAX mengambil nilai terbesar dari 70, 85, 95, 75, yaitu 95."},
{l:"sedang",t:"Rumus",f:S1B,q:"Hasil dari =MIN(B2:B5) pada lembar kerja di atas adalah ...",o:["60","70","80","90"],c:0,e:"MIN mengambil nilai terkecil dari 80, 90, 70, 60, yaitu 60."},
{l:"sedang",t:"Rumus",f:S1B,q:"Hasil dari =AVERAGE(B2:B5) pada lembar kerja di atas adalah ...",o:["70","80","75","300"],c:2,e:"300 : 4 = 75."},
{l:"sedang",t:"Rumus",f:S1B,q:"Hasil dari =COUNT(B2:B5) pada lembar kerja di atas adalah ...",o:["2","4","3","5"],c:1,e:"COUNT menghitung banyak sel berisi angka. Ada 4 sel."},
{l:"sedang",t:"Tipe Data",q:"Nilai 3,14 termasuk tipe data ...",o:["Integer","String","Real (desimal)","Boolean"],c:2,e:"Bilangan pecahan/desimal bertipe real."},
{l:"sedang",t:"Tipe Data",q:"Teks \"Budi\" termasuk tipe data ...",o:["String","Integer","Boolean","Real"],c:0,e:"Rangkaian karakter atau teks bertipe string."},
{l:"sedang",t:"Tipe Data",q:"Tipe data yang hanya memiliki nilai benar (TRUE) atau salah (FALSE) disebut ...",o:["String","Boolean","Integer","Real"],c:1,e:"Tipe data Boolean hanya bernilai TRUE atau FALSE."},
{l:"sedang",t:"Basis Data",f:T2,q:"Setiap baris data pada tabel di atas (misalnya 1002, Budi, 7B) disebut ...",o:["field","record","tabel","kunci"],c:1,e:"Satu baris data lengkap disebut record."},
{l:"sedang",t:"Basis Data",f:T2,q:"Kolom pada tabel di atas, misalnya \"Nama\", disebut ...",o:["field","record","basis data","sel"],c:0,e:"Kolom atau atribut data disebut field."},
{l:"sedang",t:"Kunci Utama",f:T2,q:"Field yang paling cocok dijadikan kunci utama (primary key) pada tabel di atas adalah ...",o:["Nama","Kelas","NIS","Alamat"],c:2,e:"NIS unik untuk setiap siswa, sedangkan nama dan kelas bisa sama."},
{l:"sedang",t:"Format CSV",f:C1,q:"Pada berkas CSV di atas, tanda pemisah antarnilai adalah ...",o:["titik","spasi","koma","garis miring"],c:2,e:"CSV berarti Comma Separated Values, nilai dipisahkan oleh koma."},
// SULIT
{l:"sulit",t:"Rumus",f:S2,q:"Rumus yang tepat pada sel D2 untuk menghitung total harga Pensil adalah ...",o:["=B2+C2","=B2*C2","=B2/C2","=SUM(B2:C2)"],c:1,e:"Total = harga × jumlah, sehingga =B2*C2 (2000 × 5 = 10000)."},
{l:"sulit",t:"Rumus",f:S2,q:"Jika D3 berisi rumus =B3*C3, hasilnya adalah ...",o:["8000","1500","15000","5003"],c:2,e:"5000 × 3 = 15000."},
{l:"sulit",t:"Rumus",f:S2,q:"Hasil dari =SUM(D2:D4) pada lembar kerja di atas adalah ...",o:["25000","31000","30000","35000"],c:1,e:"10000 + 15000 + 6000 = 31000."},
{l:"sulit",t:"Fungsi IF",f:S2,q:"Hasil =IF(B2>3000,\"Mahal\",\"Murah\") pada sel B2 berisi 2000 adalah ...",o:["Mahal","2000","Murah","Error"],c:2,e:"2000 > 3000 salah, sehingga hasilnya \"Murah\"."},
{l:"sulit",t:"Fungsi IF",f:S2,q:"Jika rumus =IF(B3>3000,\"Mahal\",\"Murah\") digunakan pada B3 yang berisi 5000, hasilnya adalah ...",o:["Murah","Mahal","5000","Error"],c:1,e:"5000 > 3000 benar, sehingga hasilnya \"Mahal\"."},
{l:"sulit",t:"Pengurutan",q:"Mengurutkan data dari nilai terkecil ke nilai terbesar disebut pengurutan ...",o:["menurun (descending)","filter","menaik (ascending)","acak"],c:2,e:"Ascending berarti dari kecil ke besar."},
{l:"sulit",t:"Filter",q:"Fitur untuk menampilkan hanya data yang memenuhi kriteria tertentu adalah ...",o:["filter","sort","merge","chart"],c:0,e:"Filter menyaring data sesuai kriteria."},
{l:"sulit",t:"Referensi Sel",q:"Penulisan $A$1 pada rumus menunjukkan referensi sel ...",o:["relatif","teks","absolut","rumus"],c:2,e:"Tanda $ mengunci kolom dan baris sehingga tidak berubah saat rumus disalin."},
{l:"sulit",t:"Menyalin Rumus",q:"Rumus =A1+B1 pada sel C1 disalin ke sel C2. Rumus pada sel C2 menjadi ...",o:["=A1+B1","=A1+B2","=A2+B1","=A2+B2"],c:3,e:"Referensi relatif ikut bergeser satu baris ke bawah, sehingga menjadi =A2+B2."},
{l:"sulit",t:"Rumus",f:S2,q:"Hasil dari =AVERAGE(C2:C4) pada lembar kerja di atas adalah ...",o:["3","5","4","12"],c:2,e:"(5 + 3 + 4) : 3 = 4."},
{l:"sulit",t:"Kunci Utama",q:"Fungsi utama primary key pada tabel basis data adalah ...",o:["menyimpan gambar","mengurutkan data","mengidentifikasi setiap record secara unik","menghapus data"],c:2,e:"Primary key membedakan satu record dengan record lain."},
{l:"sulit",t:"Record dan Field",f:T2,q:"Banyak record (tanpa baris judul) pada tabel di atas adalah ...",o:["3","5","4","12"],c:2,e:"Ada 4 baris data: Ani, Budi, Citra, Dedi."},
{l:"sulit",t:"Record dan Field",f:T2,q:"Banyak field pada tabel di atas adalah ...",o:["2","3","4","12"],c:1,e:"Field: NIS, Nama, Kelas = 3 field."},
{l:"sulit",t:"Format CSV",f:C1,q:"Nilai kota pada record milik Budi di berkas CSV di atas adalah ...",o:["Bogor","Depok","14","Ani"],c:1,e:"Record Budi: Budi,14,Depok. Kolom ketiga (kota) adalah Depok."},
{l:"sulit",t:"Tipe Data",f:C1,q:"Nilai pada kolom umur di berkas CSV di atas sebaiknya bertipe data ...",o:["String","Real","Integer","Boolean"],c:2,e:"Umur berupa bilangan bulat, sehingga bertipe integer."},
// HOTS
{l:"hots",t:"Memilih Rumus",f:S1C,q:"Rumus untuk mencari rata-rata nilai IPA seluruh siswa (sel berwarna) adalah ...",o:["=SUM(C2:C5)","=MAX(C2:C5)","=AVERAGE(C2:C5)","=COUNT(C2:C5)"],c:2,e:"Rata-rata dihitung dengan fungsi AVERAGE."},
{l:"hots",t:"Menghitung Rumus",f:S1C,q:"Hasil dari =AVERAGE(C2:C5) pada lembar kerja di atas adalah ...",o:["80","81,25","82,5","325"],c:1,e:"(70 + 85 + 95 + 75) : 4 = 325 : 4 = 81,25."},
{l:"hots",t:"Fungsi IF",f:S1,q:"Sel D5 berisi =IF(B5>=75,\"Lulus\",\"Remedial\"). Hasilnya adalah ...",o:["Lulus","Remedial","60","Error"],c:1,e:"B5 = 60. Karena 60 >= 75 salah, hasilnya \"Remedial\"."},
{l:"hots",t:"Membaca Data",f:S1,q:"Siswa dengan nilai IPA tertinggi pada lembar kerja di atas adalah ...",o:["Ani","Budi","Citra","Dedi"],c:2,e:"Nilai IPA tertinggi adalah 95, milik Citra."},
{l:"hots",t:"Pengurutan",f:S1,q:"Jika data diurutkan menurun berdasarkan kolom Mat, nama siswa pada urutan pertama adalah ...",o:["Ani","Budi","Citra","Dedi"],c:1,e:"Mat tertinggi 90, milik Budi."},
{l:"hots",t:"Menghitung Rumus",f:S1,q:"Rumus =B2+C2 pada lembar kerja di atas menghasilkan nilai ...",o:["150","80","70","160"],c:0,e:"B2 = 80 dan C2 = 70, sehingga 80 + 70 = 150."},
{l:"hots",t:"Relasi Antartabel",q:"Field pada suatu tabel yang merujuk ke primary key tabel lain disebut ...",o:["primary key","foreign key","record","index"],c:1,e:"Foreign key (kunci tamu) menghubungkan dua tabel."},
{l:"hots",t:"Data Terstruktur",q:"Keunggulan data terstruktur dibandingkan data tidak terstruktur adalah data ...",o:["ditulis tanpa aturan","disembunyikan","mudah dicari dan diolah","tidak perlu disimpan"],c:2,e:"Data terstruktur tersusun teratur sehingga mudah dicari, diurutkan, dan dihitung."},
{l:"hots",t:"Data Terstruktur",q:"Berikut ini yang merupakan contoh data tidak terstruktur adalah ...",o:["tabel nilai siswa","lembar kerja penjualan","rekaman video","berkas CSV daftar hadir"],c:2,e:"Video tidak tersusun dalam baris dan kolom, sehingga tidak terstruktur."},
{l:"hots",t:"Rumus Setara",f:S1B,q:"Hasil dari =SUM(B2:B5)/COUNT(B2:B5) pada lembar kerja di atas sama dengan hasil fungsi AVERAGE, yaitu ...",o:["70","75","80","300"],c:1,e:"300 : 4 = 75."},
// OLIMPIADE
{l:"olimpiade",t:"Membaca Rumus",f:S3,q:"Sel C1 berisi rumus =A1*B1+A1. Nilai yang ditampilkan pada C1 adalah ...",o:["6","8","10","12"],c:1,e:"A1*B1 = 2 × 3 = 6, lalu ditambah A1 = 2, sehingga 8."},
{l:"olimpiade",t:"Fungsi IF",f:S3,q:"Hasil dari =IF(A1>B1,A1,B1) pada lembar kerja di atas adalah ...",o:["2","5","3","FALSE"],c:2,e:"A1 > B1 salah (2 > 3), sehingga yang diambil B1 = 3."},
{l:"olimpiade",t:"Rentang Sel",q:"Banyak sel pada rentang A1:C4 adalah ...",o:["7","10","12","16"],c:2,e:"3 kolom × 4 baris = 12 sel."},
{l:"olimpiade",t:"Referensi Campuran",q:"Rumus =$A1+B$1 pada sel C2 disalin ke sel D3. Rumus pada D3 menjadi ...",o:["=$A2+C$1","=$A1+B$1","=$A2+B$1","=$B2+C$1"],c:0,e:"Kolom A terkunci ($A) dan baris 1 terkunci (B$1). Baris pada $A1 ikut bergeser jadi $A2, kolom pada B$1 bergeser jadi C$1."},
{l:"olimpiade",t:"Format CSV",q:"Berkas CSV berisi 1 baris judul dan 1.000 record data. Banyak baris seluruhnya dalam berkas tersebut adalah ...",o:["1.000","1.001","3.003","3.000"],c:1,e:"1 baris judul + 1.000 baris data = 1.001 baris."}
];
const LB={sedang:"Sedang",sulit:"Sulit",hots:"HOTS",olimpiade:"Olimpiade"},LT=['A','B','C','D'];
const S={cur:0,ans:Q.map(()=>null),done:false};
const $=id=>document.getElementById(id),panel=$('panel'),grid=$('grid');
Q.forEach((q,i)=>{const b=document.createElement('button');b.type='button';b.className='cell '+q.l;b.textContent=i+1;b.setAttribute('aria-label','Soal '+(i+1)+', '+LB[q.l]);b.onclick=()=>{S.cur=i;render()};grid.appendChild(b)});
function upd(){grid.childNodes.forEach((c,i)=>{c.classList.toggle('answered',S.ans[i]!==null);c.classList.toggle('current',i===S.cur&&!S.done)});
 const n=S.ans.filter(a=>a!==null).length;$('pf').style.width=Math.round(n/Q.length*100)+'%';$('pl').textContent=n+' dari '+Q.length+' soal terjawab'}
function confirmBox(msg,ok){$('cm').textContent=msg;$('ov').classList.remove('hidden');$('no').onclick=()=>$('ov').classList.add('hidden');$('yes').onclick=()=>{$('ov').classList.add('hidden');ok()}}
function submit(){const u=S.ans.filter(a=>a===null).length;const go=()=>{S.done=true;results()};u?confirmBox('Masih ada '+u+' soal belum dijawab. Tetap kumpulkan?',go):go()}
$('bsub').onclick=submit;
function question(){
  const i=S.cur,q=Q[i];
  panel.innerHTML=`<div class="card ${q.l}"><div class="chips"><span class="chip">${LB[q.l]}</span><span class="tc">${q.t}</span></div>
  <div class="qn">Soal ${i+1} dari ${Q.length}</div>${q.f||''}<p class="qt">${q.q}</p>
  <fieldset>${q.o.map((o,k)=>`<label class="opt${S.ans[i]===k?' sel':''}"><input type="radio" name="o" value="${k}"${S.ans[i]===k?' checked':''}><span class="ol">${LT[k]}.</span><span>${o}</span></label>`).join('')}</fieldset>
  <div class="nb"><button type="button" class="g" id="pv"${i?'':' disabled'}>Sebelumnya</button><button type="button" class="p" id="nx">${i===Q.length-1?'Ke ringkasan':'Berikutnya'}</button></div></div>`;
  panel.querySelectorAll('input').forEach(inp=>inp.onchange=e=>{S.ans[i]=+e.target.value;panel.querySelectorAll('.opt').forEach((el,k)=>el.classList.toggle('sel',k===S.ans[i]));upd()});
  $('pv').onclick=()=>{S.cur--;render()};
  $('nx').onclick=()=>i===Q.length-1?submit():(S.cur++,render());
}
function results(){
  const cnt={};Object.keys(LB).forEach(k=>cnt[k]=[0,0]);let tot=0;
  Q.forEach((q,i)=>{cnt[q.l][1]++;if(S.ans[i]===q.c){cnt[q.l][0]++;tot++}});
  const sc=Math.round(tot/Q.length*100),col=sc>=75?'var(--ok)':sc>=50?'var(--gold)':'var(--bad)';
  $('side').classList.add('hidden');
  panel.innerHTML=`<div class="rw"><h2>Hasil ujian</h2><div class="hero"><span class="n" style="color:${col}">${tot}</span><span class="o">dari ${Q.length} soal benar · nilai akhir <b style="color:${col}">${sc}</b></span></div>
  ${Object.keys(LB).map(k=>`<div class="bd ${k}"><span>${LB[k]}</span><div class="bt"><div style="width:${cnt[k][1]?cnt[k][0]/cnt[k][1]*100:0}%"></div></div><span>${cnt[k][0]}/${cnt[k][1]}</span></div>`).join('')}
  <button class="g" id="rt">Ulangi ujian</button>
  <div style="margin-top:24px">${Q.map((q,i)=>{const a=S.ans[i],ok=a===q.c;return `<div class="ri ${q.l}"><div class="chips"><span class="chip">${LB[q.l]}</span><span class="tc">${q.t}</span><span class="tc" style="color:${ok?'var(--ok)':'var(--bad)'};border-color:currentColor">${ok?'Benar':a===null?'Tidak dijawab':'Salah'}</span></div>${q.f||''}<p class="rq">${i+1}. ${q.q}</p>${q.o.map((o,k)=>`<div class="ro ${k===q.c?'c':k===a?'w':''}">${LT[k]}. ${o}</div>`).join('')}<div class="ex"><b>Pembahasan:</b> ${q.e}</div></div>`}).join('')}</div></div>`;
  $('rt').onclick=()=>{S.cur=0;S.ans=Q.map(()=>null);S.done=false;$('side').classList.remove('hidden');render()};
  panel.scrollTo(0,0);
}
function render(){if(S.done)return results();question();upd();panel.scrollTo(0,0)}
render();
</script>
</body>
</html>
