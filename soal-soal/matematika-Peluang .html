<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ujian Peluang — KW Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F0F2F5;--panel:#fff;--ink:#1B2430;--soft:#5B6473;--navy:#0F3D63;--deep:#0A2B48;--gold:#D79A2C;--line:#DDE2E8;
--sedang:#2E86AB;--sedang-bg:#EAF3F8;--sulit:#C9642A;--sulit-bg:#FBEEE4;--hots:#7B4FA6;--hots-bg:#F1EAF8;--olimpiade:#B23A48;--olimpiade-bg:#FAEBEC;--ok:#2F9E5B;--ok-bg:#E7F5EC;--bad:#C0392B;--bad-bg:#FBEBE9;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper)}
body{color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;overflow:hidden}
h2,h3{font-family:'Fraunces',Georgia,serif;margin:0}button{font-family:inherit}
.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{flex:none;background:linear-gradient(120deg,var(--navy),var(--deep));color:#fff;padding:10px 26px 0}
.row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
.brand{font-size:13px;color:#B9C6D6;font-weight:600}.et{font-family:'Fraunces',serif;font-weight:600;font-size:18px}
.sub{margin:4px 0 8px;color:#C7D2DE;font-size:12.5px}
.strip{display:flex;height:4px}.strip span{flex:1}
.body{flex:1;display:flex;min-height:0}
aside{width:270px;flex:none;background:var(--panel);border-right:1px solid var(--line);border-top:3px solid var(--gold);display:flex;flex-direction:column;min-height:0}
.sc{flex:1;overflow-y:auto;padding:18px}
aside h2{font-size:13px;color:var(--soft);margin-bottom:10px;font-family:'Public Sans',sans-serif;font-weight:700}
.pt{height:7px;background:#E7EAEF;border-radius:99px;overflow:hidden;margin-bottom:6px}.pf{height:100%;background:var(--gold);width:0;transition:width .25s}
.pl{font-size:12.5px;color:var(--soft);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.cell{aspect-ratio:1;border-radius:6px;border:1.5px solid;font-size:12.5px;font-weight:700;cursor:pointer;padding:0;background:#fff}
.sedang{--c:var(--sedang);--b:var(--sedang-bg)}.sulit{--c:var(--sulit);--b:var(--sulit-bg)}.hots{--c:var(--hots);--b:var(--hots-bg)}.olimpiade{--c:var(--olimpiade);--b:var(--olimpiade-bg)}
.cell{border-color:var(--c);color:var(--c);background:var(--b)}.cell.answered{background:var(--c);color:#fff}.cell.current{outline:2.5px solid var(--gold);outline-offset:1px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--soft)}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:8px}
.sf{padding:14px 18px;border-top:1px solid var(--line)}
.bs{width:100%;background:var(--gold);color:#2A1D06;border:0;border-radius:8px;padding:12px;font-size:14.5px;font-weight:700;cursor:pointer}
main{flex:1;min-width:0;overflow-y:auto;display:flex;justify-content:center;padding:28px 24px 40px}
.card{width:100%;max-width:760px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--c,var(--navy));border-radius:10px;padding:24px 28px 28px;align-self:flex-start}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--b);color:var(--c)}
.tc{font-size:12.5px;color:var(--soft);border:1px solid var(--line);padding:5px 12px;border-radius:99px}
.qn{font-family:'Fraunces',serif;font-size:14.5px;color:var(--soft);margin-bottom:6px}
.qt{font-size:18.5px;line-height:1.55;margin:0 0 16px}
.figbox{display:flex;justify-content:center;background:#F7F9FB;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:18px}
.fig{width:100%;max-width:340px;height:auto}
fieldset{border:0;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px 16px;cursor:pointer}
.opt:hover{border-color:var(--navy)}.opt.sel{border-color:var(--navy);background:#F2F6FA}.opt input{margin-top:4px;accent-color:var(--navy)}.ol{font-weight:700;color:var(--navy);width:18px;flex:none}
.nb{display:flex;justify-content:space-between;gap:12px}
.g,.p{font-size:15px;font-weight:700;border-radius:8px;padding:11px 22px;cursor:pointer;border:1px solid transparent}
.g{background:#fff;border-color:var(--line);color:var(--ink)}.g:disabled{opacity:.4;cursor:not-allowed}.p{background:var(--c,var(--navy));color:#fff}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rw{max-width:820px;margin:0 auto;width:100%}.rw h2{font-size:24px}
.hero{display:flex;align-items:baseline;gap:10px;margin:10px 0 20px}.hero .n{font-family:'Fraunces',serif;font-size:52px;font-weight:600}.hero .o{color:var(--soft)}
.bd{display:grid;grid-template-columns:90px 1fr 50px;gap:12px;align-items:center;font-size:14px;margin-bottom:10px}
.bt{height:9px;background:#E7EAEF;border-radius:99px;overflow:hidden}.bt div{height:100%;background:var(--c)}
.ri{border-top:1px solid var(--line);padding:18px 0}.rq{font-size:16px;margin:10px 0}
.ro{padding:7px 12px;border-radius:6px;font-size:14px;margin-bottom:6px;border:1px solid var(--line)}
.ro.c{border-color:var(--ok);background:var(--ok-bg);color:#1E6B3E}.ro.w{border-color:var(--bad);background:var(--bad-bg);color:#8E2A20}
.ex{font-size:14px;color:var(--soft);background:#F6F4EC;border-radius:8px;padding:12px 14px;margin-top:10px}.ex b{color:var(--ink)}
.hidden{display:none!important}
.ov{position:fixed;inset:0;background:rgba(10,20,32,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.mb{background:#fff;border-radius:12px;padding:24px 26px;max-width:380px;border-top:4px solid var(--gold)}
.mb p{font-size:14.5px;color:var(--soft);margin:8px 0 18px}.ma{display:flex;justify-content:flex-end;gap:10px}
@media(max-width:820px){.body{flex-direction:column}aside{width:100%;max-height:36vh;border-right:0}main{padding:18px 14px 30px}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="row"><span class="brand">KW Learning · Ruang Belajar Matematika</span><span class="et">Ujian Peluang</span></div>
<p class="sub">45 soal pilihan ganda dengan gambar dadu, kelereng, roda putar, dan tabel ruang sampel — sedang, sulit, HOTS, dan olimpiade.</p>
<div class="strip"><span style="background:var(--sedang)"></span><span style="background:var(--sulit)"></span><span style="background:var(--hots)"></span><span style="background:var(--olimpiade)"></span></div>
</header>
<div class="body">
<aside id="side"><div class="sc">
<h2>Progres</h2><div class="pt"><div class="pf" id="pf"></div></div><div class="pl" id="pl"></div>
<h2>Navigasi soal</h2><div class="grid" id="grid"></div>
<div class="legend"><span class="sedang"><i></i>Sedang (1–15)</span><span class="sulit"><i></i>Sulit (16–30)</span><span class="hots"><i></i>HOTS (31–40)</span><span class="olimpiade"><i></i>Olimpiade (41–45)</span></div>
</div><div class="sf"><button class="bs" id="bsub">Kumpulkan jawaban</button></div></aside>
<main id="panel" aria-live="polite"></main>
</div></div>
<div class="ov hidden" id="ov"><div class="mb"><h3>Kumpulkan jawaban?</h3><p id="cm"></p><div class="ma"><button class="g" id="no">Kembali</button><button class="p" id="yes">Ya, kumpulkan</button></div></div></div>

<script>
const NS='http://www.w3.org/2000/svg';
// Gambar: dadu, kelereng, spinner, ruang sampel
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dice(arr){
  const sz=44,g=8,w=arr.length*(sz+g)-g,x0=(320-w)/2;
  let s=`<svg class="fig" viewBox="0 0 320 64" role="img" aria-label="Gambar dadu">`;
  arr.forEach((v,i)=>{const x=x0+i*(sz+g);s+=`<rect x="${x}" y="10" width="${sz}" height="${sz}" rx="8" fill="#fff" stroke="#0F3D63" stroke-width="2"/>`;
    PIPS[v].forEach(k=>{s+=`<circle cx="${x+sz*(.25+.25*(k%3))}" cy="${10+sz*(.25+.25*Math.floor(k/3))}" r="3.6" fill="#0F3D63"/>`})});
  return s+'</svg>';
}
const MC={Merah:'#C0392B',Biru:'#2E86AB',Hijau:'#2F9E5B',Kuning:'#D79A2C'};
function marbles(list){
  let s=`<svg class="fig" viewBox="0 0 320 120" role="img" aria-label="Kelereng dalam kantong"><rect x="20" y="6" width="280" height="76" rx="14" fill="#F6F4EC" stroke="#B8AD8E" stroke-width="2"/>`,k=0;
  list.forEach(([c,n])=>{for(let j=0;j<n;j++,k++){const x=44+(k%8)*30,y=26+Math.floor(k/8)*28;s+=`<circle cx="${x}" cy="${y}" r="11" fill="${MC[c]}" stroke="#fff" stroke-width="2"/>`}});
  list.forEach(([c,n],i)=>{s+=`<circle cx="${30+i*76}" cy="104" r="6" fill="${MC[c]}"/><text x="${40+i*76}" y="108" font-size="12">${c}: ${n}</text>`});
  return s+'</svg>';
}
function spinner(n){
  const C=['#2E86AB','#C9642A','#7B4FA6','#2F9E5B','#D79A2C'];let s=`<svg class="fig" viewBox="0 0 320 190" role="img" aria-label="Roda putar bernomor 1 sampai ${n}">`;
  for(let i=0;i<n;i++){const a1=-Math.PI/2+i*2*Math.PI/n,a2=a1+2*Math.PI/n,m=(a1+a2)/2;
    s+=`<path d="M160 100L${160+82*Math.cos(a1)} ${100+82*Math.sin(a1)}A82 82 0 0 1 ${160+82*Math.cos(a2)} ${100+82*Math.sin(a2)}z" fill="${C[i%5]}" stroke="#fff" stroke-width="2"/><text x="${160+56*Math.cos(m)}" y="${105+56*Math.sin(m)}" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">${i+1}</text>`}
  return s+`<path d="M160 22l-8-14h16z" fill="#1B2430"/><circle cx="160" cy="100" r="6" fill="#fff" stroke="#1B2430"/></svg>`;
}
function sumtab(t,ge){
  let s=`<svg class="fig" viewBox="0 0 320 226" role="img" aria-label="Tabel jumlah mata dua dadu"><text x="190" y="14" font-size="12" text-anchor="middle" fill="#5B6473">Dadu kedua</text>`;
  for(let i=1;i<=6;i++){s+=`<text x="${70+(i-.5)*30}" y="30" font-size="12" font-weight="700" text-anchor="middle">${i}</text><text x="62" y="${36+(i-.5)*30+4}" font-size="12" font-weight="700" text-anchor="end">${i}</text>`;
    for(let j=1;j<=6;j++){const v=i+j,h=ge?v>=t:v===t;s+=`<rect x="${70+(j-1)*30}" y="${36+(i-1)*30}" width="30" height="30" fill="${h?'#D79A2C':'#fff'}" stroke="#0F3D63"/><text x="${70+(j-.5)*30}" y="${36+(i-.5)*30+4}" font-size="12" text-anchor="middle">${v}</text>`}}
  return s+`<text x="16" y="124" font-size="12" fill="#5B6473" text-anchor="middle" transform="rotate(-90 16 124)">Dadu pertama</text></svg>`;
}
const F=(h)=>`<div class="figbox">${h}</div>`;
const D6=F(dice([1,2,3,4,5,6])),M1=F(marbles([['Merah',5],['Biru',3],['Hijau',2]])),M2=F(marbles([['Merah',4],['Biru',6],['Kuning',5]]));
const S8=F(spinner(8)),S10=F(spinner(10)),G7=F(sumtab(7)),G5=F(sumtab(5)),G10=F(sumtab(10,1));
const Q=[
// SEDANG
{l:"sedang",t:"Peluang Dadu",f:D6,q:"Sebuah dadu dilempar satu kali. Peluang muncul mata dadu 3 adalah ...",o:["1/3","1/6","1/2","1/4"],c:1,e:"Ada 1 kejadian yang diinginkan dari 6 kemungkinan, sehingga P = 1/6."},
{l:"sedang",t:"Peluang Koin",q:"Sebuah koin dilempar satu kali. Peluang muncul sisi angka adalah ...",o:["1/4","1/3","1/2","1"],c:2,e:"Ruang sampel {A, G}, sehingga P(A) = 1/2."},
{l:"sedang",t:"Ruang Sampel",f:D6,q:"Banyak anggota ruang sampel pada pelemparan sebuah dadu adalah ...",o:["2","4","6","12"],c:2,e:"Ruang sampel S = {1, 2, 3, 4, 5, 6}, sehingga n(S) = 6."},
{l:"sedang",t:"Peluang Dadu",f:D6,q:"Peluang muncul mata dadu bilangan genap adalah ...",o:["1/6","1/3","1/2","2/3"],c:2,e:"Genap = {2, 4, 6}, sehingga P = 3/6 = 1/2."},
{l:"sedang",t:"Kejadian Mustahil",q:"Peluang kejadian yang mustahil terjadi adalah ...",o:["0","1/2","1","tidak terhingga"],c:0,e:"Kejadian mustahil memiliki peluang 0."},
{l:"sedang",t:"Kejadian Pasti",q:"Peluang kejadian yang pasti terjadi adalah ...",o:["0","1/2","1","2"],c:2,e:"Kejadian pasti memiliki peluang 1."},
{l:"sedang",t:"Peluang Kelereng",f:M1,q:"Dari kantong di atas diambil satu kelereng secara acak. Peluang terambil kelereng merah adalah ...",o:["1/5","3/10","1/2","2/5"],c:2,e:"5 merah dari 10 kelereng, P = 5/10 = 1/2."},
{l:"sedang",t:"Peluang Kelereng",f:M1,q:"Peluang terambil kelereng biru pada kantong di atas adalah ...",o:["3/10","3/7","1/3","3/5"],c:0,e:"3 biru dari 10 kelereng, P = 3/10."},
{l:"sedang",t:"Komplemen Kejadian",f:M1,q:"Peluang terambil kelereng yang bukan hijau pada kantong di atas adalah ...",o:["1/5","4/5","3/5","2/5"],c:1,e:"P(hijau) = 2/10, sehingga P(bukan hijau) = 1 − 1/5 = 4/5."},
{l:"sedang",t:"Peluang Roda Putar",f:S8,q:"Roda putar di atas memiliki 8 bagian sama besar. Peluang jarum berhenti di bilangan prima adalah ...",o:["3/8","1/2","5/8","1/4"],c:1,e:"Bilangan prima: 2, 3, 5, 7 (4 bilangan). P = 4/8 = 1/2."},
{l:"sedang",t:"Peluang Roda Putar",f:S8,q:"Peluang jarum berhenti di bilangan lebih dari 6 pada roda putar di atas adalah ...",o:["1/8","1/4","3/8","1/2"],c:1,e:"Bilangan lebih dari 6: 7 dan 8. P = 2/8 = 1/4."},
{l:"sedang",t:"Ruang Sampel",q:"Banyak anggota ruang sampel pada pelemparan dua koin sekaligus adalah ...",o:["2","3","4","6"],c:2,e:"S = {AA, AG, GA, GG}, jadi n(S) = 4."},
{l:"sedang",t:"Frekuensi Harapan",q:"Sebuah koin dilempar 100 kali. Frekuensi harapan muncul sisi gambar adalah ...",o:["25","40","50","100"],c:2,e:"Fh = P × banyak percobaan = 1/2 × 100 = 50."},
{l:"sedang",t:"Peluang Empirik",q:"Sebuah koin dilempar 20 kali dan muncul angka 12 kali. Peluang empirik muncul angka adalah ...",o:["2/5","3/5","1/2","12"],c:1,e:"P = 12/20 = 3/5."},
{l:"sedang",t:"Peluang Kartu",q:"Sepuluh kartu bernomor 1 sampai 10 dikocok, lalu diambil satu. Peluang terambil kartu kelipatan 5 adalah ...",o:["1/10","1/5","1/2","2/5"],c:1,e:"Kelipatan 5: 5 dan 10. P = 2/10 = 1/5."},
// SULIT
{l:"sulit",t:"Dua Dadu",f:G7,q:"Dua dadu dilempar bersamaan. Pada tabel di atas, peluang jumlah kedua mata dadu 7 (sel berwarna) adalah ...",o:["1/12","1/6","1/9","7/36"],c:1,e:"Ada 6 pasangan berjumlah 7 dari 36. P = 6/36 = 1/6."},
{l:"sulit",t:"Ruang Sampel Dua Dadu",f:G7,q:"Banyak anggota ruang sampel pada pelemparan dua dadu (lihat tabel) adalah ...",o:["12","18","36","6"],c:2,e:"6 × 6 = 36 pasangan."},
{l:"sulit",t:"Dua Dadu",f:G5,q:"Pada tabel di atas, peluang jumlah mata dua dadu sama dengan 5 adalah ...",o:["1/12","1/9","5/36","1/6"],c:1,e:"Pasangan berjumlah 5: (1,4), (2,3), (3,2), (4,1) = 4. P = 4/36 = 1/9."},
{l:"sulit",t:"Dua Dadu",f:G10,q:"Peluang jumlah mata dua dadu paling sedikit 10 (sel berwarna pada tabel) adalah ...",o:["1/12","1/9","1/6","5/36"],c:2,e:"Jumlah 10, 11, 12: 3 + 2 + 1 = 6 pasangan. P = 6/36 = 1/6."},
{l:"sulit",t:"Dua Dadu",q:"Dua dadu dilempar bersamaan. Peluang kedua dadu menunjukkan mata yang sama adalah ...",o:["1/36","1/12","1/6","1/3"],c:2,e:"(1,1), (2,2), ..., (6,6) = 6 pasangan. P = 6/36 = 1/6."},
{l:"sulit",t:"Dua Koin",q:"Dua koin dilempar bersamaan. Peluang muncul satu angka dan satu gambar adalah ...",o:["1/4","1/3","1/2","3/4"],c:2,e:"AG dan GA = 2 dari 4. P = 1/2."},
{l:"sulit",t:"Tiga Koin",q:"Tiga koin dilempar bersamaan. Peluang muncul tepat dua gambar adalah ...",o:["1/8","3/8","1/4","1/2"],c:1,e:"Kejadian: GGA, GAG, AGG = 3 dari 8. P = 3/8."},
{l:"sulit",t:"Peluang Kelereng",f:M2,q:"Dari kantong di atas diambil satu kelereng secara acak. Peluang terambil kelereng bukan biru adalah ...",o:["2/5","3/5","2/3","1/3"],c:1,e:"Bukan biru = 4 + 5 = 9 dari 15. P = 9/15 = 3/5."},
{l:"sulit",t:"Peluang Kelereng",f:M2,q:"Peluang terambil kelereng kuning atau merah pada kantong di atas adalah ...",o:["1/3","2/5","3/5","4/5"],c:2,e:"Kuning + merah = 5 + 4 = 9 dari 15. P = 3/5."},
{l:"sulit",t:"Frekuensi Harapan",q:"Peluang turun hujan pada suatu hari adalah 0,3. Dalam 30 hari, frekuensi harapan turun hujan adalah ... hari.",o:["3","9","10","12"],c:1,e:"Fh = 0,3 × 30 = 9 hari."},
{l:"sulit",t:"Peluang Kartu",q:"Sebuah kartu diambil dari satu set kartu remi (52 kartu). Peluang terambil kartu hati adalah ...",o:["1/13","1/4","1/2","1/3"],c:1,e:"Ada 13 kartu hati. P = 13/52 = 1/4."},
{l:"sulit",t:"Peluang Kartu",q:"Peluang terambil kartu As dari satu set kartu remi adalah ...",o:["1/52","1/26","1/13","1/4"],c:2,e:"Ada 4 kartu As. P = 4/52 = 1/13."},
{l:"sulit",t:"Peluang Roda Putar",f:S10,q:"Roda putar di atas memiliki 10 bagian sama besar. Peluang jarum berhenti di bilangan kelipatan 3 adalah ...",o:["1/5","3/10","2/5","1/2"],c:1,e:"Kelipatan 3: 3, 6, 9. P = 3/10."},
{l:"sulit",t:"Peluang Dadu",q:"Sebuah dadu dilempar satu kali. Peluang muncul mata dadu yang merupakan faktor dari 6 adalah ...",o:["1/3","1/2","2/3","5/6"],c:2,e:"Faktor 6: 1, 2, 3, 6. P = 4/6 = 2/3."},
{l:"sulit",t:"Frekuensi Harapan",q:"Sebuah dadu dilempar 60 kali. Frekuensi harapan muncul mata dadu 6 adalah ...",o:["6","10","12","15"],c:1,e:"Fh = 1/6 × 60 = 10."},
// HOTS
{l:"hots",t:"Tanpa Pengembalian",q:"Kantong berisi 3 kelereng merah dan 5 kelereng putih. Satu kelereng merah diambil dan tidak dikembalikan. Peluang pengambilan kedua terambil kelereng putih adalah ...",o:["5/8","5/7","4/7","3/7"],c:1,e:"Setelah satu merah terambil, sisa 7 kelereng dengan 5 putih. P = 5/7."},
{l:"hots",t:"Dengan Pengembalian",q:"Kantong berisi 4 kelereng merah dan 6 kelereng biru. Dua kelereng diambil satu per satu dengan pengembalian. Peluang keduanya merah adalah ...",o:["2/15","4/25","16/25","2/5"],c:1,e:"P = 4/10 × 4/10 = 2/5 × 2/5 = 4/25."},
{l:"hots",t:"Dua Dadu",q:"Dua dadu dilempar bersamaan. Peluang jumlah mata dadu merupakan bilangan prima adalah ...",o:["1/3","5/12","1/2","7/12"],c:1,e:"Jumlah prima: 2 (1), 3 (2), 5 (4), 7 (6), 11 (2) = 15 pasangan. P = 15/36 = 5/12."},
{l:"hots",t:"Frekuensi Harapan",q:"Peluang seorang siswa lulus ujian adalah 0,85. Dari 200 siswa seperti itu, banyak yang diperkirakan tidak lulus adalah ...",o:["15","30","170","185"],c:1,e:"P(tidak lulus) = 0,15. Fh = 0,15 × 200 = 30."},
{l:"hots",t:"Komplemen Kejadian",q:"Tiga koin dilempar bersamaan. Peluang muncul paling sedikit satu gambar adalah ...",o:["3/8","1/2","7/8","1"],c:2,e:"P(tanpa gambar) = 1/8, sehingga P = 1 − 1/8 = 7/8."},
{l:"hots",t:"Bilangan dari Angka",q:"Dari angka 1, 2, 3 disusun bilangan tiga angka berbeda. Peluang terbentuk bilangan genap adalah ...",o:["1/6","1/3","1/2","2/3"],c:1,e:"Ada 6 bilangan. Genap (berakhiran 2): 132 dan 312 = 2. P = 2/6 = 1/3."},
{l:"hots",t:"Gabungan Kejadian",q:"Sebuah dadu dilempar satu kali. Peluang muncul mata dadu prima atau genap adalah ...",o:["1/2","2/3","5/6","1"],c:2,e:"Prima {2, 3, 5}, genap {2, 4, 6}. Gabungannya {2, 3, 4, 5, 6} = 5 anggota. P = 5/6."},
{l:"hots",t:"Peluang Dipilih",q:"Dalam suatu kelas terdapat 40 siswa, 24 di antaranya laki-laki. Jika dipilih satu siswa secara acak, peluang terpilih siswa perempuan adalah ...",o:["3/5","1/5","3/2","2/5"],c:3,e:"Perempuan = 40 − 24 = 16. P = 16/40 = 2/5."},
{l:"hots",t:"Dua Dadu",q:"Dadu merah dan dadu biru dilempar bersamaan. Peluang mata dadu merah kurang dari mata dadu biru adalah ...",o:["1/3","1/2","5/12","7/12"],c:2,e:"Pasangan merah < biru: 5 + 4 + 3 + 2 + 1 = 15. P = 15/36 = 5/12."},
{l:"hots",t:"Pengambilan Sekaligus",q:"Dari lima kartu A, B, C, D, E diambil dua kartu sekaligus. Peluang kartu A ikut terambil adalah ...",o:["1/5","2/5","3/5","1/2"],c:1,e:"Ada 10 pasangan, 4 di antaranya memuat A. P = 4/10 = 2/5."},
// OLIMPIADE
{l:"olimpiade",t:"Dua Dadu",q:"Dua dadu dilempar bersamaan. Peluang hasil kali kedua mata dadu genap adalah ...",o:["1/2","2/3","3/4","5/6"],c:2,e:"Hasil kali ganjil hanya jika keduanya ganjil: 3/6 × 3/6 = 1/4. Jadi P(genap) = 3/4."},
{l:"olimpiade",t:"Bilangan dari Angka",q:"Dari angka 1, 2, 3, 4, 5 disusun bilangan tiga angka dengan angka-angka berbeda. Peluang bilangan tersebut ganjil adalah ...",o:["2/5","1/2","3/5","3/4"],c:2,e:"Angka satuan harus ganjil (1, 3, 5), yaitu 3 dari 5 pilihan. P = 3/5."},
{l:"olimpiade",t:"Pengambilan Sekaligus",q:"Dari kantong berisi 5 kelereng merah dan 3 kelereng biru, diambil dua kelereng sekaligus. Peluang keduanya merah adalah ...",o:["5/14","5/8","25/64","3/7"],c:0,e:"C(5,2)/C(8,2) = 10/28 = 5/14."},
{l:"olimpiade",t:"Kejadian Majemuk",q:"Dua koin dan sebuah dadu dilempar bersamaan. Peluang muncul dua gambar dan mata dadu genap adalah ...",o:["1/12","1/8","1/6","1/4"],c:1,e:"P = 1/4 × 1/2 = 1/8."},
{l:"olimpiade",t:"Komplemen Kejadian",q:"Sebuah dadu dilempar tiga kali. Peluang paling sedikit satu kali muncul mata dadu 6 adalah ...",o:["1/6","25/36","91/216","125/216"],c:2,e:"P(tidak ada 6) = (5/6)³ = 125/216. Jadi P = 1 − 125/216 = 91/216."}
];
const LB={sedang:"Sedang",sulit:"Sulit",hots:"HOTS",olimpiade:"Olimpiade"},LT=['A','B','C','D'];
const S={cur:0,ans:Q.map(()=>null),done:false};
const $=id=>document.getElementById(id),panel=$('panel'),grid=$('grid');
Q.forEach((q,i)=>{const b=document.createElement('button');b.type='button';b.className='cell '+q.l;b.textContent=i+1;b.setAttribute('aria-label','Soal '+(i+1)+', '+LB[q.l]);b.onclick=()=>{S.cur=i;render()};grid.appendChild(b)});
function upd(){grid.childNodes.forEach((c,i)=>{c.classList.toggle('answered',S.ans[i]!==null);c.classList.toggle('current',i===S.cur&&!S.done)});
 const n=S.ans.filter(a=>a!==null).length;$('pf').style.width=Math.round(n/Q.length*100)+'%';$('pl').textContent=n+' dari '+Q.length+' soal terjawab'}
function confirmBox(msg,ok){$('cm').textContent=msg;$('ov').classList.remove('hidden');$('no').onclick=()=>$('ov').classList.add('hidden');$('yes').onclick=()=>{$('ov').classList.add('hidden');ok()}}
function submit(){const u=S.ans.filter(a=>a===null).length;const go=()=>{S.done=true;results()};u?confirmBox('Masih ada '+u+' soal belum dijawab. Tetap kumpulkan?',go):go()}
$('bsub').onclick=submit;
function question(){
  const i=S.cur,q=Q[i];
  panel.innerHTML=`<div class="card ${q.l}"><div class="chips"><span class="chip">${LB[q.l]}</span><span class="tc">${q.t}</span></div>
  <div class="qn">Soal ${i+1} dari ${Q.length}</div>${q.f||''}<p class="qt">${q.q}</p>
  <fieldset>${q.o.map((o,k)=>`<label class="opt${S.ans[i]===k?' sel':''}"><input type="radio" name="o" value="${k}"${S.ans[i]===k?' checked':''}><span class="ol">${LT[k]}.</span><span>${o}</span></label>`).join('')}</fieldset>
  <div class="nb"><button type="button" class="g" id="pv"${i?'':' disabled'}>Sebelumnya</button><button type="button" class="p" id="nx">${i===Q.length-1?'Ke ringkasan':'Berikutnya'}</button></div></div>`;
  panel.querySelectorAll('input').forEach(inp=>inp.onchange=e=>{S.ans[i]=+e.target.value;panel.querySelectorAll('.opt').forEach((el,k)=>el.classList.toggle('sel',k===S.ans[i]));upd()});
  $('pv').onclick=()=>{S.cur--;render()};
  $('nx').onclick=()=>i===Q.length-1?submit():(S.cur++,render());
}
function results(){
  const cnt={};Object.keys(LB).forEach(k=>cnt[k]=[0,0]);let tot=0;
  Q.forEach((q,i)=>{cnt[q.l][1]++;if(S.ans[i]===q.c){cnt[q.l][0]++;tot++}});
  const sc=Math.round(tot/Q.length*100),col=sc>=75?'var(--ok)':sc>=50?'var(--gold)':'var(--bad)';
  $('side').classList.add('hidden');
  panel.innerHTML=`<div class="rw"><h2>Hasil ujian</h2><div class="hero"><span class="n" style="color:${col}">${tot}</span><span class="o">dari ${Q.length} soal benar · nilai akhir <b style="color:${col}">${sc}</b></span></div>
  ${Object.keys(LB).map(k=>`<div class="bd ${k}"><span>${LB[k]}</span><div class="bt"><div style="width:${cnt[k][1]?cnt[k][0]/cnt[k][1]*100:0}%"></div></div><span>${cnt[k][0]}/${cnt[k][1]}</span></div>`).join('')}
  <button class="g" id="rt">Ulangi ujian</button>
  <div style="margin-top:24px">${Q.map((q,i)=>{const a=S.ans[i],ok=a===q.c;return `<div class="ri ${q.l}"><div class="chips"><span class="chip">${LB[q.l]}</span><span class="tc">${q.t}</span><span class="tc" style="color:${ok?'var(--ok)':'var(--bad)'};border-color:currentColor">${ok?'Benar':a===null?'Tidak dijawab':'Salah'}</span></div>${q.f||''}<p class="rq">${i+1}. ${q.q}</p>${q.o.map((o,k)=>`<div class="ro ${k===q.c?'c':k===a?'w':''}">${LT[k]}. ${o}</div>`).join('')}<div class="ex"><b>Pembahasan:</b> ${q.e}</div></div>`}).join('')}</div></div>`;
  $('rt').onclick=()=>{S.cur=0;S.ans=Q.map(()=>null);S.done=false;$('side').classList.remove('hidden');render()};
  panel.scrollTo(0,0);
}
function render(){if(S.done)return results();question();upd();panel.scrollTo(0,0)}
render();
</script>
</body>
</html>
