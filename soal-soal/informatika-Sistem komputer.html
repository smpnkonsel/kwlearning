<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ujian Sistem Komputer — KW Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F0F2F5;--panel:#fff;--ink:#1B2430;--soft:#5B6473;--navy:#0F3D63;--deep:#0A2B48;--gold:#D79A2C;--line:#DDE2E8;
--sedang:#2E86AB;--sedang-bg:#EAF3F8;--sulit:#C9642A;--sulit-bg:#FBEEE4;--hots:#7B4FA6;--hots-bg:#F1EAF8;--olimpiade:#B23A48;--olimpiade-bg:#FAEBEC;--ok:#2F9E5B;--ok-bg:#E7F5EC;--bad:#C0392B;--bad-bg:#FBEBE9;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper)}
body{color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;overflow:hidden}
h2,h3{font-family:'Fraunces',Georgia,serif;margin:0}button{font-family:inherit}
.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{flex:none;background:linear-gradient(120deg,var(--navy),var(--deep));color:#fff;padding:10px 26px 0}
.row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
.brand{font-size:13px;color:#B9C6D6;font-weight:600}.et{font-family:'Fraunces',serif;font-weight:600;font-size:18px}
.sub{margin:4px 0 8px;color:#C7D2DE;font-size:12.5px}
.strip{display:flex;height:4px}.strip span{flex:1}
.body{flex:1;display:flex;min-height:0}
aside{width:270px;flex:none;background:var(--panel);border-right:1px solid var(--line);border-top:3px solid var(--gold);display:flex;flex-direction:column;min-height:0}
.sc{flex:1;overflow-y:auto;padding:18px}
aside h2{font-size:13px;color:var(--soft);margin-bottom:10px;font-family:'Public Sans',sans-serif;font-weight:700}
.pt{height:7px;background:#E7EAEF;border-radius:99px;overflow:hidden;margin-bottom:6px}.pf{height:100%;background:var(--gold);width:0;transition:width .25s}
.pl{font-size:12.5px;color:var(--soft);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.cell{aspect-ratio:1;border-radius:6px;border:1.5px solid;font-size:12.5px;font-weight:700;cursor:pointer;padding:0;background:#fff}
.sedang{--c:var(--sedang);--b:var(--sedang-bg)}.sulit{--c:var(--sulit);--b:var(--sulit-bg)}.hots{--c:var(--hots);--b:var(--hots-bg)}.olimpiade{--c:var(--olimpiade);--b:var(--olimpiade-bg)}
.cell{border-color:var(--c);color:var(--c);background:var(--b)}.cell.answered{background:var(--c);color:#fff}.cell.current{outline:2.5px solid var(--gold);outline-offset:1px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--soft)}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:8px}
.sf{padding:14px 18px;border-top:1px solid var(--line)}
.bs{width:100%;background:var(--gold);color:#2A1D06;border:0;border-radius:8px;padding:12px;font-size:14.5px;font-weight:700;cursor:pointer}
main{flex:1;min-width:0;overflow-y:auto;display:flex;justify-content:center;padding:28px 24px 40px}
.card{width:100%;max-width:760px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--c,var(--navy));border-radius:10px;padding:24px 28px 28px;align-self:flex-start}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--b);color:var(--c)}
.tc{font-size:12.5px;color:var(--soft);border:1px solid var(--line);padding:5px 12px;border-radius:99px}
.qn{font-family:'Fraunces',serif;font-size:14.5px;color:var(--soft);margin-bottom:6px}
.qt{font-size:18.5px;line-height:1.55;margin:0 0 16px}
.figbox{display:flex;justify-content:center;background:#F7F9FB;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:18px}
.fig{width:100%;max-width:340px;height:auto}
fieldset{border:0;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px 16px;cursor:pointer}
.opt:hover{border-color:var(--navy)}.opt.sel{border-color:var(--navy);background:#F2F6FA}.opt input{margin-top:4px;accent-color:var(--navy)}.ol{font-weight:700;color:var(--navy);width:18px;flex:none}
.nb{display:flex;justify-content:space-between;gap:12px}
.g,.p{font-size:15px;font-weight:700;border-radius:8px;padding:11px 22px;cursor:pointer;border:1px solid transparent}
.g{background:#fff;border-color:var(--line);color:var(--ink)}.g:disabled{opacity:.4;cursor:not-allowed}.p{background:var(--c,var(--navy));color:#fff}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rw{max-width:820px;margin:0 auto;width:100%}.rw h2{font-size:24px}
.hero{display:flex;align-items:baseline;gap:10px;margin:10px 0 20px}.hero .n{font-family:'Fraunces',serif;font-size:52px;font-weight:600}.hero .o{color:var(--soft)}
.bd{display:grid;grid-template-columns:90px 1fr 50px;gap:12px;align-items:center;font-size:14px;margin-bottom:10px}
.bt{height:9px;background:#E7EAEF;border-radius:99px;overflow:hidden}.bt div{height:100%;background:var(--c)}
.ri{border-top:1px solid var(--line);padding:18px 0}.rq{font-size:16px;margin:10px 0}
.ro{padding:7px 12px;border-radius:6px;font-size:14px;margin-bottom:6px;border:1px solid var(--line)}
.ro.c{border-color:var(--ok);background:var(--ok-bg);color:#1E6B3E}.ro.w{border-color:var(--bad);background:var(--bad-bg);color:#8E2A20}
.ex{font-size:14px;color:var(--soft);background:#F6F4EC;border-radius:8px;padding:12px 14px;margin-top:10px}.ex b{color:var(--ink)}
.hidden{display:none!important}
.ov{position:fixed;inset:0;background:rgba(10,20,32,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.mb{background:#fff;border-radius:12px;padding:24px 26px;max-width:380px;border-top:4px solid var(--gold)}
.mb p{font-size:14.5px;color:var(--soft);margin:8px 0 18px}.ma{display:flex;justify-content:flex-end;gap:10px}
@media(max-width:820px){.body{flex-direction:column}aside{width:100%;max-height:36vh;border-right:0}main{padding:18px 14px 30px}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="row"><span class="brand">KW Learning · Ruang Belajar Informatika</span><span class="et">Ujian Sistem Komputer</span></div>
<p class="sub">45 soal pilihan ganda dengan gambar perangkat keras, diagram blok, dan bilangan biner — sedang, sulit, HOTS, dan olimpiade.</p>
<div class="strip"><span style="background:var(--sedang)"></span><span style="background:var(--sulit)"></span><span style="background:var(--hots)"></span><span style="background:var(--olimpiade)"></span></div>
</header>
<div class="body">
<aside id="side"><div class="sc">
<h2>Progres</h2><div class="pt"><div class="pf" id="pf"></div></div><div class="pl" id="pl"></div>
<h2>Navigasi soal</h2><div class="grid" id="grid"></div>
<div class="legend"><span class="sedang"><i></i>Sedang (1–15)</span><span class="sulit"><i></i>Sulit (16–30)</span><span class="hots"><i></i>HOTS (31–40)</span><span class="olimpiade"><i></i>Olimpiade (41–45)</span></div>
</div><div class="sf"><button class="bs" id="bsub">Kumpulkan jawaban</button></div></aside>
<main id="panel" aria-live="polite"></main>
</div></div>
<div class="ov hidden" id="ov"><div class="mb"><h3>Kumpulkan jawaban?</h3><p id="cm"></p><div class="ma"><button class="g" id="no">Kembali</button><button class="p" id="yes">Ya, kumpulkan</button></div></div></div>

<script>
const NS='http://www.w3.org/2000/svg';
// Gambar: perangkat keras, diagram blok, biner
const ST='stroke="#0F3D63" stroke-width="2.5"';
function ico(n){
  let b='';
  if(n==='keyboard'){b=`<rect x="14" y="26" width="132" height="62" rx="7" fill="#EAF3F8" ${ST}/>`;for(let r=0;r<3;r++)for(let c=0;c<10;c++)b+=`<rect x="${22+c*12.5}" y="${34+r*13}" width="10" height="10" fill="#fff" stroke="#0F3D63"/>`;b+=`<rect x="42" y="73" width="76" height="10" fill="#fff" stroke="#0F3D63"/>`}
  if(n==='mouse')b=`<path d="M80 4v12" stroke="#5B6473" stroke-width="3"/><rect x="58" y="16" width="44" height="78" rx="22" fill="#EAF3F8" ${ST}/><path d="M80 16v32M58 48h44" stroke="#0F3D63" stroke-width="2"/>`;
  if(n==='monitor')b=`<rect x="20" y="8" width="120" height="72" rx="6" fill="#0F3D63"/><rect x="27" y="15" width="106" height="58" fill="#EAF3F8"/><rect x="72" y="80" width="16" height="12" fill="#5B6473"/><rect x="52" y="92" width="56" height="8" rx="3" fill="#5B6473"/>`;
  if(n==='printer')b=`<rect x="45" y="8" width="70" height="34" fill="#fff" ${ST}/><rect x="22" y="38" width="116" height="42" rx="8" fill="#EAF3F8" ${ST}/><rect x="48" y="68" width="64" height="36" fill="#fff" ${ST}/><path d="M56 80h48M56 90h36" stroke="#9AA5B1" stroke-width="2"/><circle cx="126" cy="50" r="3.5" fill="#2F9E5B"/>`;
  if(n==='speaker')b=`<rect x="48" y="6" width="64" height="98" rx="10" fill="#EAF3F8" ${ST}/><circle cx="80" cy="32" r="10" fill="#fff" ${ST}/><circle cx="80" cy="72" r="21" fill="#fff" ${ST}/><circle cx="80" cy="72" r="8" fill="#0F3D63"/>`;
  if(n==='flashdisk')b=`<rect x="22" y="36" width="76" height="40" rx="8" fill="#2E86AB" ${ST}/><rect x="98" y="42" width="34" height="28" fill="#C8CDD4" ${ST}/><rect x="106" y="49" width="7" height="7" fill="#1B2430"/><rect x="119" y="49" width="7" height="7" fill="#1B2430"/><circle cx="38" cy="56" r="5" fill="#fff"/>`;
  if(n==='ram'){b=`<rect x="12" y="30" width="136" height="48" fill="#2F9E5B" ${ST}/>`;for(let i=0;i<4;i++)b+=`<rect x="${22+i*31}" y="40" width="23" height="24" fill="#1B2430"/>`;for(let i=0;i<20;i++)b+=`<rect x="${16+i*6.6}" y="78" width="3.6" height="10" fill="#D79A2C"/>`}
  if(n==='hdd')b=`<rect x="36" y="8" width="88" height="94" rx="8" fill="#C8CDD4" ${ST}/><circle cx="78" cy="52" r="30" fill="#EEF0F3" ${ST}/><circle cx="78" cy="52" r="7" fill="#5B6473"/><path d="M110 20L84 48" stroke="#1B2430" stroke-width="3"/><rect x="60" y="92" width="40" height="8" fill="#D79A2C"/>`;
  return `<svg class="fig" viewBox="0 0 160 110" style="max-width:220px" role="img" aria-label="Gambar perangkat komputer">${b}</svg>`;
}
const MK=`<defs><marker id="ah2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0L8,4L0,8z" fill="#0F3D63"/></marker></defs>`;
const bx=(x,y,w,h,t,f,tc)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${f}" ${ST}/><text x="${x+w/2}" y="${y+h/2+5}" font-size="15" font-weight="700" text-anchor="middle" fill="${tc||'#0F3D63'}">${t}</text>`;
function blok(h){
  const g=(n,t)=>h===n?'?':t,f=n=>h===n?'#F7E3B5':null;
  return `<svg class="fig" viewBox="0 0 320 190" role="img" aria-label="Diagram blok sistem komputer">${MK}`+bx(8,30,86,46,g('Input','Input'),f('Input')||'#EAF3F8')+bx(118,30,84,46,g('CPU','CPU'),f('CPU')||'#0F3D63',h==='CPU'?'#0F3D63':'#fff')+bx(226,30,86,46,g('Output','Output'),f('Output')||'#FBEEE4')+bx(118,126,84,46,g('Memori','Memori'),f('Memori')||'#F1EAF8')
  +`<path d="M94 53H116M202 53H224" stroke="#0F3D63" stroke-width="2.5" marker-end="url(#ah2)"/><path d="M160 76V124" stroke="#0F3D63" stroke-width="2.5" marker-start="url(#ah2)" marker-end="url(#ah2)"/></svg>`;
}
function cpu(h){
  const g=(n,t)=>h===n?'?':t,f=(n,d)=>h===n?'#F7E3B5':d;
  return `<svg class="fig" viewBox="0 0 320 190" role="img" aria-label="Bagian dalam CPU"><rect x="20" y="8" width="280" height="176" rx="12" fill="#F2F6FA" ${ST}/><text x="36" y="30" font-size="14" font-weight="700" fill="#5B6473">CPU</text>`+bx(40,44,112,52,g('CU','Control Unit'),f('CU','#EAF3F8'))+bx(168,44,112,52,g('ALU','ALU'),f('ALU','#FBEEE4'))+bx(40,112,240,50,g('Register','Register'),f('Register','#F1EAF8'))+'</svg>';
}
function bits(v){
  const W=[128,64,32,16,8,4,2,1];let s=`<svg class="fig" viewBox="0 0 320 112" role="img" aria-label="Bilangan biner 8 bit ${v}">`;
  [...v].forEach((c,i)=>{const x=16+i*36;s+=`<rect x="${x}" y="12" width="34" height="38" fill="${c==='1'?'#F7E3B5':'#fff'}" ${ST}/><text x="${x+17}" y="38" font-size="20" font-weight="700" text-anchor="middle" fill="#0F3D63">${c}</text><text x="${x+17}" y="68" font-size="12" text-anchor="middle" fill="#5B6473">${W[i]}</text>`});
  return s+`<text x="160" y="96" font-size="12" text-anchor="middle" fill="#5B6473">nilai tempat setiap bit</text></svg>`;
}
const F=(h)=>`<div class="figbox">${h}</div>`;
const I={};['keyboard','mouse','monitor','printer','speaker','flashdisk','ram','hdd'].forEach(n=>I[n]=F(ico(n)));
const Q=[
// SEDANG
{l:"sedang",t:"Perangkat Keras",f:I.keyboard,q:"Perangkat pada gambar di atas termasuk perangkat ...",o:["input","output","proses","penyimpanan"],c:0,e:"Keyboard digunakan memasukkan data ke komputer, sehingga termasuk perangkat input."},
{l:"sedang",t:"Perangkat Keras",f:I.monitor,q:"Perangkat pada gambar di atas termasuk perangkat ...",o:["input","output","proses","penyimpanan"],c:1,e:"Monitor menampilkan hasil pengolahan, sehingga termasuk perangkat output."},
{l:"sedang",t:"Perangkat Keras",f:I.printer,q:"Printer pada gambar di atas termasuk perangkat ...",o:["input","proses","output","penyimpanan"],c:2,e:"Printer mencetak hasil pengolahan data, sehingga termasuk output."},
{l:"sedang",t:"Perangkat Keras",f:I.mouse,q:"Mouse pada gambar di atas termasuk perangkat ...",o:["output","input","proses","komunikasi"],c:1,e:"Mouse dipakai untuk memberi perintah ke komputer, yaitu perangkat input."},
{l:"sedang",t:"Perangkat Keras",f:I.flashdisk,q:"Flashdisk pada gambar di atas termasuk perangkat ...",o:["input","output","proses","penyimpanan"],c:3,e:"Flashdisk menyimpan data, sehingga termasuk perangkat penyimpanan."},
{l:"sedang",t:"Perangkat Keras",f:I.speaker,q:"Speaker pada gambar di atas termasuk perangkat ...",o:["input","penyimpanan","output","proses"],c:2,e:"Speaker mengeluarkan suara hasil pengolahan, yaitu perangkat output."},
{l:"sedang",t:"Diagram Blok",f:F(blok('CPU')),q:"Bagian bertanda ? pada diagram blok di atas adalah ...",o:["monitor","CPU (prosesor)","keyboard","flashdisk"],c:1,e:"Data dari input diolah oleh CPU lalu hasilnya dikeluarkan ke output."},
{l:"sedang",t:"Diagram Blok",f:F(blok('Input')),q:"Bagian bertanda ? pada diagram blok di atas adalah perangkat ...",o:["input","penyimpanan","output","lunak"],c:0,e:"Sebelum diproses CPU, data masuk melalui perangkat input."},
{l:"sedang",t:"Komponen Sistem Komputer",q:"Tiga komponen utama sistem komputer adalah ...",o:["hardware, software, dan brainware","input, output, dan CPU","RAM, ROM, dan CPU","monitor, keyboard, dan mouse"],c:0,e:"Sistem komputer terdiri dari perangkat keras (hardware), perangkat lunak (software), dan pengguna (brainware)."},
{l:"sedang",t:"Brainware",q:"Manusia yang mengoperasikan komputer disebut ...",o:["hardware","software","brainware","firmware"],c:2,e:"Brainware adalah pengguna atau pengelola komputer."},
{l:"sedang",t:"Perangkat Lunak",q:"Berikut ini yang termasuk sistem operasi adalah ...",o:["Microsoft Word","Windows","Google Chrome","Paint"],c:1,e:"Windows adalah sistem operasi. Lainnya adalah aplikasi."},
{l:"sedang",t:"Sistem Operasi",q:"Fungsi utama sistem operasi adalah ...",o:["mencetak dokumen","mengelola sumber daya perangkat keras dan lunak","menyimpan foto","membuat presentasi"],c:1,e:"Sistem operasi mengatur kerja hardware dan menjalankan software."},
{l:"sedang",t:"Perangkat Lunak",q:"Microsoft Word termasuk perangkat lunak jenis ...",o:["sistem operasi","aplikasi","bahasa pemrograman","firmware"],c:1,e:"Word dipakai untuk mengolah dokumen, sehingga termasuk perangkat lunak aplikasi."},
{l:"sedang",t:"Memori",f:I.ram,q:"Perangkat pada gambar di atas adalah RAM. Data pada RAM akan hilang saat komputer dimatikan. Sifat ini disebut ...",o:["non-volatile","volatile","permanen","read-only"],c:1,e:"Memori yang datanya hilang tanpa aliran listrik bersifat volatile."},
{l:"sedang",t:"Satuan Data",q:"Satu byte terdiri atas ... bit.",o:["4","16","8","10"],c:2,e:"1 byte = 8 bit."},
// SULIT
{l:"sulit",t:"Bagian CPU",f:F(cpu('CU')),q:"Bagian bertanda ? pada gambar CPU di atas bertugas mengatur dan mengendalikan eksekusi instruksi. Bagian tersebut adalah ...",o:["ALU","Control Unit","Register","RAM"],c:1,e:"Control Unit (CU) mengendalikan alur instruksi."},
{l:"sulit",t:"Bagian CPU",f:F(cpu('ALU')),q:"Bagian bertanda ? pada gambar CPU di atas melakukan operasi aritmetika dan logika. Bagian tersebut adalah ...",o:["ALU","CU","Register","Cache"],c:0,e:"ALU (Arithmetic Logic Unit) menghitung dan membandingkan data."},
{l:"sulit",t:"Bagian CPU",f:F(cpu('Register')),q:"Bagian bertanda ? pada gambar CPU di atas adalah memori kecil dan sangat cepat di dalam CPU. Bagian tersebut adalah ...",o:["ROM","hard disk","register","flashdisk"],c:2,e:"Register menyimpan data sementara yang sedang diproses CPU."},
{l:"sulit",t:"Memori",q:"Program awal untuk memulai komputer (booting) disimpan pada ...",o:["RAM","ROM","cache","flashdisk"],c:1,e:"ROM menyimpan instruksi dasar yang tetap ada walau komputer mati."},
{l:"sulit",t:"Siklus Instruksi",q:"Urutan siklus instruksi pada CPU yang benar adalah ...",o:["execute – fetch – decode","fetch – decode – execute","decode – fetch – execute","fetch – execute – decode"],c:1,e:"CPU mengambil instruksi (fetch), menafsirkan (decode), lalu menjalankan (execute)."},
{l:"sulit",t:"Satuan Data",q:"Satu kilobyte (KB) sama dengan ... byte.",o:["100","1.000","1.024","8"],c:2,e:"1 KB = 1.024 byte."},
{l:"sulit",t:"Satuan Data",q:"Dua kilobyte sama dengan ... byte.",o:["2.000","2.048","1.024","4.096"],c:1,e:"2 × 1.024 = 2.048 byte."},
{l:"sulit",t:"Bilangan Biner",f:F(bits('00000101')),q:"Nilai desimal dari bilangan biner pada gambar di atas adalah ...",o:["3","5","7","10"],c:1,e:"Bit 1 berada pada nilai tempat 4 dan 1, sehingga 4 + 1 = 5."},
{l:"sulit",t:"Bilangan Biner",f:F(bits('00001010')),q:"Nilai desimal dari bilangan biner pada gambar di atas adalah ...",o:["8","9","10","12"],c:2,e:"8 + 2 = 10."},
{l:"sulit",t:"Bilangan Biner",f:F(bits('00010000')),q:"Nilai desimal dari bilangan biner pada gambar di atas adalah ...",o:["8","32","16","64"],c:2,e:"Hanya satu bit 1 pada nilai tempat 16, sehingga hasilnya 16."},
{l:"sulit",t:"Konversi ke Biner",q:"Bilangan desimal 12 jika diubah ke biner menjadi ...",o:["1010","1110","1100","1001"],c:2,e:"12 = 8 + 4, sehingga biner 1100."},
{l:"sulit",t:"Bilangan Biner",q:"Bilangan biner 1111 sama dengan desimal ...",o:["8","14","15","16"],c:2,e:"8 + 4 + 2 + 1 = 15."},
{l:"sulit",t:"Perangkat Penyimpanan",f:I.hdd,q:"Perangkat penyimpanan internal pada gambar di atas disebut ...",o:["hard disk","RAM","printer","monitor"],c:0,e:"Gambar menunjukkan piringan magnetik dan lengan baca, yaitu hard disk."},
{l:"sulit",t:"Port",f:I.flashdisk,q:"Flashdisk pada gambar di atas dihubungkan ke komputer melalui port ...",o:["VGA","HDMI","USB","LAN"],c:2,e:"Flashdisk menggunakan konektor USB."},
{l:"sulit",t:"Perangkat Lunak",q:"Perangkat lunak yang membantu perawatan komputer, misalnya antivirus, disebut perangkat lunak ...",o:["aplikasi","utilitas","driver","bahasa pemrograman"],c:1,e:"Perangkat lunak utilitas membantu merawat dan mengoptimalkan komputer."},
// HOTS
{l:"hots",t:"Alur Kerja",f:F(blok('')),q:"Alur kerja sistem komputer pada diagram blok di atas yang benar adalah ...",o:["output → input → proses","input → proses → output","proses → input → output","input → output → proses"],c:1,e:"Data dimasukkan (input), diolah (proses), lalu ditampilkan (output)."},
{l:"hots",t:"Diagram Blok",f:F(blok('Memori')),q:"Bagian bertanda ? pada diagram blok di atas menyimpan data dan instruksi yang digunakan CPU. Bagian tersebut adalah ...",o:["memori","output","input","brainware"],c:0,e:"Memori menyimpan data dan program yang sedang dipakai CPU."},
{l:"hots",t:"Alur Kerja",q:"Saat kamu mengetik huruf di keyboard hingga huruf tampil di monitor, alur perangkatnya adalah ...",o:["monitor → CPU → keyboard","keyboard → CPU → monitor","CPU → keyboard → monitor","keyboard → monitor → CPU"],c:1,e:"Keyboard (input) → CPU (proses) → monitor (output)."},
{l:"hots",t:"Satuan Data",q:"Sebuah berkas berukuran 2.048 KB. Ukuran berkas tersebut dalam MB adalah ...",o:["1","20","2","2.048"],c:2,e:"1 MB = 1.024 KB, sehingga 2.048 : 1.024 = 2 MB."},
{l:"hots",t:"Satuan Data",q:"Satu gigabyte (GB) sama dengan ... MB.",o:["100","1.024","1.000","8"],c:1,e:"1 GB = 1.024 MB."},
{l:"hots",t:"Bilangan Biner",f:F(bits('01100100')),q:"Nilai desimal dari bilangan biner pada gambar di atas adalah ...",o:["64","96","100","104"],c:2,e:"64 + 32 + 4 = 100."},
{l:"hots",t:"Bilangan Biner",f:F(bits('10000001')),q:"Nilai desimal dari bilangan biner pada gambar di atas adalah ...",o:["128","129","130","255"],c:1,e:"128 + 1 = 129."},
{l:"hots",t:"Konversi ke Biner",q:"Bilangan desimal 20 jika diubah ke biner menjadi ...",o:["10010","11000","10100","10101"],c:2,e:"20 = 16 + 4, sehingga biner 10100."},
{l:"hots",t:"Pemecahan Masalah",q:"Komputer dengan RAM 4 GB terasa lambat saat menjalankan banyak aplikasi sekaligus. Solusi yang paling tepat adalah ...",o:["mengganti mouse","menambah kapasitas RAM","mengganti keyboard","mengganti speaker"],c:1,e:"RAM menampung program yang sedang berjalan. Menambah RAM membuat banyak aplikasi lebih lancar."},
{l:"hots",t:"Driver",q:"Driver diperlukan agar ...",o:["virus terhapus","sistem operasi dapat mengenali dan menggunakan perangkat keras","foto dapat diedit","dokumen tersimpan otomatis"],c:1,e:"Driver menjadi penghubung antara sistem operasi dan perangkat keras."},
// OLIMPIADE
{l:"olimpiade",t:"Bilangan Biner",q:"Nilai desimal terbesar yang dapat disimpan dalam 8 bit adalah ...",o:["127","128","255","256"],c:2,e:"11111111 = 128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 = 255."},
{l:"olimpiade",t:"Kombinasi Bit",q:"Banyak kombinasi berbeda yang dapat dibentuk oleh 3 bit adalah ...",o:["3","8","6","9"],c:1,e:"2 × 2 × 2 = 2³ = 8 kombinasi."},
{l:"olimpiade",t:"Penjumlahan Biner",q:"Hasil penjumlahan biner 101 + 11 adalah ...",o:["1000","1010","1100","111"],c:0,e:"101 = 5 dan 11 = 3. 5 + 3 = 8 = 1000 dalam biner."},
{l:"olimpiade",t:"Satuan Data",q:"Berkas berukuran 4.096 byte memiliki ukuran ... KB.",o:["2","8","4","40"],c:2,e:"4.096 : 1.024 = 4 KB."},
{l:"olimpiade",t:"Kapasitas Penyimpanan",q:"Flashdisk berkapasitas 8 GB akan diisi foto berukuran 4 MB per foto. Foto yang dapat disimpan paling banyak ...",o:["1.000","2.000","2.048","8.192"],c:2,e:"8 GB = 8 × 1.024 = 8.192 MB. Banyak foto = 8.192 : 4 = 2.048."}
];
const LB={sedang:"Sedang",sulit:"Sulit",hots:"HOTS",olimpiade:"Olimpiade"},LT=['A','B','C','D'];
const S={cur:0,ans:Q.map(()=>null),done:false};
const $=id=>document.getElementById(id),panel=$('panel'),grid=$('grid');
Q.forEach((q,i)=>{const b=document.createElement('button');b.type='button';b.className='cell '+q.l;b.textContent=i+1;b.setAttribute('aria-label','Soal '+(i+1)+', '+LB[q.l]);b.onclick=()=>{S.cur=i;render()};grid.appendChild(b)});
function upd(){grid.childNodes.forEach((c,i)=>{c.classList.toggle('answered',S.ans[i]!==null);c.classList.toggle('current',i===S.cur&&!S.done)});
 const n=S.ans.filter(a=>a!==null).length;$('pf').style.width=Math.round(n/Q.length*100)+'%';$('pl').textContent=n+' dari '+Q.length+' soal terjawab'}
function confirmBox(msg,ok){$('cm').textContent=msg;$('ov').classList.remove('hidden');$('no').onclick=()=>$('ov').classList.add('hidden');$('yes').onclick=()=>{$('ov').classList.add('hidden');ok()}}
function submit(){const u=S.ans.filter(a=>a===null).length;const go=()=>{S.done=true;results()};u?confirmBox('Masih ada '+u+' soal belum dijawab. Tetap kumpulkan?',go):go()}
$('bsub').onclick=submit;
function question(){
  const i=S.cur,q=Q[i];
  panel.innerHTML=`<div class="card ${q.l}"><div class="chips"><span class="chip">${LB[q.l]}</span><span class="tc">${q.t}</span></div>
  <div class="qn">Soal ${i+1} dari ${Q.length}</div>${q.f||''}<p class="qt">${q.q}</p>
  <fieldset>${q.o.map((o,k)=>`<label class="opt${S.ans[i]===k?' sel':''}"><input type="radio" name="o" value="${k}"${S.ans[i]===k?' checked':''}><span class="ol">${LT[k]}.</span><span>${o}</span></label>`).join('')}</fieldset>
  <div class="nb"><button type="button" class="g" id="pv"${i?'':' disabled'}>Sebelumnya</button><button type="button" class="p" id="nx">${i===Q.length-1?'Ke ringkasan':'Berikutnya'}</button></div></div>`;
  panel.querySelectorAll('input').forEach(inp=>inp.onchange=e=>{S.ans[i]=+e.target.value;panel.querySelectorAll('.opt').forEach((el,k)=>el.classList.toggle('sel',k===S.ans[i]));upd()});
  $('pv').onclick=()=>{S.cur--;render()};
  $('nx').onclick=()=>i===Q.length-1?submit():(S.cur++,render());
}
function results(){
  const cnt={};Object.keys(LB).forEach(k=>cnt[k]=[0,0]);let tot=0;
  Q.forEach((q,i)=>{cnt[q.l][1]++;if(S.ans[i]===q.c){cnt[q.l][0]++;tot++}});
  const sc=Math.round(tot/Q.length*100),col=sc>=75?'var(--ok)':sc>=50?'var(--gold)':'var(--bad)';
  $('side').classList.add('hidden');
  panel.innerHTML=`<div class="rw"><h2>Hasil ujian</h2><div class="hero"><span class="n" style="color:${col}">${tot}</span><span class="o">dari ${Q.length} soal benar · nilai akhir <b style="color:${col}">${sc}</b></span></div>
  ${Object.keys(LB).map(k=>`<div class="bd ${k}"><span>${LB[k]}</span><div class="bt"><div style="width:${cnt[k][1]?cnt[k][0]/cnt[k][1]*100:0}%"></div></div><span>${cnt[k][0]}/${cnt[k][1]}</span></div>`).join('')}
  <button class="g" id="rt">Ulangi ujian</button>
  <div style="margin-top:24px">${Q.map((q,i)=>{const a=S.ans[i],ok=a===q.c;return `<div class="ri ${q.l}"><div class="chips"><span class="chip">${LB[q.l]}</span><span class="tc">${q.t}</span><span class="tc" style="color:${ok?'var(--ok)':'var(--bad)'};border-color:currentColor">${ok?'Benar':a===null?'Tidak dijawab':'Salah'}</span></div>${q.f||''}<p class="rq">${i+1}. ${q.q}</p>${q.o.map((o,k)=>`<div class="ro ${k===q.c?'c':k===a?'w':''}">${LT[k]}. ${o}</div>`).join('')}<div class="ex"><b>Pembahasan:</b> ${q.e}</div></div>`}).join('')}</div></div>`;
  $('rt').onclick=()=>{S.cur=0;S.ans=Q.map(()=>null);S.done=false;$('side').classList.remove('hidden');render()};
  panel.scrollTo(0,0);
}
function render(){if(S.done)return results();question();upd();panel.scrollTo(0,0)}
render();
</script>
</body>
</html>
