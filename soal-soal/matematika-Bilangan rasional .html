<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ujian Bilangan Rasional — KW Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F0F2F5;--panel:#fff;--ink:#1B2430;--soft:#5B6473;--navy:#0F3D63;--deep:#0A2B48;--gold:#D79A2C;--line:#DDE2E8;
--sedang:#2E86AB;--sedang-bg:#EAF3F8;--sulit:#C9642A;--sulit-bg:#FBEEE4;--hots:#7B4FA6;--hots-bg:#F1EAF8;--olimpiade:#B23A48;--olimpiade-bg:#FAEBEC;--ok:#2F9E5B;--ok-bg:#E7F5EC;--bad:#C0392B;--bad-bg:#FBEBE9;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper)}
body{color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;overflow:hidden}
h2,h3{font-family:'Fraunces',Georgia,serif;margin:0}button{font-family:inherit}
.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{flex:none;background:linear-gradient(120deg,var(--navy),var(--deep));color:#fff;padding:10px 26px 0}
.row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
.brand{font-size:13px;color:#B9C6D6;font-weight:600}.et{font-family:'Fraunces',serif;font-weight:600;font-size:18px}
.sub{margin:4px 0 8px;color:#C7D2DE;font-size:12.5px}
.strip{display:flex;height:4px}.strip span{flex:1}
.body{flex:1;display:flex;min-height:0}
aside{width:270px;flex:none;background:var(--panel);border-right:1px solid var(--line);border-top:3px solid var(--gold);display:flex;flex-direction:column;min-height:0}
.sc{flex:1;overflow-y:auto;padding:18px}
aside h2{font-size:13px;color:var(--soft);margin-bottom:10px;font-family:'Public Sans',sans-serif;font-weight:700}
.pt{height:7px;background:#E7EAEF;border-radius:99px;overflow:hidden;margin-bottom:6px}.pf{height:100%;background:var(--gold);width:0;transition:width .25s}
.pl{font-size:12.5px;color:var(--soft);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.cell{aspect-ratio:1;border-radius:6px;border:1.5px solid;font-size:12.5px;font-weight:700;cursor:pointer;padding:0;background:#fff}
.sedang{--c:var(--sedang);--b:var(--sedang-bg)}.sulit{--c:var(--sulit);--b:var(--sulit-bg)}.hots{--c:var(--hots);--b:var(--hots-bg)}.olimpiade{--c:var(--olimpiade);--b:var(--olimpiade-bg)}
.cell{border-color:var(--c);color:var(--c);background:var(--b)}.cell.answered{background:var(--c);color:#fff}.cell.current{outline:2.5px solid var(--gold);outline-offset:1px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--soft)}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:8px}
.sf{padding:14px 18px;border-top:1px solid var(--line)}
.bs{width:100%;background:var(--gold);color:#2A1D06;border:0;border-radius:8px;padding:12px;font-size:14.5px;font-weight:700;cursor:pointer}
main{flex:1;min-width:0;overflow-y:auto;display:flex;justify-content:center;padding:28px 24px 40px}
.card{width:100%;max-width:760px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--c,var(--navy));border-radius:10px;padding:24px 28px 28px;align-self:flex-start}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--b);color:var(--c)}
.tc{font-size:12.5px;color:var(--soft);border:1px solid var(--line);padding:5px 12px;border-radius:99px}
.qn{font-family:'Fraunces',serif;font-size:14.5px;color:var(--soft);margin-bottom:6px}
.qt{font-size:18.5px;line-height:1.55;margin:0 0 16px}
.figbox{display:flex;justify-content:center;background:#F7F9FB;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:18px}
.fig{width:100%;max-width:340px;height:auto}
fieldset{border:0;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px 16px;cursor:pointer}
.opt:hover{border-color:var(--navy)}.opt.sel{border-color:var(--navy);background:#F2F6FA}.opt input{margin-top:4px;accent-color:var(--navy)}.ol{font-weight:700;color:var(--navy);width:18px;flex:none}
.nb{display:flex;justify-content:space-between;gap:12px}
.g,.p{font-size:15px;font-weight:700;border-radius:8px;padding:11px 22px;cursor:pointer;border:1px solid transparent}
.g{background:#fff;border-color:var(--line);color:var(--ink)}.g:disabled{opacity:.4;cursor:not-allowed}.p{background:var(--c,var(--navy));color:#fff}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rw{max-width:820px;margin:0 auto;width:100%}.rw h2{font-size:24px}
.hero{display:flex;align-items:baseline;gap:10px;margin:10px 0 20px}.hero .n{font-family:'Fraunces',serif;font-size:52px;font-weight:600}.hero .o{color:var(--soft)}
.bd{display:grid;grid-template-columns:90px 1fr 50px;gap:12px;align-items:center;font-size:14px;margin-bottom:10px}
.bt{height:9px;background:#E7EAEF;border-radius:99px;overflow:hidden}.bt div{height:100%;background:var(--c)}
.ri{border-top:1px solid var(--line);padding:18px 0}.rq{font-size:16px;margin:10px 0}
.ro{padding:7px 12px;border-radius:6px;font-size:14px;margin-bottom:6px;border:1px solid var(--line)}
.ro.c{border-color:var(--ok);background:var(--ok-bg);color:#1E6B3E}.ro.w{border-color:var(--bad);background:var(--bad-bg);color:#8E2A20}
.ex{font-size:14px;color:var(--soft);background:#F6F4EC;border-radius:8px;padding:12px 14px;margin-top:10px}.ex b{color:var(--ink)}
.hidden{display:none!important}
.ov{position:fixed;inset:0;background:rgba(10,20,32,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.mb{background:#fff;border-radius:12px;padding:24px 26px;max-width:380px;border-top:4px solid var(--gold)}
.mb p{font-size:14.5px;color:var(--soft);margin:8px 0 18px}.ma{display:flex;justify-content:flex-end;gap:10px}
@media(max-width:820px){.body{flex-direction:column}aside{width:100%;max-height:36vh;border-right:0}main{padding:18px 14px 30px}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="row"><span class="brand">KW Learning · Ruang Belajar Matematika</span><span class="et">Ujian Bilangan Rasional</span></div>
<p class="sub">45 soal pilihan ganda dengan gambar garis bilangan dan batang pecahan — sedang, sulit, HOTS, dan olimpiade.</p>
<div class="strip"><span style="background:var(--sedang)"></span><span style="background:var(--sulit)"></span><span style="background:var(--hots)"></span><span style="background:var(--olimpiade)"></span></div>
</header>
<div class="body">
<aside id="side"><div class="sc">
<h2>Progres</h2><div class="pt"><div class="pf" id="pf"></div></div><div class="pl" id="pl"></div>
<h2>Navigasi soal</h2><div class="grid" id="grid"></div>
<div class="legend"><span class="sedang"><i></i>Sedang (1–15)</span><span class="sulit"><i></i>Sulit (16–30)</span><span class="hots"><i></i>HOTS (31–40)</span><span class="olimpiade"><i></i>Olimpiade (41–45)</span></div>
</div><div class="sf"><button class="bs" id="bsub">Kumpulkan jawaban</button></div></aside>
<main id="panel" aria-live="polite"></main>
</div></div>
<div class="ov hidden" id="ov"><div class="mb"><h3>Kumpulkan jawaban?</h3><p id="cm"></p><div class="ma"><button class="g" id="no">Kembali</button><button class="p" id="yes">Ya, kumpulkan</button></div></div></div>

<script>
const NS='http://www.w3.org/2000/svg';
// Gambar: garis bilangan
function nline(a,b,pts,d){
  d=d||1;const W=320,L=20,X=v=>L+(v-a)/(b-a)*(W-2*L);
  let s=`<svg class="fig" viewBox="0 0 ${W} 92" role="img" aria-label="Garis bilangan"><line x1="${L-8}" y1="50" x2="${W-L+8}" y2="50" stroke="#1B2430" stroke-width="2"/>`;
  for(let i=a*d;i<=b*d;i++){const w=i%d===0,x=X(i/d);s+=`<line x1="${x}" y1="${w?42:45}" x2="${x}" y2="${w?58:55}" stroke="#1B2430" stroke-width="${w?1.6:1}"/>`+(w?`<text x="${x}" y="76" font-size="12" text-anchor="middle" fill="#5B6473">${i/d}</text>`:'')}
  pts.forEach(p=>{s+=`<circle cx="${X(p[0])}" cy="50" r="5.5" fill="#D79A2C" stroke="#0F3D63" stroke-width="1.5"/><text x="${X(p[0])}" y="33" font-size="14" font-weight="700" text-anchor="middle" fill="#0F3D63">${p[1]}</text>`});
  return s+'</svg>';
}
// Gambar: batang pecahan
function fbar(list){
  const H=list.length*46+6;let s=`<svg class="fig" viewBox="0 0 320 ${H}" role="img" aria-label="Gambar pecahan">`;
  list.forEach(([n,d],r)=>{const y=6+r*46,w=240/d;s+=`<text x="4" y="${y+24}" font-size="14" font-weight="700" fill="#0F3D63">${n}/${d}</text>`;
    for(let i=0;i<d;i++)s+=`<rect x="${64+i*w}" y="${y}" width="${w}" height="34" fill="${i<n?'#2E86AB':'#fff'}" stroke="#0F3D63" stroke-width="1.5"/>`});
  return s+'</svg>';
}
const F=(h)=>`<div class="figbox">${h}</div>`;
const Q=[
// SEDANG
{l:"sedang",t:"Pengertian Bilangan Rasional",q:"Di antara bilangan berikut, yang merupakan bilangan rasional adalah ...",o:["√2","3/4","π","√3"],c:1,e:"Bilangan rasional dapat ditulis a/b dengan a, b bilangan bulat dan b ≠ 0. Hanya 3/4 yang memenuhi."},
{l:"sedang",t:"Pecahan",f:F(fbar([[3,4]])),q:"Bagian berwarna pada gambar di atas menunjukkan pecahan ...",o:["1/4","3/4","3/7","4/3"],c:1,e:"Ada 3 bagian berwarna dari 4 bagian yang sama besar, yaitu 3/4."},
{l:"sedang",t:"Garis Bilangan",f:F(nline(-3,3,[[-2,'A']])),q:"Titik A pada garis bilangan di atas mewakili bilangan ...",o:["−2","−1","2","3"],c:0,e:"Titik A berada 2 satuan di kiri nol, sehingga bernilai −2."},
{l:"sedang",t:"Menyederhanakan Pecahan",q:"Bentuk paling sederhana dari 2/6 adalah ...",o:["1/2","1/3","1/4","2/3"],c:1,e:"Bagi pembilang dan penyebut dengan FPB-nya (2): 2/6 = 1/3."},
{l:"sedang",t:"Penjumlahan Pecahan",q:"Hasil dari 1/2 + 1/3 adalah ...",o:["2/5","5/6","2/6","1/6"],c:1,e:"Samakan penyebut: 3/6 + 2/6 = 5/6."},
{l:"sedang",t:"Pecahan Desimal",q:"Bentuk pecahan paling sederhana dari 0,75 adalah ...",o:["3/4","7/5","1/75","75/10"],c:0,e:"0,75 = 75/100 = 3/4."},
{l:"sedang",t:"Perkalian Pecahan",q:"Hasil dari 3/4 × 2/3 adalah ...",o:["5/7","1/2","6/7","1/4"],c:1,e:"3/4 × 2/3 = 6/12 = 1/2."},
{l:"sedang",t:"Pembagian Pecahan",q:"Hasil dari 1/2 : 1/4 adalah ...",o:["1/8","1/2","2","4"],c:2,e:"1/2 : 1/4 = 1/2 × 4/1 = 2."},
{l:"sedang",t:"Bilangan Rasional Negatif",q:"Hasil dari −1/2 + 1/4 adalah ...",o:["−3/4","−1/4","1/4","3/4"],c:1,e:"−2/4 + 1/4 = −1/4."},
{l:"sedang",t:"Persen",q:"Bentuk persen dari 0,35 adalah ...",o:["3,5%","35%","0,35%","350%"],c:1,e:"0,35 × 100% = 35%."},
{l:"sedang",t:"Membandingkan Pecahan",q:"Pecahan terbesar di antara 1/2, 2/3, 3/4, dan 1/4 adalah ...",o:["1/2","2/3","3/4","1/4"],c:2,e:"Dalam bentuk desimal: 0,5; 0,67; 0,75; 0,25. Yang terbesar 3/4."},
{l:"sedang",t:"Pecahan Senilai",f:F(fbar([[1,2],[2,4]])),q:"Kedua pecahan pada gambar di atas ...",o:["tidak sama besar","senilai","pecahan pertama lebih besar","pecahan kedua lebih besar"],c:1,e:"Panjang bagian berwarna sama, sehingga 1/2 = 2/4 (senilai)."},
{l:"sedang",t:"Pecahan Campuran",q:"Bentuk pecahan campuran dari 5/4 adalah ...",o:["1 1/4","1 1/5","4 1/5","5 1/4"],c:0,e:"5/4 = 4/4 + 1/4 = 1 1/4."},
{l:"sedang",t:"Persen",q:"Bentuk pecahan paling sederhana dari 25% adalah ...",o:["1/5","1/4","1/2","2/5"],c:1,e:"25% = 25/100 = 1/4."},
{l:"sedang",t:"Garis Bilangan",f:F(nline(0,2,[[1.5,'P']],2)),q:"Titik P pada garis bilangan di atas menunjukkan bilangan ...",o:["1/2","1 1/2","2/3","2 1/2"],c:1,e:"Setiap satuan dibagi 2 bagian. P berada di tanda kedua setelah 1, yaitu 1 1/2."},
// SULIT
{l:"sulit",t:"Penjumlahan Pecahan",q:"Hasil dari 2/3 + 3/4 adalah ...",o:["5/7","1 5/12","1 1/7","1 1/12"],c:1,e:"8/12 + 9/12 = 17/12 = 1 5/12."},
{l:"sulit",t:"Pengurangan Pecahan Campuran",q:"Hasil dari 3 1/2 − 1 3/4 adalah ...",o:["1 1/4","1 1/2","1 3/4","2 1/4"],c:2,e:"7/2 − 7/4 = 14/4 − 7/4 = 7/4 = 1 3/4."},
{l:"sulit",t:"Perkalian Pecahan Campuran",q:"Hasil dari 2 1/2 × 1 1/5 adalah ...",o:["2 1/2","3","3 1/2","2 1/5"],c:1,e:"5/2 × 6/5 = 30/10 = 3."},
{l:"sulit",t:"Pembagian Pecahan",q:"Hasil dari 3/5 : 9/10 adalah ...",o:["2/3","3/2","27/50","1/2"],c:0,e:"3/5 × 10/9 = 30/45 = 2/3."},
{l:"sulit",t:"Mengurutkan Bilangan",q:"Urutan dari yang terkecil: −3/4, 1/2, −1/2, 2/3 adalah ...",o:["−3/4, −1/2, 1/2, 2/3","−1/2, −3/4, 1/2, 2/3","−3/4, 1/2, −1/2, 2/3","2/3, 1/2, −1/2, −3/4"],c:0,e:"Nilainya: −0,75; −0,5; 0,5; 0,67. Urutannya −3/4, −1/2, 1/2, 2/3."},
{l:"sulit",t:"Pecahan ke Desimal",q:"Bentuk desimal dari 7/8 adalah ...",o:["0,785","0,875","0,78","0,825"],c:1,e:"7 : 8 = 0,875."},
{l:"sulit",t:"Bilangan di Antara",q:"Bilangan rasional yang terletak di antara 1/2 dan 3/4 adalah ...",o:["1/3","3/5","4/5","1/4"],c:1,e:"3/5 = 0,6 berada di antara 0,5 dan 0,75."},
{l:"sulit",t:"Garis Bilangan",f:F(nline(-2,2,[[-1.5,'A'],[0.5,'B']],2)),q:"Berdasarkan garis bilangan di atas, hasil A + B adalah ...",o:["−2","−1","1","2"],c:1,e:"A = −3/2 dan B = 1/2. Jumlahnya = −3/2 + 1/2 = −1."},
{l:"sulit",t:"Penjumlahan Pecahan",f:F(fbar([[2,5],[3,5]])),q:"Jumlah kedua pecahan pada gambar di atas adalah ...",o:["1/5","6/25","1","2/3"],c:2,e:"2/5 + 3/5 = 5/5 = 1 (satu bagian utuh)."},
{l:"sulit",t:"Operasi Campuran",q:"Hasil dari 0,6 + 1/4 adalah ...",o:["0,75","0,85","0,95","1,0"],c:1,e:"1/4 = 0,25, sehingga 0,6 + 0,25 = 0,85."},
{l:"sulit",t:"Persen",q:"40% dari 250 adalah ...",o:["80","100","120","150"],c:1,e:"40/100 × 250 = 100."},
{l:"sulit",t:"Pecahan Senilai",q:"Pecahan yang senilai dengan 3/5 adalah ...",o:["6/15","9/15","10/15","12/15"],c:1,e:"3/5 = (3×3)/(5×3) = 9/15."},
{l:"sulit",t:"Perkalian Bilangan Negatif",q:"Hasil dari −2/3 × 9/4 adalah ...",o:["−3/2","3/2","−2/3","−1/2"],c:0,e:"−18/12 = −3/2."},
{l:"sulit",t:"Pengurangan Bilangan Negatif",q:"Hasil dari −5/6 − (−1/3) adalah ...",o:["−7/6","−1/2","1/2","7/6"],c:1,e:"−5/6 + 2/6 = −3/6 = −1/2."},
{l:"sulit",t:"Rata-rata",q:"Rata-rata dari 1/2 dan 3/4 adalah ...",o:["5/8","4/6","5/4","3/8"],c:0,e:"(1/2 + 3/4) : 2 = (5/4) : 2 = 5/8."},
// HOTS
{l:"hots",t:"Soal Cerita",q:"Ibu memiliki 3/4 kg gula. Sebanyak 1/3 kg dipakai untuk membuat kue. Sisa gula Ibu adalah ... kg.",o:["1/4","5/12","7/12","2/3"],c:1,e:"3/4 − 1/3 = 9/12 − 4/12 = 5/12 kg."},
{l:"hots",t:"Soal Cerita",q:"Seutas tali sepanjang 5 meter dipotong-potong, masing-masing 5/8 meter. Banyak potongan tali adalah ...",o:["6","8","10","12"],c:1,e:"5 : 5/8 = 5 × 8/5 = 8 potong."},
{l:"hots",t:"Soal Cerita",q:"Pak Budi mengerjakan 2/5 pekerjaan pada hari pertama dan 1/4 pada hari kedua. Bagian pekerjaan yang belum selesai adalah ...",o:["3/20","7/20","13/20","3/9"],c:1,e:"Selesai = 8/20 + 5/20 = 13/20. Sisa = 1 − 13/20 = 7/20."},
{l:"hots",t:"Persen dan Diskon",q:"Harga sebuah baju Rp120.000 dan mendapat diskon 25%. Harga yang dibayar adalah ...",o:["Rp85.000","Rp90.000","Rp95.000","Rp100.000"],c:1,e:"Diskon = 25% × 120.000 = 30.000. Harga bayar = Rp90.000."},
{l:"hots",t:"Garis Bilangan",f:F(nline(-3,3,[[-2.5,'P'],[1.5,'Q']],2)),q:"Jarak titik P ke titik Q pada garis bilangan di atas adalah ...",o:["3","3,5","4","5"],c:2,e:"P = −2,5 dan Q = 1,5. Jarak = 1,5 − (−2,5) = 4."},
{l:"hots",t:"Soal Cerita",q:"Keran A mengisi 1/3 bagian kolam per jam dan keran B mengisi 1/6 bagian per jam. Jika dibuka bersamaan, kolam penuh dalam ... jam.",o:["1","2","3","4"],c:1,e:"Per jam = 1/3 + 1/6 = 1/2 bagian. Kolam penuh dalam 1 : 1/2 = 2 jam."},
{l:"hots",t:"Pecahan dalam Gambar",f:F(fbar([[3,8]])),q:"Bagian berwarna menunjukkan pita yang terpakai. Jika panjang seluruh pita 40 cm, pita yang terpakai adalah ...",o:["12 cm","15 cm","16 cm","25 cm"],c:1,e:"3/8 × 40 = 15 cm."},
{l:"hots",t:"Desimal Negatif",q:"Suhu pagi hari −3,5 °C. Pada siang hari suhu naik 8,25 °C. Suhu siang hari adalah ...",o:["4,25 °C","4,75 °C","5,25 °C","11,75 °C"],c:1,e:"−3,5 + 8,25 = 4,75 °C."},
{l:"hots",t:"Persamaan Pecahan",q:"Nilai x yang memenuhi x/3 + 1/2 = 5/6 adalah ...",o:["1","2","1/3","3"],c:0,e:"x/3 = 5/6 − 3/6 = 1/3 → x = 1."},
{l:"hots",t:"Membandingkan Bilangan",q:"Dari bilangan −3/4, 0,6, 2/3, dan −0,8, selisih bilangan terbesar dan terkecil adalah ...",o:["22/15","17/15","7/15","37/15"],c:0,e:"Terbesar 2/3 (0,667), terkecil −0,8. Selisih = 2/3 + 4/5 = 10/15 + 12/15 = 22/15."},
// OLIMPIADE
{l:"olimpiade",t:"Deret Pecahan",q:"Nilai dari 1/(1×2) + 1/(2×3) + 1/(3×4) adalah ...",o:["1/2","2/3","3/4","5/6"],c:2,e:"Tiap suku = 1/n − 1/(n+1), sehingga jumlahnya = 1 − 1/4 = 3/4."},
{l:"olimpiade",t:"Perbandingan",q:"Jika a/b = 2/3, nilai dari (a + b)/b adalah ...",o:["4/3","5/3","7/3","2"],c:1,e:"(a+b)/b = a/b + 1 = 2/3 + 1 = 5/3."},
{l:"olimpiade",t:"Bilangan di Antara",q:"Banyak bilangan bulat yang terletak di antara −7/2 dan 13/3 adalah ...",o:["7","8","9","10"],c:1,e:"−3,5 < x < 4,33, sehingga x = −3, −2, −1, 0, 1, 2, 3, 4 (8 bilangan)."},
{l:"olimpiade",t:"Perkalian Berantai",q:"Nilai dari (1 − 1/2)(1 − 1/3)(1 − 1/4)(1 − 1/5) adalah ...",o:["1/2","1/4","1/5","1/6"],c:2,e:"= 1/2 × 2/3 × 3/4 × 4/5 = 1/5 (saling meniadakan)."},
{l:"olimpiade",t:"Desimal Berulang",q:"Bentuk pecahan dari 0,1818181818... adalah ...",o:["9/50","2/11","1/9","18/100"],c:1,e:"Misalkan x = 0,1818...; 100x − x = 18 → 99x = 18 → x = 18/99 = 2/11."}
];
const LB={sedang:"Sedang",sulit:"Sulit",hots:"HOTS",olimpiade:"Olimpiade"},LT=['A','B','C','D'];
const S={cur:0,ans:Q.map(()=>null),done:false};
const $=id=>document.getElementById(id),panel=$('panel'),grid=$('grid');
Q.forEach((q,i)=>{const b=document.createElement('button');b.type='button';b.className='cell '+q.l;b.textContent=i+1;b.setAttribute('aria-label','Soal '+(i+1)+', '+LB[q.l]);b.onclick=()=>{S.cur=i;render()};grid.appendChild(b)});
function upd(){grid.childNodes.forEach((c,i)=>{c.classList.toggle('answered',S.ans[i]!==null);c.classList.toggle('current',i===S.cur&&!S.done)});
 const n=S.ans.filter(a=>a!==null).length;$('pf').style.width=Math.round(n/Q.length*100)+'%';$('pl').textContent=n+' dari '+Q.length+' soal terjawab'}
function confirmBox(msg,ok){$('cm').textContent=msg;$('ov').classList.remove('hidden');$('no').onclick=()=>$('ov').classList.add('hidden');$('yes').onclick=()=>{$('ov').classList.add('hidden');ok()}}
function submit(){const u=S.ans.filter(a=>a===null).length;const go=()=>{S.done=true;results()};u?confirmBox('Masih ada '+u+' soal belum dijawab. Tetap kumpulkan?',go):go()}
$('bsub').onclick=submit;
function question(){
  const i=S.cur,q=Q[i];
  panel.innerHTML=`<div class="card ${q.l}"><div class="chips"><span class="chip">${LB[q.l]}</span><span class="tc">${q.t}</span></div>
  <div class="qn">Soal ${i+1} dari ${Q.length}</div>${q.f||''}<p class="qt">${q.q}</p>
  <fieldset>${q.o.map((o,k)=>`<label class="opt${S.ans[i]===k?' sel':''}"><input type="radio" name="o" value="${k}"${S.ans[i]===k?' checked':''}><span class="ol">${LT[k]}.</span><span>${o}</span></label>`).join('')}</fieldset>
  <div class="nb"><button type="button" class="g" id="pv"${i?'':' disabled'}>Sebelumnya</button><button type="button" class="p" id="nx">${i===Q.length-1?'Ke ringkasan':'Berikutnya'}</button></div></div>`;
  panel.querySelectorAll('input').forEach(inp=>inp.onchange=e=>{S.ans[i]=+e.target.value;panel.querySelectorAll('.opt').forEach((el,k)=>el.classList.toggle('sel',k===S.ans[i]));upd()});
  $('pv').onclick=()=>{S.cur--;render()};
  $('nx').onclick=()=>i===Q.length-1?submit():(S.cur++,render());
}
function results(){
  const cnt={};Object.keys(LB).forEach(k=>cnt[k]=[0,0]);let tot=0;
  Q.forEach((q,i)=>{cnt[q.l][1]++;if(S.ans[i]===q.c){cnt[q.l][0]++;tot++}});
  const sc=Math.round(tot/Q.length*100),col=sc>=75?'var(--ok)':sc>=50?'var(--gold)':'var(--bad)';
  $('side').classList.add('hidden');
  panel.innerHTML=`<div class="rw"><h2>Hasil ujian</h2><div class="hero"><span class="n" style="color:${col}">${tot}</span><span class="o">dari ${Q.length} soal benar · nilai akhir <b style="color:${col}">${sc}</b></span></div>
  ${Object.keys(LB).map(k=>`<div class="bd ${k}"><span>${LB[k]}</span><div class="bt"><div style="width:${cnt[k][1]?cnt[k][0]/cnt[k][1]*100:0}%"></div></div><span>${cnt[k][0]}/${cnt[k][1]}</span></div>`).join('')}
  <button class="g" id="rt">Ulangi ujian</button>
  <div style="margin-top:24px">${Q.map((q,i)=>{const a=S.ans[i],ok=a===q.c;return `<div class="ri ${q.l}"><div class="chips"><span class="chip">${LB[q.l]}</span><span class="tc">${q.t}</span><span class="tc" style="color:${ok?'var(--ok)':'var(--bad)'};border-color:currentColor">${ok?'Benar':a===null?'Tidak dijawab':'Salah'}</span></div>${q.f||''}<p class="rq">${i+1}. ${q.q}</p>${q.o.map((o,k)=>`<div class="ro ${k===q.c?'c':k===a?'w':''}">${LT[k]}. ${o}</div>`).join('')}<div class="ex"><b>Pembahasan:</b> ${q.e}</div></div>`}).join('')}</div></div>`;
  $('rt').onclick=()=>{S.cur=0;S.ans=Q.map(()=>null);S.done=false;$('side').classList.remove('hidden');render()};
  panel.scrollTo(0,0);
}
function render(){if(S.done)return results();question();upd();panel.scrollTo(0,0)}
render();
</script>
</body>
</html>
