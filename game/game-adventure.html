<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informatika Adventure 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2a4e; --ink2:#42517a; --paper:#ffffff; --mist:#eef4ff; --line:#d5e0f7;
  --sun:#ffb703; --sun-d:#c98400; --aqua:#2ec4b6; --aqua-d:#1b9488; --coral:#ff5d6c; --coral-d:#cc3445;
  --grape:#6c4cf1; --grape-d:#4630bd; --good:#16a36b; --bad:#e5484d;
  --display:'Fredoka',system-ui,'Segoe UI',sans-serif; --body:'Nunito',system-ui,'Segoe UI',sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#8fd0f7;color:var(--ink);font-family:var(--body);font-weight:700;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;user-select:none}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(10,30,70,.28) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s}
#flash.bad{background:radial-gradient(ellipse at center,transparent 35%,rgba(255,60,80,.55));opacity:1;transition:none}
#flash.good{background:radial-gradient(ellipse at center,transparent 40%,rgba(255,225,90,.45));opacity:1;transition:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* buttons */
.btn{font-family:var(--display);font-weight:600;font-size:17px;padding:12px 22px;border:0;border-radius:999px;color:#fff;background:var(--grape);box-shadow:0 5px 0 var(--grape-d);transition:transform .08s, box-shadow .08s}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:0 1px 0 var(--grape-d)}
.btn.go{background:var(--good);box-shadow:0 5px 0 #0d7a4e}
.btn.go:active:not([disabled]){box-shadow:0 1px 0 #0d7a4e}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-d)}
.btn.sun:active:not([disabled]){box-shadow:0 1px 0 var(--sun-d)}
.btn.aqua{background:var(--aqua);box-shadow:0 5px 0 var(--aqua-d)}
.btn.aqua:active:not([disabled]){box-shadow:0 1px 0 var(--aqua-d)}
.btn.ghost{background:var(--mist);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.ghost:active:not([disabled]){box-shadow:0 1px 0 var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* title wordmark */
#title{position:fixed;left:0;right:0;top:calc(18px + env(safe-area-inset-top,0px));text-align:center;pointer-events:none}
#title h1{font-size:clamp(34px,8vw,64px);font-weight:700;color:#fff;letter-spacing:.5px;
  text-shadow:0 4px 0 var(--grape-d),0 8px 0 rgba(27,42,78,.35),0 0 30px rgba(108,76,241,.5)}
#title p{margin:6px auto 0;max-width:30ch;font-size:clamp(15px,3.6vw,19px);color:#fff;text-shadow:0 2px 6px rgba(20,40,90,.7)}

/* hud */
#hud{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
#hud>*{pointer-events:auto}
.hud-card{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.94);border-radius:20px;padding:8px 14px 8px 8px;box-shadow:0 5px 0 rgba(27,42,78,.18),0 10px 24px rgba(20,40,90,.25);min-width:0}
.hud-card .av{width:46px;height:46px;border-radius:14px;background:var(--mist);display:grid;place-items:center;font-size:28px;flex:none}
.hud-card .nm{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.1;max-width:15ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-card .lv{font-size:13px;color:var(--ink2)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px;width:150px;max-width:36vw}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--aqua),var(--good));transition:width .5s}
.hud-btns{display:flex;gap:8px;margin-right:56px}
.ib{width:46px;height:46px;border-radius:15px;border:0;background:rgba(255,255,255,.94);font-size:21px;box-shadow:0 5px 0 rgba(27,42,78,.18),0 10px 24px rgba(20,40,90,.25);line-height:1}
.ib:active{transform:translateY(3px)}
.ib[aria-pressed="true"]{background:var(--sun)}

/* mission bar */
#mbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));width:min(620px,calc(100% - 24px));pointer-events:none}
#mbar .pill{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-right:66px!important;background:rgba(255,255,255,.95);border-radius:20px;padding:10px 16px;box-shadow:0 5px 0 rgba(27,42,78,.18),0 10px 24px rgba(20,40,90,.25)}
#mbar .t{font-family:var(--display);font-weight:600;font-size:17px}
.dots{display:flex;gap:6px;margin-top:6px}
.dots i{width:22px;height:8px;border-radius:99px;background:var(--line)}
.dots i.done{background:var(--good)}
.dots i.now{background:var(--sun)}
.hearts{font-size:22px;letter-spacing:2px;white-space:nowrap}
.bossbar{margin-top:10px;display:flex;align-items:center;gap:10px;background:rgba(40,20,70,.88);color:#fff;border-radius:16px;padding:8px 14px}
.bossbar b{font-family:var(--display);font-weight:600;font-size:15px;white-space:nowrap}
.bossbar .bb{flex:1;height:14px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.bossbar .bb>i{display:block;height:100%;background:linear-gradient(90deg,#ff5d6c,#ff9f43);transition:width .5s}

/* tray */
#tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;width:min(640px,calc(100% - 20px))}
#tray .tip{background:rgba(27,42,78,.78);color:#fff;border-radius:99px;padding:6px 16px;font-size:14px;text-align:center}
#tray .chips{display:flex;gap:8px;background:rgba(255,255,255,.95);padding:10px;border-radius:26px;box-shadow:0 5px 0 rgba(27,42,78,.18),0 12px 28px rgba(20,40,90,.3);width:100%;justify-content:space-between}
.lc{flex:1;min-width:0;border:0;border-radius:18px;background:var(--mist);padding:8px 2px 6px;text-align:center;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.lc:active:not([aria-disabled="true"]){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.lc .ic{font-size:26px;line-height:1.1;display:block}
.lc .nm{font-family:var(--display);font-weight:500;font-size:12px;line-height:1.2;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.lc .st{font-size:11px;display:block;color:#d9a000;letter-spacing:1px;min-height:15px}
.lc[aria-current="true"]{background:var(--sun);box-shadow:0 4px 0 var(--sun-d)}
.lc[aria-current="true"] .st{color:var(--ink)}
.lc[aria-disabled="true"]{opacity:.5;cursor:not-allowed}

#toast{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);background:var(--ink);color:#fff;border-radius:99px;padding:8px 18px;font-size:15px;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 24px);text-align:center;z-index:5}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* audio */
#audbtn{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:6}
#audbtn[aria-expanded="true"]{background:var(--sun)}
#audpanel{position:fixed;right:12px;top:calc(66px + env(safe-area-inset-top,0px));z-index:6;width:min(280px,calc(100% - 24px));background:rgba(255,255,255,.97);border-radius:22px;padding:10px 16px;box-shadow:0 6px 0 rgba(27,42,78,.18),0 14px 30px rgba(20,40,90,.35)}
.arow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;font-size:15px}
.arow+.arow{border-top:2px solid var(--mist)}
.arow.vol{display:block}
.arow.vol input{width:100%;margin-top:6px;accent-color:var(--grape)}
.swt{position:relative;width:52px;height:30px;flex:none;border:0;border-radius:99px;background:#c5cde0;transition:background .15s}
.swt::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .15s}
.swt[aria-checked="true"]{background:var(--good)}
.swt[aria-checked="true"]::after{transform:translateX(22px)}

/* sheet */
#sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(680px,100%);max-height:min(62vh,580px);overflow:auto;background:rgba(255,255,255,.97);border-radius:30px 30px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 44px rgba(20,40,90,.38);animation:rise .35s cubic-bezier(.2,.9,.3,1.1)}
@keyframes rise{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#sheet h2{font-size:24px}
#sheet .sub{color:var(--ink2);font-size:15px}
.stack>*+*{margin-top:14px}
label.f{font-family:var(--display);font-weight:600;font-size:18px}
input[type=text]{width:100%;margin-top:8px;font:inherit;font-weight:800;font-size:18px;padding:12px 16px;border:3px solid var(--line);border-radius:16px;background:#fff;color:var(--ink)}
input[type=text]:focus{border-color:var(--grape)}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.char{border:3px solid var(--line);background:var(--mist);border-radius:20px;padding:10px 4px;text-align:center;transition:transform .12s}
.char .e{font-size:40px;line-height:1.1}
.char .n{font-family:var(--display);font-weight:600;font-size:17px}
.char .r{font-size:12px;color:var(--ink2);line-height:1.25}
.char[aria-pressed="true"]{background:#fff4cc;border-color:var(--sun);transform:translateY(-3px)}
.note{background:var(--mist);border-radius:16px;padding:10px 14px;font-size:15px}
.dialog{display:flex;gap:12px;align-items:flex-start}
.dialog .npc{font-size:46px;line-height:1;flex:none}
.dialog .bub{background:var(--mist);border-radius:6px 20px 20px 20px;padding:12px 16px;font-size:16px}
.dialog .bub b{display:block;font-family:var(--display);font-weight:600;color:var(--grape);margin-bottom:2px}

/* mission */
.mtag{font-size:14px;color:var(--ink2)}
.q{font-size:19px;font-weight:800;line-height:1.5;margin-top:4px}
.q code,.why code{font-family:'Courier New',monospace;background:var(--mist);border:2px solid var(--line);border-radius:8px;padding:0 6px}
pre.code{margin:12px 0 0;background:#1b2a4e;color:#b8f5d0;border-radius:16px;padding:12px 16px;font-family:'Courier New',monospace;font-size:15px;overflow-x:auto;line-height:1.55;user-select:text}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;font-weight:800;font-size:16px;padding:13px 16px;border:3px solid var(--line);border-radius:18px;background:var(--mist);box-shadow:0 4px 0 var(--line);transition:transform .08s}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.wrong{background:#ffe3e5;border-color:#ffb3b8;text-decoration:line-through;opacity:.8}
.opt.right{background:#d5f6e6;border-color:var(--good)}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:18px;padding:12px 16px;font-size:15px}
.fb.good{background:#d5f6e6}
.fb.bad{background:#ffe3e5}
.hintbox{margin-top:12px;background:#fff4cc;border-radius:16px;padding:10px 14px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--mist);border:3px solid var(--line);border-radius:14px;padding:8px 12px;font-size:15px;font-weight:800;text-align:left;box-shadow:0 3px 0 var(--line)}
.slot{border:3px dashed var(--line);border-radius:18px;padding:10px;margin-top:12px;min-height:58px;display:grid;gap:6px}
.slot .chip{display:flex;gap:10px;background:#fff4cc;border-color:#ffe08a;box-shadow:0 3px 0 #ffe08a}
.slot .chip b{font-family:var(--display);color:var(--sun-d)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.match .col{display:grid;gap:10px;align-content:start}
.mbtn{font-weight:800;font-size:14px;line-height:1.35;padding:10px 12px;border:3px solid var(--line);border-radius:16px;background:var(--mist);box-shadow:0 3px 0 var(--line);text-align:left}
.mbtn.sel{background:#fff4cc;border-color:var(--sun)}
.mbtn.ok{background:#d5f6e6;border-color:var(--good);cursor:default}
.inrow{display:flex;gap:10px;margin-top:14px;align-items:stretch}
.inrow input{margin-top:0;flex:1;min-width:0}
.stars{font-size:40px;letter-spacing:6px;margin:6px 0}
.badge{display:inline-block;background:var(--sun);color:var(--ink);font-family:var(--display);font-weight:600;border-radius:99px;padding:6px 16px;box-shadow:0 3px 0 var(--sun-d)}
.center{text-align:center}
.bigico{font-size:64px;line-height:1.1}

#nogl{position:fixed;inset:0;display:grid;place-items:center;background:#1b2a4e;color:#fff;padding:30px;text-align:center}

@media (max-width:420px){
  .match{grid-template-columns:1fr}
  .hud-card .nm{max-width:9ch}
  .bar{width:110px}
  .lc .nm{font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  #sheet{animation:none}
  .bar>i,.bossbar .bb>i{transition:none}
}
</style>
</head>
<body>
<canvas id="gl" aria-label="Dunia 3D Informatika Adventure. Seret untuk memutar kamera."></canvas>
<div id="vig"></div>
<div id="flash"></div>
<div id="ui">
  <header id="title" hidden>
    <h1>Informatika<br>Adventure</h1>
    <p>Jelajahi pulau digital dan kalahkan Raja Bug!</p>
  </header>
  <div id="hud" hidden>
    <div class="hud-card">
      <div class="av" id="h-av" aria-hidden="true"></div>
      <div>
        <div class="nm" id="h-nm"></div>
        <div class="lv" id="h-lv"></div>
        <div class="bar" role="progressbar" aria-label="XP menuju level berikutnya" id="h-bar" aria-valuemin="0" aria-valuemax="40"><i id="h-fill"></i></div>
      </div>
    </div>
    <div class="hud-btns">
      <button class="ib" id="b-ov" aria-pressed="false" aria-label="Lihat seluruh pulau" title="Lihat seluruh pulau">🗺️</button>
      <button class="ib" id="b-home" aria-label="Menu utama" title="Menu utama">🏠</button>
    </div>
  </div>
  <div id="mbar" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <button class="ib" id="audbtn" aria-label="Pengaturan suara" aria-expanded="false" aria-controls="audpanel" title="Pengaturan suara">🎵</button>
  <div id="audpanel" hidden role="group" aria-label="Pengaturan suara">
    <div class="arow"><span>🎵 Musik</span><button class="swt" id="sw-music" role="switch" aria-checked="true" aria-label="Musik"></button></div>
    <div class="arow"><span>🔊 Efek dan suasana</span><button class="swt" id="sw-sfx" role="switch" aria-checked="true" aria-label="Efek suara dan suasana"></button></div>
    <div class="arow"><span>🗣️ Suara karakter</span><button class="swt" id="sw-voice" role="switch" aria-checked="true" aria-label="Suara karakter"></button></div>
    <label class="arow vol"><span>Volume musik</span><input type="range" id="vol" min="0" max="100" value="70" aria-label="Volume musik"></label>
  </div>
  <nav id="tray" hidden aria-label="Daftar level"></nav>
  <section id="sheet" hidden></section>
</div>
<div id="nogl" hidden><div><div style="font-size:60px">😵</div><h2 style="font-family:var(--display)">Dunia 3D tidak bisa dimuat</h2><p>Browsermu belum mendukung WebGL atau pustaka 3D gagal dimuat. Coba buka lewat Chrome, Edge, Safari, atau Firefox terbaru.</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(typeof THREE==='undefined'){ document.getElementById('nogl').hidden=false; return; }

/* =========================================================
   MATH + HELPERS
   ========================================================= */
const V3=THREE.Vector3;
const C=h=>new THREE.Color(h).convertSRGBToLinear();
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const damp=(a,b,l,dt)=>lerp(a,b,1-Math.exp(-l*dt));
const angDiff=(a,b)=>{let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(20261013);
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOBILE=Math.min(innerWidth,innerHeight)<700;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};

/* =========================================================
   GAME DATA
   ========================================================= */
const CHARS=[
  {id:'bita',emoji:'👩‍💻',name:'Bita',role:'Si Pemecah Kode',perk:'Setiap level mulai dengan 1 petunjuk gratis.',hp:3,xp:1,freeHint:1},
  {id:'robo',emoji:'🤖',name:'Robo',role:'Si Baja Digital',perk:'Punya 4 nyawa, bukan 3.',hp:4,xp:1,freeHint:0},
  {id:'nara',emoji:'🦊',name:'Nara',role:'Si Cerdik',perk:'Dapat bonus XP 25% di setiap misi.',hp:3,xp:1.25,freeHint:0}
];
const charOf=id=>CHARS.find(c=>c.id===id)||CHARS[0];

const LEVELS=[
 {id:1,name:'Desa Biner',icon:'🏘️',npc:'🧙',npcName:'Tetua Bit',
  story:'Selamat datang! Di desa ini semua penduduk berbicara dengan dua angka saja: 0 dan 1. Bantu aku membaca pesan mereka agar gerbang desa terbuka.',
  badge:'Lencana Biner',badgeIcon:'🔢',missions:[
   {t:'choice',q:'Komputer hanya memahami dua angka. Apa nama sistem bilangan yang dipakainya?',opts:['Desimal','Biner','Oktal','Romawi'],a:1,hint:'Awalan "bi-" artinya dua.',why:'Sistem biner hanya memakai angka 0 dan 1, sesuai kondisi listrik mati dan hidup.'},
   {t:'input',q:'Ubah bilangan biner <code>1011</code> menjadi desimal.',ans:['11'],hint:'Nilai tempat dari kanan: 1, 2, 4, 8. Jumlahkan yang bernilai 1: 8 + 0 + 2 + 1.',why:'1011 = 8 + 0 + 2 + 1 = 11.'},
   {t:'input',q:'Ubah bilangan desimal <code>13</code> menjadi biner.',ans:['1101'],hint:'13 = 8 + 4 + 0 + 1. Tulis 1 untuk nilai yang dipakai dan 0 untuk yang tidak.',why:'13 = 8 + 4 + 1, jadi dalam biner menjadi 1101.'},
   {t:'choice',q:'Satu byte terdiri dari berapa bit?',opts:['2 bit','4 bit','8 bit','16 bit'],a:2,hint:'Satu karakter huruf biasanya disimpan dalam satu byte.',why:'1 byte = 8 bit. Karena itu satu byte bisa menyimpan 256 nilai berbeda (0 sampai 255).'}
 ]},
 {id:2,name:'Hutan Algoritma',icon:'🌲',npc:'🦉',npcName:'Pak Gelatik',

/* =========================================================
   WORLD GEOMETRY: TERRAIN HEIGHT FUNCTION
   ========================================================= */
const NODES=[
  {x:-20,z:30,y:2.6,r0:6,r1:13},
  {x:18,z:26,y:2.7,r0:6,r1:13},
  {x:-26,z:2,y:5.6,r0:6,r1:13},
  {x:38,z:-4,y:1.1,r0:5,r1:11},
  {x:-2,z:-32,y:8.5,r0:12,r1:20}
];
function noiseH(x,z){return Math.sin(x*.21+1.3)*Math.cos(z*.19)*.55+Math.sin(x*.47+z*.31)*.28+Math.cos(x*.11-z*.13)*.6;}
const gauss=(x,z,cx,cz,r,h)=>h*Math.exp(-(((x-cx)**2+(z-cz)**2)/(r*r)));
function rawH(x,z){
  const d=Math.hypot(x/60,z/54);
  let h=(1-sm(.45,1.0,d))*5.2-2.4;
  h+=gauss(x,z,-40,-8,15,17);
  h+=gauss(x,z,-34,-20,9,7);
  h+=gauss(x,z,-2,-38,12,8);
  h+=noiseH(x,z)*sm(-1,2,h)*.9;
  return h;
}
function H(x,z){
  let h=rawH(x,z);
  for(const n of NODES){const d=Math.hypot(x-n.x,z-n.z);const w=1-sm(n.r0,n.r1,d);if(w>0)h=lerp(h,n.y,w);}
  return h;
}

/* path through the nodes (indices 0,2,5,8,11 are the five regions) */

const NODE_IDX=[0,2,5,8,11];

/* =========================================================
   MATERIALS + MESH HELPERS
   ========================================================= */
const MC={};
function mat(hex,o){
  const k=hex+(o?JSON.stringify(o):'');
  if(!MC[k]){
    const p=Object.assign({color:C(hex),roughness:.85,metalness:0,flatShading:true},o||{});
    if(typeof p.emissive==='string')p.emissive=C(p.emissive);
    MC[k]=new THREE.MeshStandardMaterial(p);
  }
  return MC[k];
}
function umat(hex,o){const p=Object.assign({color:C(hex),roughness:.7,metalness:0,flatShading:true},o||{});if(typeof p.emissive==='string')p.emissive=C(p.emissive);return new THREE.MeshStandardMaterial(p);}
const Bx=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const Cy=(rt,rb,h,s=10)=>new THREE.CylinderGeometry(rt,rb,h,s);
const Cn=(r,h,s=8)=>new THREE.ConeGeometry(r,h,s);
const Sp=(r,ws=12,hs=9,...rest)=>new THREE.SphereGeometry(r,ws,hs,...rest);
const Ic=(r,d=0)=>new THREE.IcosahedronGeometry(r,d);
function add(p,g,m,x,y,z,rx,ry,rz){
  const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);o.rotation.set(rx||0,ry||0,rz||0);
  o.castShadow=true;o.receiveShadow=true;p.add(o);return o;
}

/* =========================================================
   TERRAIN
   ========================================================= */
const COL={sand:C('#f2dca8'),wet:C('#d6bf8c'),deep:C('#bba878'),grass:C('#7ccd68'),grass2:C('#5db75e'),forest:C('#3b9657'),dirt:C('#c9a36b'),rock:C('#8f98ad'),rock2:C('#727b94'),snow:C('#f7fbff'),stone:C('#a79bc6')};
function groundColor(x,z,h){
  const c=new THREE.Color();
  const n=clamp(noiseH(x*1.9,z*1.9)*.5+.5,0,1);
  if(h<-.15) return c.copy(COL.deep).lerp(COL.wet,sm(-2.4,-.15,h));
  c.copy(COL.grass).lerp(COL.grass2,n*.9);
  const dF=Math.hypot(x-NODES[1].x,z-NODES[1].z); c.lerp(COL.forest,(1-sm(8,22,dF))*.85);
  const dV=Math.hypot(x-NODES[0].x,z-NODES[0].z); c.lerp(COL.dirt,(1-sm(2.5,6,dV))*.55);
  const dC=Math.hypot(x-NODES[4].x,z-(NODES[4].z-6));
  const mr=sm(7.5,11,h)*sm(12,24,dC);
  c.lerp(n>.5?COL.rock:COL.rock2,mr);
  c.lerp(COL.snow,sm(14.5,17.5,h+n*1.2)*sm(12,24,dC));
  c.lerp(COL.stone,(1-sm(10,23,dC))*.9);
  const dB=Math.hypot(x-NODES[3].x,z-NODES[3].z);
  const sand=Math.max(1-sm(.3,1.5,h),(1-sm(9,17,dB))*(1-sm(1.6,3.2,h)));
  c.lerp(COL.sand,clamp(sand,0,1));
  c.lerp(COL.wet,(1-sm(-.1,.35,h))*.6);
  return c;
}
let terrain;
(function buildTerrain(){
  const TW=156,TD=146;
  const g=new THREE.PlaneGeometry(TW,TD,104,96);
  g.rotateX(-Math.PI/2);
  const pa=g.attributes.position;
  const cols=new Float32Array(pa.count*3);
  const r=mulberry32(77);
  for(let i=0;i<pa.count;i++){
    let x=pa.getX(i),z=pa.getZ(i);
    if(Math.abs(x)<TW/2-.5&&Math.abs(z)<TD/2-.5){x+=(r()-.5)*.95;z+=(r()-.5)*.95;}
    const h=H(x,z);
    pa.setXYZ(i,x,h,z);
    const c=groundColor(x,z,h);
    cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;
  }
  g.setAttribute('color',new THREE.BufferAttribute(cols,3));
  g.computeVertexNormals();
  terrain=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1,metalness:0}));
  terrain.receiveShadow=true;terrain.castShadow=true;
  world.add(terrain);
})();

/* water */
let waterGeo,waterBase;
(function(){
  const wm=()=>new THREE.MeshStandardMaterial({color:C('#2fa8e8'),roughness:.28,metalness:.05,flatShading:true,transparent:true,opacity:.84});
  waterGeo=new THREE.PlaneGeometry(176,176,64,64);waterGeo.rotateX(-Math.PI/2);
  waterBase=waterGeo.attributes.position.array.slice();
  const w=new THREE.Mesh(waterGeo,wm());w.position.y=-.02;w.receiveShadow=true;world.add(w);
  const far=new THREE.Mesh(new THREE.PlaneGeometry(1800,1800),new THREE.MeshStandardMaterial({color:C('#2fa8e8'),roughness:.4,metalness:0,flatShading:true,transparent:true,opacity:.84}));
  far.rotation.x=-Math.PI/2;far.position.y=-.5;world.add(far);
  // opaque deep floor under the far water so it reads as ocean

  floor.rotation.x=-Math.PI/2;floor.position.y=-3.2;world.add(floor);

function updWater(t){
  const p=waterGeo.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=waterBase[i*3],z=waterBase[i*3+2];
    p.setY(i,Math.sin(x*.23+t*1.3)*.13+Math.cos(z*.2+t*1.1)*.13+Math.sin((x+z)*.11+t*.7)*.1);
  }
  p.needsUpdate=true;
}

/* =========================================================
   PATH (curve + stepping stones)
   ========================================================= */
const curve=new THREE.CatmullRomCurve3(PATH_PTS.map(p=>new V3(p[0],0,p[1])),false,'centripetal');
const PATH_LEN=curve.getLength();
const lens=curve.getLengths(1100);
const nodeU=NODE_IDX.map(i=>lens[Math.round(i/(PATH_PTS.length-1)*1100)]/lens[1100]);
const pathSamples=curve.getSpacedPoints(400);
function distPath(x,z){let m=1e9;for(const p of pathSamples){const d=Math.hypot(p.x-x,p.z-z);if(d<m)m=d;}return m;}
function nearNodes(x,z,r){return NODES.some(n=>Math.hypot(x-n.x,z-n.z)<r);}
let stones,STONE_N=0,stoneU=[];
(function(){
  const step=1.55;STONE_N=Math.floor(PATH_LEN/step);
  stones=new THREE.InstancedMesh(Cy(.62,.7,.22,7),new THREE.MeshStandardMaterial({roughness:.9,flatShading:true}),STONE_N);
  stones.receiveShadow=true;stones.castShadow=false;
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),s=new V3(),pos=new V3(),e=new THREE.Euler();
  for(let i=0;i<STONE_N;i++){
    const u=(i+.5)/STONE_N;stoneU.push(u);
    const p=curve.getPointAt(u);
    const off=(rnd()-.5)*.35;
    pos.set(p.x+off,H(p.x,p.z)+.07,p.z+off*.6);
    e.set(0,rnd()*6,0);q.setFromEuler(e);
    const sc=.9+rnd()*.3;s.set(sc,1,sc);
    m.compose(pos,q,s);stones.setMatrixAt(i,m);
    stones.setColorAt(i,C('#e9e4d8'));
  }
  world.add(stones);
})();
function colorStones(upToU){
  const a=C('#ffd54a'),b=C('#e9e4d8');
  for(let i=0;i<STONE_N;i++)stones.setColorAt(i,stoneU[i]<=upToU+.001?a:b);
  stones.instanceColor.needsUpdate=true;
}

/* =========================================================
   SCENERY BUILDERS
   ========================================================= */
const occupied=[];
function free(x,z,r){return !occupied.some(o=>Math.hypot(o.x-x,o.z-z)<o.r+r);}
function scatter(n,cx,cz,rad,opt,build){
  let placed=0,tries=0;
  while(placed<n&&tries<n*60){
    tries++;
    const a=rnd()*6.283,r=Math.sqrt(rnd())*rad,x=cx+Math.cos(a)*r,z=cz+Math.sin(a)*r,h=H(x,z);
    if(h<(opt.minH!==undefined?opt.minH:.9)||h>(opt.maxH!==undefined?opt.maxH:99))continue;
    if(distPath(x,z)<(opt.path||3.2))continue;
    if(nearNodes(x,z,opt.node||7))continue;
    const rr=opt.r||1.6;
    if(!free(x,z,rr))continue;
    occupied.push({x,z,r:rr});
    build(x,h,z);placed++;
  }
}
function sway(o,a){swayers.push({o,p:rnd()*6,a:a||.025});}
function pine(x,y,z,s){
  const g=new THREE.Group();s=s||(.8+rnd()*.7);
  const gm=mat(['#2f8f5b','#3aa066','#2a8554'][Math.floor(rnd()*3)]);
  add(g,Cy(.28,.4,1.6,6),mat('#7a5233'),0,.8,0);
  add(g,Cn(2.1,2.6,7),gm,0,2.9,0);add(g,Cn(1.6,2.2,7),gm,0,4.3,0);add(g,Cn(1.1,1.9,7),gm,0,5.6,0);
  g.position.set(x,y-.1,z);g.scale.setScalar(s);g.rotation.y=rnd()*6;world.add(g);sway(g,.02);return g;
}
function roundTree(x,y,z,s,col){
  const g=new THREE.Group();s=s||(.9+rnd()*.6);
  const fm=mat(col||['#62c45c','#4fb356','#79d066'][Math.floor(rnd()*3)]);

const hero={root:null,rig:null,node:0,u:0,state:'idle',phase:0,face:Math.PI,jumpT:0,hurtT:0,cheerT:0,walk:null,charId:null};

function placeHero(i){

function updHero(t,dt){
  if(!hero.root)return;
  const R=hero.rig,pos=hero.root.position;
  if(hero.walk){
    const w=hero.walk;w.el+=dt;const k=clamp(w.el/w.dur,0,1),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

    const tg=curve.getTangentAt(clamp(hero.u,0,1));const dir=w.u1>=w.u0?1:-1;
    hero.face=Math.atan2(tg.x*dir,tg.z*dir);

  }
  pos.y=H(pos.x,pos.z);

  hero.phase+=dt*(walking?11:2.2);const s=Math.sin(hero.phase);
  let bob=walking?Math.abs(s)*.14:Math.sin(t*2)*.03;
  let legA=walking?s*.85:0,armA=walking?-s*.75:Math.sin(t*2)*.04;
  let armUp=0,wob=0,lean=walking?.08:0;
  if(hero.jumpT>0){hero.jumpT-=dt;const k=1-clamp(hero.jumpT/.9,0,1);bob+=Math.sin(k*Math.PI)*2.4;armUp=Math.sin(k*Math.PI);legA=-Math.sin(k*Math.PI)*.5;}
  if(hero.cheerT>0){hero.cheerT-=dt;armUp=Math.max(armUp,.9);bob+=Math.abs(Math.sin(t*9))*.3;}
  if(hero.hurtT>0){hero.hurtT-=dt;wob=Math.sin(t*40)*.18*(hero.hurtT/.6);bob-=.05;}
  R.body.position.y=bob;R.body.rotation.z=wob;R.body.rotation.x=lean;
  R.legL.rotation.x=legA;R.legR.rotation.x=-legA;
  R.armL.rotation.x=armA-armUp*2.6;R.armR.rotation.x=-armA-armUp*2.6;
  R.armL.rotation.z=armUp*.35;R.armR.rotation.z=-armUp*.35;
  R.head.rotation.y=walking?0:Math.sin(t*.8)*.18;
  R.head.rotation.x=isTalking('hero')?Math.sin(t*17)*.12:0;
  if(R.tail)R.tail.rotation.y=Math.sin(t*(walking?9:3))*.35;
  hero.root.rotation.y+=angDiff(hero.root.rotation.y,hero.face)*clamp(dt*10,0,1);
}

function applyGains(imm){

  set(AU.mus,AU.music?AU.vol*.55:0);set(AU.dr,AU.music?AU.vol*.5:0);set(AU.sfx,AU.sfxOn?.8:0);set(AU.amb,AU.sfxOn?1:0);set(AU.voi,AU.voice?1:0);

function auInit(){

    const c=AU.ctx=new Ctx();
    AU.master=c.createGain();AU.master.gain.value=.9;
    const comp=c.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=4;
    AU.master.connect(comp);comp.connect(c.destination);
    AU.mus=c.createGain();AU.dr=c.createGain();AU.sfx=c.createGain();AU.voi=c.createGain();AU.amb=c.createGain();
    [AU.mus,AU.dr,AU.sfx,AU.voi,AU.amb].forEach(g=>g.connect(AU.master));
    const len=Math.floor(c.sampleRate*1.6),ir=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8);}
    AU.rev=c.createConvolver();AU.rev.buffer=ir;const rg=c.createGain();rg.gain.value=.32;AU.rev.connect(rg);rg.connect(AU.master);
    AU.mus.connect(AU.rev);AU.sfx.connect(AU.rev);
    const nl=Math.floor(c.sampleRate*2),nb=c.createBuffer(1,nl,c.sampleRate),nd=nb.getChannelData(0);
    for(let i=0;i<nl;i++)nd[i]=Math.random()*2-1;AU.noise=nb;

/* ---- sound building blocks ---- */
function osc(type,f,t,dur,vol,dest,o){
  o=o||{};const c=AU.ctx,os=c.createOscillator(),g=c.createGain();let out=g;
  os.type=type;os.frequency.setValueAtTime(f,t);
  if(o.glide)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.glide),t+dur);
  if(o.det)os.detune.value=o.det;
  const at=o.a||.006,r=o.r||.03;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+at);
  if(o.sus){g.gain.setValueAtTime(vol*o.sus,t+Math.max(at+.01,dur-r));}
  g.gain.exponentialRampToValueAtTime(.0001,t+dur+r);
  os.connect(g);
  if(o.lp){const f2=c.createBiquadFilter();f2.type='lowpass';f2.frequency.value=o.lp;g.connect(f2);out=f2;}
  out.connect(dest);os.start(t);os.stop(t+dur+r+.05);
}
function nz(t,dur,vol,ftype,freq,dest,q){
  const c=AU.ctx,sr=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();
  sr.buffer=AU.noise;f.type=ftype;f.frequency.value=freq;if(q)f.Q.value=q;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  sr.connect(f);f.connect(g);g.connect(dest);sr.start(t,Math.random()*1.5);sr.stop(t+dur+.05);
}
const kick=(t,v)=>osc('sine',150,t,.2,v,AU.dr,{glide:42,r:.02});
const snare=(t,v)=>{nz(t,.15,v*.5,'bandpass',1900,AU.dr,.8);osc('triangle',210,t,.08,v*.35,AU.dr,{glide:140});};

function leadNote(kind,m,t,dur,vol){
  const f=mtof(m);

  else if(kind==='flute'){osc('triangle',f,t,dur,vol*.9,AU.mus,{a:.06,sus:.8,r:.14,lp:3000});osc('sine',f*2,t,dur,vol*.12,AU.mus,{a:.08,r:.1});}
  else if(kind==='bell'){osc('sine',f,t,.9,vol,AU.mus,{r:.2});osc('sine',f*2.76,t,.4,vol*.3,AU.mus);}
  else if(kind==='steel'){osc('triangle',f,t,.55,vol,AU.mus,{r:.1,lp:4500});osc('sine',f*2,t,.3,vol*.4,AU.mus);}
  else if(kind==='saw'){osc('sawtooth',f,t,dur,vol*.55,AU.mus,{a:.02,sus:.7,r:.1,lp:2400});osc('sawtooth',f,t,dur,vol*.35,AU.mus,{a:.02,sus:.7,r:.1,lp:2400,det:9});}

function arpNote(kind,m,t,vol){

function bassNote(kind,m,t,dur){

function padChord(ms,t,dur,vol){

function hashStr(x){let h=2166136261;for(let i=0;i<x.length;i++){h^=x.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function genPhrase(T,name){
  const r=mulberry32(hashStr(name)),out=new Array(64).fill(null);
  const sc=T.scale.concat(T.scale.slice(0,4).map(x=>x+12));let idx=2;
  const onsets=[];
  for(let st=0;st<64;st++){
    const sp=st%16;if(T.mask[sp]!=='x'||r()<(T.rest||.1))continue;
    const ch=T.prog[Math.floor(st/16)%T.prog.length];
    if(sp%8===0){
      const tones=Q[ch[1]].map(q=>(ch[0]+q)%12);let best=idx,bd=99;
      sc.forEach((v,i)=>{if(tones.includes(v%12)){const d=Math.abs(i-idx);if(d<bd){bd=d;best=i;}}});idx=best;
    }else idx=clamp(idx+Math.floor(r()*5)-2,0,sc.length-1);
    if(st>=60){const k=sc.findIndex(v=>v%12===0);if(k>=0)idx=k;}
    out[st]={m:T.root+12+sc[idx],len:1};onsets.push(st);
  }
  onsets.forEach((st,i)=>{const nx=i+1<onsets.length?onsets[i+1]:64;out[st].len=clamp(nx-st,1,4);});
  return out;
}
function applyTheme(name){
  const T=THEMES[name];if(!T)return;
  AU.theme=Object.assign({},T,{phrase:genPhrase(T,name)});AU.themeName=name;AU.step=0;AU.pending=null;
  AU.next=AU.ctx.currentTime+.06;
}
function setTheme(name,now){
  AU.wantTheme=name;if(!AU.ctx)return;
  if(name===AU.themeName&&!AU.pending)return;
  if(!AU.theme||now)applyTheme(name);else AU.pending=name;
}
function playStep(step,t){
  const T=AU.theme,sd=60/T.bpm/4,s=step%16,bar=Math.floor(step/16)%T.prog.length,ch=T.prog[bar];
  const cn=Q[ch[1]].map(q=>T.root+ch[0]+q),calm=AU.calm&&!T.boss;
  if(s===0&&T.pad){padChord(cn.map(m=>{let x=m-12;while(x<50)x+=12;return x;}),t,sd*16,T.pad);}
  const bc=T.bass[s];
  if(bc!=='.'){let bm=T.root+ch[0]-24;while(bm<38)bm+=12;while(bm>=50)bm-=12;bassNote(T.bk,bc==='5'?bm+7:bm,t,sd*1.8);}
  const a=T.arp[s];
  if(a!=='.'&&(!calm||s%4===0||s%8===2)){const i=+a,n=cn[i%cn.length]+12*Math.floor(i/cn.length);arpNote(T.arpK,n,t,calm?.07:.1);}
  const ph=T.phrase[step%64];
  if(ph&&(!calm||Math.random()<.7))leadNote(T.lead,ph.m,t,ph.len*sd*.95,T.lv*(calm?.8:1));
  if(!calm){
    if(T.k&&T.k[s]==='x')kick(t,.55);
    if(T.s&&T.s[s]==='x')snare(t,.5);
    if(T.h&&T.h[s]==='x')hat(t,s%4===0?1:.6,s%8===6&&T.boss);
    if(T.w&&T.w[s]==='x')wood(t,.8);
    if(T.h&&!T.k.includes('x')&&T.h[s]==='x')shaker(t,.7);
  }
}
function tick(){
  if(!AU.ctx||AU.ctx.state!=='running'||!AU.music||!AU.theme)return;
  const c=AU.ctx;
  if(AU.next<c.currentTime-.5)AU.next=c.currentTime+.05;
  while(AU.next<c.currentTime+.2){
    if(AU.step%16===0&&AU.pending)applyTheme(AU.pending);
    playStep(AU.step,AU.next);
    AU.next+=60/AU.theme.bpm/4;AU.step++;
  }
}

function chirp(t){const f=2400+Math.random()*1800,n=2+Math.floor(Math.random()*3);for(let i=0;i<n;i++)osc('sine',f,t+i*.12,.09,.035,AU.amb,{glide:f*(.7+Math.random()*.7),a:.01});}
function startAmbience(){
  const c=AU.ctx;
  const sr=c.createBufferSource();sr.buffer=AU.noise;sr.loop=true;
  const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=650;
  const g=c.createGain();g.gain.value=.06;
  const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.12;lg.gain.value=.045;lfo.connect(lg);lg.connect(g.gain);
  sr.connect(f);f.connect(g);g.connect(AU.amb);sr.start();lfo.start();
  setInterval(()=>{
    if(!AU.ctx||AU.ctx.state!=='running'||!AU.sfxOn||document.hidden)return;
    const t=AU.ctx.currentTime,boss=(mode==='level'&&hero.node===4&&castle.boss.g.visible);
    if(boss){if(Math.random()<.22){nz(t,2.2,.5,'lowpass',160,AU.amb);osc('sine',50,t,1.8,.2,AU.amb,{glide:35});}}
    else if(Math.random()<.5)chirp(t);
  },2500);
}

const VOICE={id:null};
function loadVoices(){
  try{
    if(!window.speechSynthesis)return;
    const v=speechSynthesis.getVoices()||[];
    VOICE.id=v.find(x=>/^id([-_]|$)/i.test(x.lang))||v.find(x=>/indones/i.test(x.name))||null;
  }catch(e){}

try{if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}}catch(e){}
const TALK={who:null,until:0};
const nowS=()=>performance.now()/1000;
const isTalking=who=>TALK.who===who&&nowS()<TALK.until;
function profOf(who){return who==='hero'?(PROF[hero.charId]||PROF.bita):PROF[who];}
function syllable(f,t,d,vowel,p){
  const c=AU.ctx,os=c.createOscillator(),g=c.createGain(),bp=c.createBiquadFilter();
  os.type=p.kind==='robot'?'square':'sawtooth';
  os.frequency.setValueAtTime(f,t);os.frequency.linearRampToValueAtTime(f*(vowel?1.08:.92),t+d);
  bp.type='bandpass';bp.frequency.value=vowel?900+Math.random()*500:450;bp.Q.value=2.5;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.16,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  os.connect(bp);bp.connect(g);g.connect(AU.voi);os.start(t);os.stop(t+d+.03);
}
function babble(text,p){
  if(!AU.ctx)return 1;
  let t=AU.ctx.currentTime+.05;const t0=t,step=.078,str=text.slice(0,110);
  for(const ch of str){
    if(/\s/.test(ch)){t+=step*.8;continue;}
    if(/[.,!?;:]/.test(ch)){t+=step*2.2;continue;}
    const lc=ch.toLowerCase(),vowel='aiueo'.includes(lc),f=p.base*(1+((lc.charCodeAt(0)%12)/12)*.9)*(vowel?1.15:.9);
    syllable(f,t,step*.9,vowel,p);t+=step;
  }
  return t-t0;
}
function stopSpeak(){TALK.until=0;try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}}
function speak(who,text){
  stopSpeak();if(!AU.voice)return;
  const p=profOf(who);if(!p)return;
  auInit();
  const clean=String(text).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();if(!clean)return;
  TALK.who=who;TALK.until=nowS()+Math.max(1.2,clean.length*.07);
  if(p.kind==='robot'&&AU.ctx&&AU.sfxOn&&AU.ctx.state==='running'){osc('square',1200,AU.ctx.currentTime,.06,.08,AU.voi,{glide:1800});}
  if(VOICE.id&&window.speechSynthesis&&window.SpeechSynthesisUtterance){
    try{
      const u=new SpeechSynthesisUtterance(clean);u.voice=VOICE.id;u.lang=VOICE.id.lang||'id-ID';
      u.pitch=clamp(p.pitch,.1,2);u.rate=clamp(p.rate,.6,1.6);u.volume=1;
      u.onend=u.onerror=()=>{if(TALK.who===who)TALK.until=0;};
      TALK.until=nowS()+Math.max(2.5,clean.length*.1);
      if(speechSynthesis.paused)speechSynthesis.resume();
      speechSynthesis.speak(u);return;
    }catch(e){}
  }
  TALK.until=nowS()+babble(clean,p);
}
/* gelembung ucapan 3D */
const bubbles=[];
function speakerPos(who){
  if(who==='hero')return hero.root.position.clone().add(new V3(0,5.6,0));
  if(who==='boss')return castle.boss.g.position.clone().add(new V3(0,6.4,0));
  const i=+who.slice(1);return npcs[i].g.position.clone().add(new V3(0,6.8,0));
}
function bubble(who,text,sec){
  const cv=document.createElement('canvas');cv.width=512;cv.height=160;const g=cv.getContext('2d');
  const w=clamp(80+text.length*26,200,480),x=(512-w)/2;
  roundRect(g,x,12,w,100,40);g.fillStyle='rgba(255,255,255,.97)';g.fill();g.lineWidth=7;g.strokeStyle=who==='boss'?'#8c1630':'#6c4cf1';g.stroke();
  g.beginPath();g.moveTo(236,110);g.lineTo(256,146);g.lineTo(278,110);g.closePath();g.fillStyle='rgba(255,255,255,.97)';g.fill();
  g.fillStyle='#1b2a4e';g.textAlign='center';g.textBaseline='middle';g.font='600 44px Fredoka, Nunito, sans-serif';g.fillText(text,256,62);
  const tx=new THREE.CanvasTexture(cv);tx.encoding=THREE.sRGBEncoding;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthTest:false,depthWrite:false,fog:false}));
  sp.scale.set(10,3.1,1);sp.renderOrder=30;scene.add(sp);
  bubbles.push({who,sp,tx,end:nowS()+sec});
}
anim.push((t)=>{
  const n=nowS();
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i],rem=b.end-n;
    if(rem<=0){scene.remove(b.sp);b.tx.dispose();b.sp.material.dispose();bubbles.splice(i,1);continue;}
    try{b.sp.position.copy(speakerPos(b.who));}catch(e){}
    b.sp.position.y+=Math.sin(t*3)*.15;
    b.sp.material.opacity=Math.min(1,rem/.4);
  }
  npcs.forEach((np,i)=>{
    if(isTalking('n'+i)){np.g.scale.set(1.15,1.15*(1+Math.abs(Math.sin(t*16))*.05),1.15);np.g.rotation.z=Math.sin(t*7)*.05;}
    else{np.g.scale.setScalar(1.15);np.g.rotation.z=0;}
  });
});
function say(who,text,o){
  o=o||{};bubble(who,text,o.sec||2.4);if(!o.mute)speak(who,text);
}

     const locked=l.id>open,done=PL.done[l.id]||0;
     return `<button class="lc" data-id="${l.id}" aria-disabled="${locked}" ${hero.node===i?'aria-current="true"':''} aria-label="${l.name}${locked?', terkunci':''}">
       <span class="ic">${locked?'🔒':l.icon}</span><span class="nm">${l.name}</span><span class="st">${done?'★'.repeat(done)+'☆'.repeat(3-done):'&nbsp;'}</span></button>`;}).join('')}</div>`;
  ui.tray.querySelectorAll('.lc').forEach(b=>b.addEventListener('click',()=>goToLevel(+b.dataset.id)));
}

/* ---------- title ---------- */
function screenTitle(){
  mode='title';L=null;
  show(ui.hud,false);show(ui.tray,false);show(ui.mbar,false);show(ui.title,true);
  const saved=loadGame();let pick=saved?saved.char:'bita';
  hero.node=0;if(!hero.root||hero.charId!==pick)setHeroChar(pick);else placeHero(0);
  PL=null;refreshWorld();setTheme('title');stopSpeak();
  if(!AU.ctx)toast('Ketuk layar untuk menyalakan musik 🎵');
  setSheet(`<div class="stack">
    <div><label class="f" for="nm">Siapa namamu, petualang?</label>
      <input id="nm" type="text" maxlength="14" placeholder="Tulis namamu" autocomplete="off" value="${saved?esc(saved.name):''}"></div>
    <div><div class="f" id="clab" style="font-family:var(--display);font-weight:600;font-size:18px">Pilih karaktermu</div>
      <div class="chars" role="group" aria-labelledby="clab">${CHARS.map(c=>`<button class="char" data-id="${c.id}" aria-pressed="${c.id===pick}"><div class="e" aria-hidden="true">${c.emoji}</div><div class="n">${c.name}</div><div class="r">${c.role}</div></button>`).join('')}</div></div>
    <div class="note" id="perk"></div>
    <div class="row"><button class="btn go" id="start" style="flex:1">Mulai petualangan</button>
    ${saved?`<button class="btn sun" id="cont" style="flex:1">Lanjutkan</button>`:''}</div>
  </div>`);
  const perk=$('#perk');const sp=()=>{const c=charOf(pick);perk.innerHTML=`<b>${c.name}:</b> ${c.perk}`;};sp();
  ui.sheet.querySelectorAll('.char').forEach(b=>b.addEventListener('click',()=>{
    pick=b.dataset.id;ui.sheet.querySelectorAll('.char').forEach(x=>x.setAttribute('aria-pressed',x===b));sp();
    setHeroChar(pick);heroJump();sfxJump();say('hero',GREET[pick]);
  }));
  $('#start').addEventListener('click',()=>{
    const name=$('#nm').value.trim()||'Petualang';
    PL={name,char:pick,xp:0,done:{},badges:[]};saveGame();enterMap(true);
  });
  const cb=$('#cont');if(cb)cb.addEventListener('click',()=>{PL=saved;enterMap(true);});
}
function enterMap(fresh){
  mode='map';L=null;
  show(ui.title,false);show(ui.mbar,false);show(ui.hud,true);show(ui.tray,true);closeSheet();
  setHeroChar(PL.char);placeHero(openIdx()-1);
  cam.uYaw=0;cam.uPitch=.78;cam.uDist=30;cam.overview=false;$('#b-ov').setAttribute('aria-pressed','false');
  updHud();refreshWorld();renderTray();AU.calm=false;setTheme('map');
  toast(fresh&&!Object.keys(PL.done).length?'Ketuk wilayah yang bersinar untuk memulai misi':'Selamat datang kembali, '+PL.name+'!');
}
function goToLevel(id){
  if(mode==='walk'||mode==='level')return;
  if(id>openIdx()){sfxBad();toast('Selesaikan level sebelumnya dulu untuk membuka wilayah ini.');return;}
  cam.overview=false;$('#b-ov').setAttribute('aria-pressed','false');
  closeSheet();
  const i=id-1;
  if(hero.node===i){screenIntro(id);return;}
  renderTray();
  travelTo(i,()=>{renderTray();screenIntro(id);});
}

/* ---------- intro ---------- */
function screenIntro(id){
  mode='level';const lv=LEVELS[id-1],c=charOf(PL.char);
  hero.node=id-1;
  const n=NODES[id-1];hero.face=Math.atan2(npcs[id-1].g.position.x-n.x,npcs[id-1].g.position.z-n.z);
  if(id===5)hero.face=Math.PI;
  show(ui.tray,false);show(ui.hud,false);show(ui.mbar,false);refreshWorld();AU.calm=false;setTheme(REGION_THEME[id-1]);
  setSheet(`<div class="stack">
    <h2>${lv.icon} ${lv.name}</h2>
    <div class="dialog"><div class="npc" aria-hidden="true">${lv.npc}</div><div class="bub"><b>${lv.npcName}</b>${lv.story}</div></div>
    <div class="note">${lv.missions.length} misi · ${c.hp} nyawa ${'❤️'.repeat(c.hp)}<br>Jawaban salah mengurangi 1 nyawa. Petunjuk memotong XP misi 50%${c.freeHint?` (petunjuk pertamamu gratis, ${c.name}!)`:''}.${PL.done[id]?'<br>Level ini sudah selesai, jadi XP ulangan lebih kecil.':''}</div>
    ${lv.boss?`<div class="center"><div class="bigico" aria-hidden="true">${lv.boss.emoji}</div><div class="sub">${lv.boss.name} menunggumu di atas istana.</div></div>`:''}
    <div class="row"><button class="btn go" id="go" style="flex:1">Mulai misi</button><button class="btn ghost" id="back">Ke peta</button></div>
  </div>`);
  $('#go').addEventListener('click',()=>startLevel(lv));
  $('#back').addEventListener('click',leaveLevel);
  setTimeout(()=>{if(mode==='level'&&!L)speak('n'+(id-1),lv.story);},400);
}
function leaveLevel(){
  mode='map';L=null;closeSheet();show(ui.mbar,false);show(ui.hud,true);show(ui.tray,true);
  updHud();refreshWorld();renderTray();AU.calm=false;setTheme('map');stopSpeak();
}

/* ---------- level run ---------- */
function startLevel(lv){
  const c=charOf(PL.char);
  L={lv,idx:0,hp:c.hp,maxhp:c.hp,free:c.freeHint,xp:0,mistakes:0,hinted:false,paidHint:false,solved:false};
  const b=castle.boss;if(lv.boss&&b){b.hp=1;b.g.scale.setScalar(b.baseS);}
  stopSpeak();AU.calm=!lv.boss;
  if(lv.boss)say('boss','Hahaha! Kamu tidak akan bisa mengalahkanku!');
  screenMission();
}
function updMbar(){
  const lv=L.lv,hearts='❤️'.repeat(Math.max(L.hp,0))+'🖤'.repeat(L.maxhp-Math.max(L.hp,0));
  const dots=lv.missions.map((_,i)=>`<i class="${i<L.idx?'done':(i===L.idx?'now':'')}"></i>`).join('');
  let boss='';
  if(lv.boss){const total=lv.missions.length,left=total-L.idx;boss=`<div class="bossbar"><b>${lv.boss.emoji} ${lv.boss.name}</b><div class="bb" role="progressbar" aria-label="Nyawa ${lv.boss.name}" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${left}"><i style="width:${left/total*100}%"></i></div></div>`;}
  ui.mbar.innerHTML=`<div class="pill"><div><div class="t">${lv.icon} ${lv.name}</div><div class="dots" aria-label="Misi ${L.idx+1} dari ${lv.missions.length}">${dots}</div></div><div class="hearts" role="img" aria-label="Sisa nyawa ${Math.max(L.hp,0)} dari ${L.maxhp}">${hearts}</div></div>${boss}`;
  show(ui.mbar,true);
}
function screenMission(){
  const m=L.lv.missions[L.idx];L.hinted=false;L.paidHint=false;L.solved=false;
  updMbar();
  setSheet(`<div id="mc">
    <div class="mtag">Misi ${L.idx+1} dari ${L.lv.missions.length}</div>
    <div class="q">${m.q}</div>
    ${m.code?`<pre class="code">${esc(m.code)}</pre>`:''}
    <div id="body"></div><div id="hint"></div><div id="fb" aria-live="polite"></div>
    <div class="row" style="margin-top:16px" id="acts"><button class="btn sun" id="hbtn">💡 Petunjuk</button><button class="btn aqua" id="rbtn">🔊 Bacakan</button><button class="btn ghost" id="exit">Keluar</button></div>
  </div>`);
  $('#exit').addEventListener('click',leaveLevel);
  $('#hbtn').addEventListener('click',showHint);
  $('#rbtn').addEventListener('click',()=>{const tmp=document.createElement('div');tmp.innerHTML=m.q+(m.t==='choice'?'. Pilihannya: '+m.opts.join(', '):'');speak('n'+(L.lv.id-1),tmp.textContent);});
  ({choice:mChoice,input:mInput,order:mOrder,match:mMatch})[m.t](m);
}
function showHint(){
  if(L.solved)return;const m=L.lv.missions[L.idx];
  if(!L.hinted){L.hinted=true;if(L.free>0)L.free--;else L.paidHint=true;}
  $('#hint').innerHTML=`<div class="hintbox">💡 ${m.hint}<div class="mtag" style="margin-top:4px">${L.paidHint?'XP misi ini dipotong 50%.':'Petunjuk gratis dari karaktermu.'}</div></div>`;
}
function wrong(msg){
  L.mistakes++;L.hp--;sfxBad();flash('bad');cam.shake=.7;heroHurt();
  if(L.lv.boss)say('boss',rand1(BOSS_TAUNT));else say('hero',rand1(LINES.bad));
  if(L.lv.boss&&castle.boss)castle.boss.lunge=1;
  updMbar();
  if(L.hp<=0){setTimeout(screenLose,800);return false;}
  $('#fb').innerHTML=`<div class="fb bad">${msg||'Belum tepat. Nyawa berkurang 1, coba lagi!'}</div>`;
  return true;
}
function correct(m){
  L.solved=true;sfxOk();flash('good');heroJump();sfxJump();
  if(L.lv.boss){sfxHit();say('boss',rand1(BOSS_HIT));say('hero',rand1(LINES.ok),{mute:true});}else say('hero',rand1(LINES.ok));
  const c=charOf(PL.char),base=L.lv.boss?15:10,gain=Math.round(base*c.xp*(L.paidHint?.5:1));L.xp+=gain;
  const hp=hero.root.position;
  burst(hp.x,hp.y+4.5,hp.z,70,9,['#ffd23f','#2ec4b6','#ff5d6c','#6c4cf1','#ffffff'],1.5,10);
  if(L.lv.boss&&castle.boss){const b=castle.boss,total=L.lv.missions.length;b.flash=1;b.hp=Math.max(0,(total-L.idx-1)/total);b.lunge=0;
    const bp=b.g.position;burst(bp.x,bp.y,bp.z,40,10,['#ff5d6c','#ffb703','#ffffff'],1.2,6);}
  $('#fb').innerHTML=`<div class="fb good"><b>Benar! +${gain} XP</b><br>${m.why}</div>`;
  $('#acts').innerHTML=`<button class="btn go" id="next">${L.idx+1>=L.lv.missions.length?'Selesaikan level':'Lanjut'}</button>`;
  const nb=$('#next');nb.addEventListener('click',()=>{L.idx++;if(L.idx>=L.lv.missions.length)screenWin();else screenMission();});
  nb.focus({preventScroll:true});ui.sheet.scrollTop=ui.sheet.scrollHeight;
  updMbarKeep();
}
function updMbarKeep(){ // update boss bar immediately to the post-hit value
  if(!L.lv.boss)return;const bb=ui.mbar.querySelector('.bossbar .bb>i');if(bb){const total=L.lv.missions.length;bb.style.width=((total-L.idx-1)/total*100)+'%';}
}

/* ----- mission types ----- */
function mChoice(m){
  const order=shuffle(m.opts.map((t,i)=>({t,ok:i===m.a})));const body=$('#body');
  body.innerHTML=`<div class="opts">${order.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>`;
  body.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(L.solved)return;const o=order[+b.dataset.i];
    if(o.ok){b.classList.add('right');body.querySelectorAll('.opt').forEach(x=>x.disabled=true);correct(m);}
    else{b.classList.add('wrong');b.disabled=true;wrong();}
  }));
}
function mInput(m){
  const body=$('#body');
  body.innerHTML=`<div class="inrow"><input id="ans" type="text" autocomplete="off" aria-label="Jawabanmu" placeholder="Ketik jawabanmu"><button class="btn go" id="chk">Cek</button></div>`;
  const inp=$('#ans');if(!MOBILE)inp.focus();
  const check=()=>{
    if(L.solved)return;const v=inp.value.trim().toLowerCase().replace(/\s+/g,'');
    if(!v){$('#fb').innerHTML='<div class="fb bad">Tulis jawabanmu dulu ya.</div>';return;}
    if(m.ans.includes(v)){inp.disabled=true;$('#chk').disabled=true;correct(m);}
    else{if(wrong())inp.select();}
  };
  $('#chk').addEventListener('click',check);inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
}
function mOrder(m){
  const body=$('#body');let pool=shuffle(m.steps.map((t,i)=>({t,i})));if(pool.every((p,k)=>p.i===k))pool.reverse();let ans=[];
  const draw=()=>{
    body.innerHTML=`<div class="mtag" style="margin-top:12px">Ketuk langkah untuk memasukkannya ke urutan. Ketuk lagi untuk mengeluarkan.</div>
      <div class="chips" id="pool">${pool.map(p=>`<button class="chip" data-i="${p.i}">${esc(p.t)}</button>`).join('')}</div>
      <div class="slot" aria-label="Urutan jawabanmu">${ans.length?ans.map((p,k)=>`<button class="chip" data-i="${p.i}"><b>${k+1}.</b><span>${esc(p.t)}</span></button>`).join(''):'<span class="mtag">Urutan jawabanmu muncul di sini.</span>'}</div>
      <div style="margin-top:12px"><button class="btn go" id="chk" ${pool.length?'disabled':''}>Periksa urutan</button></div>`;
    body.querySelectorAll('#pool .chip').forEach(b=>b.addEventListener('click',()=>{if(L.solved)return;const k=pool.findIndex(p=>p.i===+b.dataset.i);ans.push(pool.splice(k,1)[0]);draw();}));
    body.querySelectorAll('.slot .chip').forEach(b=>b.addEventListener('click',()=>{if(L.solved)return;const k=ans.findIndex(p=>p.i===+b.dataset.i);pool.push(ans.splice(k,1)[0]);draw();}));
    $('#chk').addEventListener('click',()=>{
      if(L.solved)return;
      if(ans.every((p,k)=>p.i===k)){body.querySelectorAll('.chip,.btn').forEach(x=>x.disabled=true);correct(m);}
      else{const bad=ans.filter((p,k)=>p.i!==k).length;wrong(`Urutan belum tepat (${bad} langkah salah posisi). Nyawa berkurang 1.`);}
    });
  };
  draw();
}
function mMatch(m){
  const body=$('#body');const left=m.pairs.map((p,i)=>({t:p[0],i}));const right=shuffle(m.pairs.map((p,i)=>({t:p[1],i})));
  const done=new Set();let sel=null;
  const draw=()=>{
    body.innerHTML=`<div class="match"><div class="col">${left.map(l=>`<button class="mbtn ${done.has(l.i)?'ok':''} ${sel===l.i?'sel':''}" data-side="l" data-i="${l.i}" ${done.has(l.i)?'disabled':''}>${esc(l.t)}</button>`).join('')}</div>
      <div class="col">${right.map(r=>`<button class="mbtn ${done.has(r.i)?'ok':''}" data-side="r" data-i="${r.i}" ${done.has(r.i)?'disabled':''}>${esc(r.t)}</button>`).join('')}</div></div>`;
    body.querySelectorAll('.mbtn').forEach(b=>b.addEventListener('click',()=>{
      if(L.solved)return;const i=+b.dataset.i;
      if(b.dataset.side==='l'){sel=sel===i?null:i;draw();return;}
      if(sel===null){$('#fb').innerHTML='<div class="fb bad">Pilih dulu istilah di kolom kiri.</div>';return;}
      if(sel===i){done.add(i);sel=null;sfxOk();$('#fb').innerHTML='';if(done.size===m.pairs.length){draw();correct(m);}else draw();}
      else{sel=null;const ok=wrong('Pasangan itu belum cocok. Nyawa berkurang 1.');if(ok){draw();$('#fb').innerHTML='<div class="fb bad">Pasangan itu belum cocok. Nyawa berkurang 1.</div>';}}
    }));
  };
  draw();
}

/* ---------- results ---------- */
function screenLose(){
  const boss=L.lv.boss;
  show(ui.mbar,false);
  if(boss)say('boss','Hahaha! Aku menang!');else say('hero',rand1(LINES.lose));
  setSheet(`<div class="stack center"><div class="bigico" aria-hidden="true">${boss?boss.emoji:'😵'}</div><h2>Nyawa habis!</h2>
    <p style="margin:0">${boss?'Raja Bug masih berkuasa.':'Jangan menyerah.'} Pelajari lagi materinya, lalu coba ulang level ini.</p>
    <div class="row" style="justify-content:center"><button class="btn go" id="retry">Coba lagi</button><button class="btn ghost" id="back">Ke peta</button></div></div>`);
  $('#retry').addEventListener('click',()=>startLevel(L.lv));$('#back').addEventListener('click',leaveLevel);
}
function screenWin(){
  const lv=L.lv,stars=L.mistakes===0?3:(L.mistakes<=2?2:1),replay=!!PL.done[lv.id],gain=replay?Math.round(L.xp*.3):L.xp,oldLv=playerLevel();
  PL.xp+=gain;PL.done[lv.id]=Math.max(PL.done[lv.id]||0,stars);
  const bd=`${lv.badgeIcon} ${lv.badge}`;if(!PL.badges.includes(bd))PL.badges.push(bd);
  saveGame();sfxWin();show(ui.mbar,false);setTheme('victory',true);stopSpeak();
  const levelUp=playerLevel()>oldLv,final=lv.id===LEVELS.length;
  heroCheer();heroJump();
  const hp=hero.root.position;
  const fw=()=>{for(let k=0;k<5;k++)setTimeout(()=>{burst(hp.x+(Math.random()-.5)*14,hp.y+9+Math.random()*7,hp.z+(Math.random()-.5)*10,90,12,[['#ffd23f','#ff5d6c'],['#2ec4b6','#ffffff'],['#6c4cf1','#ff9bb0'],['#7dffc0','#ffd23f']][k%4],1.8,6);},k*320);};
  fw();
  if(final){const b=castle.boss;b.dying=1.2;b.flash=1;burst(b.g.position.x,b.g.position.y,b.g.position.z,160,16,['#ff5d6c','#ffb703','#ffffff','#6c4cf1'],2,5);}
  refreshWorld();
  if(levelUp)setTimeout(sfxLevelUp,700);
  if(final)setTimeout(sfxBoom,150);
  setTimeout(()=>{if(final){say('boss','Tidaaak! Aku di-debug!');setTimeout(()=>speak('n4','Hidup '+PL.name+'! Raja Bug sudah kalah dan negeri ini aman kembali!'),2800);}else speak('n'+(lv.id-1),'Luar biasa, '+PL.name+'! Kamu mendapat '+lv.badge+'.');},900);
  setSheet(`<div class="stack center"><div class="bigico" aria-hidden="true">${final?'👑':lv.badgeIcon}</div>
    <h2>${final?'Raja Bug kalah!':lv.name+' selesai!'}</h2>
    <div class="stars" role="img" aria-label="${stars} dari 3 bintang">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div>+${gain} XP${replay?' (level diulang)':''} · ${L.mistakes} kesalahan</div>
    <div><span class="badge">${bd}</span></div>
    ${levelUp?`<div class="note"><b>Naik level!</b> Sekarang kamu Lv ${playerLevel()}: ${TITLES[Math.min(playerLevel()-1,TITLES.length-1)]}.</div>`:''}
    ${final?`<p style="margin:0">Selamat, ${esc(PL.name)}! Kamu menamatkan Informatika Adventure dengan total ${PL.xp} XP. Pulau digital kembali damai berkat ilmumu.</p>`:''}
    <div class="row" style="justify-content:center">${final?'':'<button class="btn go" id="nx">Level berikutnya</button>'}<button class="btn ${final?'go':'ghost'}" id="back">Ke peta</button></div></div>`);
  $('#back').addEventListener('click',leaveLevel);
  const nx=$('#nx');if(nx)nx.addEventListener('click',()=>{leaveLevel();goToLevel(lv.id+1);});
}

/* ---------- hud buttons ---------- */
$('#b-ov').addEventListener('click',()=>{if(mode!=='map')return;cam.overview=!cam.overview;$('#b-ov').setAttribute('aria-pressed',String(cam.overview));if(cam.overview)toast('Ketuk wilayah di peta untuk berjalan ke sana');});
$('#b-home').addEventListener('click',()=>{if(mode==='walk')return;screenTitle();});

/* ---------- panel suara ---------- */
(function(){
  const btn=$('#audbtn'),panel=$('#audpanel');
  const toggle=v=>{panel.hidden=!v;btn.setAttribute('aria-expanded',String(v));};
  btn.addEventListener('click',()=>toggle(panel.hidden));
  addEventListener('keydown',e=>{if(e.key==='Escape')toggle(false);});
  const sw=(id,key)=>{const b=$(id);const upd=()=>b.setAttribute('aria-checked',String(AU[key]));upd();
    b.addEventListener('click',()=>{AU[key]=!AU[key];upd();auInit();applyGains();saveAudioPrefs();
      if(key==='voice'&&!AU.voice)stopSpeak();
      if(key==='music'&&AU.music&&AU.ctx)AU.next=AU.ctx.currentTime+.1;});};
  sw('#sw-music','music');sw('#sw-sfx','sfxOn');sw('#sw-voice','voice');
  const vol=$('#vol');vol.value=Math.round(AU.vol*100);
  vol.addEventListener('input',()=>{AU.vol=vol.value/100;applyGains();saveAudioPrefs();});
})();

/* =========================================================
   MAIN LOOP
   ========================================================= */
let last=performance.now(),stepT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  updWater(t);
  for(const f of anim)f(t,dt);
  updHero(t,dt);
  if(hero.walk){stepT+=dt;if(stepT>.285){stepT=0;sfxStep();}}
  updParticles(dt);
  updCamera(t,dt);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
function boot(){
  resize();
  hero.node=0;setHeroChar('bita');
  refreshWorld();
  screenTitle();
  requestAnimationFrame(frame);
  window.__ready=true;
}
const fontReady=document.fonts&&document.fonts.load?Promise.race([document.fonts.load('600 40px Fredoka'),new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontReady.then(boot,boot);
})();
</script>
</body>
</html>
