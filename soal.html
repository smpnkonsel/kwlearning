
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Soal - KW Learning</title>
  <link rel="stylesheet" href="assets/css/sidebar.css">

  <style>
    
/* =========================================
   BANK SOAL - KW LEARNING
   CSS LENGKAP RESPONSIF
   ========================================= */

:root {
  --sidebar-width: 260px;
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --background: #f8fafc;
  --text: #0f172a;
  --muted: #64748b;
  --border: #e2e8f0;
  --card: #ffffff;
}

/* RESET */
* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--background);
  color: var(--text);
  overflow-x: hidden;
}

/* SIDEBAR */
#sidebar-container {
  position: relative;
  z-index: 1000;
}

/* KONTEN UTAMA */
.page {
  position: relative;
  width: calc(100% - var(--sidebar-width));
  min-width: 0;
  min-height: 100vh;
  margin-left: var(--sidebar-width);
}

/* HEADER */
.hero {
  width: 100%;
  padding: 45px;
  color: #ffffff;
  background: linear-gradient(
    135deg,
    var(--primary),
    var(--primary-dark)
  );
  border-radius: 0 0 32px 32px;
}

.hero h1 {
  margin: 0 0 10px;
  font-size: 34px;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.hero p {
  margin: 0;
  opacity: 0.9;
  line-height: 1.6;
}

/* CONTAINER */
.container {
  width: 100%;
  max-width: 1200px;
  min-width: 0;
  margin: 0 auto;
  padding: 30px;
}

/* JUDUL DAN PENCARIAN */
.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 22px;
  min-width: 0;
}

.top-row h2 {
  margin: 0;
  font-size: 24px;
  line-height: 1.4;
}

.search {
  width: 280px;
  max-width: 100%;
  min-width: 0;
  padding: 12px 15px;
  border: 1px solid var(--border);
  border-radius: 12px;
  outline: none;
  background: #ffffff;
  font-size: 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.search:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
}

/* FILTER */
.filters {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.filter {
  border: 1px solid var(--border);
  background: #ffffff;
  color: #334155;
  padding: 10px 16px;
  border-radius: 11px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.2s ease;
}

.filter:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.filter.active {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}

/* JUMLAH SOAL */
.jumlah-soal {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
  margin: -12px 0 20px;
}

/* GRID SOAL */
.soal-grid {
  display: grid;
  grid-template-columns: repeat(
    auto-fit,
    minmax(min(240px, 100%), 1fr)
  );
  gap: 22px;
  width: 100%;
  min-width: 0;
}

/* KARTU SOAL */
.soal-card {
  min-width: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 24px;
  box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.soal-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 18px 35px rgba(15, 23, 42, 0.12);
}

.soal-icon {
  width: 65px;
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 18px;
  background: #eef2ff;
  font-size: 32px;
  margin-bottom: 18px;
  flex-shrink: 0;
}

.soal-card h3 {
  margin: 0 0 8px;
  font-size: 20px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.soal-card p {
  color: var(--muted);
  line-height: 1.6;
  min-height: 48px;
  overflow-wrap: anywhere;
}

/* TOMBOL BUKA SOAL */
.soal-btn {
  display: inline-block;
  max-width: 100%;
  margin-top: 10px;
  padding: 11px 18px;
  color: #ffffff;
  text-decoration: none;
  text-align: center;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(
    135deg,
    var(--primary),
    var(--primary-dark)
  );
  font-weight: 700;
  cursor: pointer;
  font-size: 14px;
  transition: filter 0.2s, transform 0.2s;
}

.soal-btn:hover {
  filter: brightness(0.95);
  transform: translateY(-1px);
}

/* STATUS, LOADING, DAN ERROR */
.status-card {
  grid-column: 1 / -1;
  text-align: center;
}

.status-card .soal-icon {
  margin: 0 auto 18px;
}

.status-card p {
  min-height: 0;
  overflow-wrap: anywhere;
}

/* TABLET */
@media (max-width: 1024px) {
  .hero {
    padding: 35px 30px;
  }

  .container {
    padding: 25px;
  }

  .soal-grid {
    gap: 18px;
  }

  .soal-card {
    padding: 20px;
  }
}

/* HP */
@media (max-width: 700px) {
  :root {
    --sidebar-width: 0px;
  }

  .page {
    width: 100%;
    margin-left: 0;
    min-height: 100vh;
  }

  .hero {
    padding: 30px 20px;
    border-radius: 0 0 24px 24px;
  }

  .hero h1 {
    font-size: 27px;
  }

  .hero p {
    font-size: 14px;
  }

  .container {
    width: 100%;
    padding: 22px 15px;
  }

  .top-row {
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
  }

  .top-row h2 {
    font-size: 22px;
  }

  .search {
    width: 100%;
  }

  .filters {
    gap: 8px;
  }

  .filter {
    padding: 9px 12px;
    font-size: 13px;
  }

  .soal-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .soal-card {
    padding: 20px;
    border-radius: 18px;
  }

  .soal-card h3 {
    font-size: 19px;
  }
}

/* HP KECIL */
@media (max-width: 380px) {
  .hero {
    padding: 25px 15px;
  }

  .hero h1 {
    font-size: 23px;
  }

  .container {
    padding: 18px 12px;
  }

  .filter {
    padding: 8px 10px;
  }

  .soal-card {
    padding: 16px;
  }
}

  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div id="sidebar-container"></div>

  <!-- HALAMAN BANK SOAL -->
  <div class="page">

    <header class="hero">
      <h1>📝 Latihan Soal</h1>
      <p>Latihan dan evaluasi pembelajaran bersama KW Learning.</p>
    </header>

    <main class="container">

      <div class="top-row">
        <h2>Bank Soal</h2>

        <input
          id="searchSoal"
          class="search"
          type="search"
          placeholder="🔎 Cari soal..."
          aria-label="Cari soal"
        >
      </div>

      <!-- FILTER SOAL -->
      <div class="filters">
        <button class="filter active" type="button" data-filter="semua">
          Semua
        </button>

        <button class="filter" type="button" data-filter="matematika">
          Matematika
        </button>

        <button class="filter" type="button" data-filter="informatika">
          Informatika
        </button>

        <button class="filter" type="button" data-filter="latihan">
          Latihan
        </button>

        <button class="filter" type="button" data-filter="ujian">
          Ujian
        </button>
      </div>

      <div id="jumlahSoal" class="jumlah-soal" aria-live="polite">
        Sedang memuat daftar soal...
      </div>

      <!-- KARTU SOAL DIBUAT OTOMATIS -->
      <section class="soal-grid" id="soalGrid" aria-live="polite">
        <div class="soal-card status-card">
          <div class="soal-icon">⏳</div>
          <h3>Memuat daftar soal...</h3>
          <p>Sistem sedang membaca file dari folder soal-soal.</p>
        </div>
      </section>

    </main>
  </div>

  <script>
    /* =========================================
       PENGATURAN GITHUB
       Isi jika deteksi repositori otomatis gagal.
       ========================================= */

    const GITHUB_OWNER = ""; // Contoh: smpn20konsel
    const GITHUB_REPO = "";  // Contoh: WEB.SMPN20KONSEL
    const FOLDER_PATH = "soal-soal";

    const grid = document.getElementById("soalGrid");
    const jumlahSoal = document.getElementById("jumlahSoal");
    const searchInput = document.getElementById("searchSoal");

    const filterButtons = [
      ...document.querySelectorAll(".filter")
    ];

    let allFiles = [];
    let activeFilter = "semua";
    let searchKeyword = "";

    /* =========================================
       MEMUAT SIDEBAR
       ========================================= */

    fetch("component/sidebar.html")
      .then(response => {
        if (!response.ok) {
          throw new Error("File component/sidebar.html tidak ditemukan.");
        }

        return response.text();
      })
      .then(html => {
        document.getElementById("sidebar-container").innerHTML = html;

        document.querySelectorAll(".nav a").forEach(link => {
          link.classList.toggle(
            "active",
            link.dataset.page === "soal"
          );
        });
      })
      .catch(error => {
        console.warn("Sidebar tidak dapat dimuat:", error);
      });

    /* =========================================
       MENGENALI REPOSITORI GITHUB
       ========================================= */

    function getRepositoryInfo() {
      let owner = GITHUB_OWNER.trim();
      let repo = GITHUB_REPO.trim();

      if (owner && repo) {
        return { owner, repo };
      }

      const host = window.location.hostname;
      const segments = window.location.pathname
        .split("/")
        .filter(Boolean);

      if (host.endsWith(".github.io")) {
        owner = host.split(".")[0];

        // GitHub Pages dengan repositori proyek.
        if (
          segments.length &&
          !segments[0].toLowerCase().endsWith(".html")
        ) {
          repo = segments[0];
        } else {
          // GitHub Pages untuk situs pengguna.
          repo = `${owner}.github.io`;
        }

        return { owner, repo };
      }

      return null;
    }

    /* =========================================
       MENCEGAH TEKS FILE DIBACA SEBAGAI HTML
       ========================================= */

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    /* =========================================
       MENENTUKAN KATEGORI BERDASARKAN NAMA FILE
       ========================================= */

    function getCategories(filename) {
      const name = filename.toLowerCase();
      const categories = [];

      if (
        name.includes("matematika") ||
        name.includes("matematik")
      ) {
        categories.push("matematika");
      }

      if (name.includes("informatika")) {
        categories.push("informatika");
      }

      if (name.includes("latihan")) {
        categories.push("latihan");
      }

      if (
        name.includes("ujian") ||
        name.includes("asesmen") ||
        name.includes("evaluasi")
      ) {
        categories.push("ujian");
      }

      return categories;
    }

    /* =========================================
       MEMBUAT JUDUL DARI NAMA FILE
       ========================================= */

    function prettyTitle(filename) {
      return filename
        .replace(/\.html?$/i, "")
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    function getIcon(categories) {
      if (categories.includes("matematika")) return "🧮";
      if (categories.includes("informatika")) return "💻";
      if (categories.includes("latihan")) return "📚";
      if (categories.includes("ujian")) return "🏆";

      return "📝";
    }

    /* =========================================
       MENAMPILKAN KARTU SOAL
       ========================================= */

    function renderFiles() {
      const filtered = allFiles.filter(file => {
        const matchesFilter =
          activeFilter === "semua" ||
          file.categories.includes(activeFilter);

        const matchesSearch =
          file.title.toLocaleLowerCase("id")
            .includes(searchKeyword) ||
          file.name.toLocaleLowerCase("id")
            .includes(searchKeyword);

        return matchesFilter && matchesSearch;
      });

      jumlahSoal.textContent =
        `Menampilkan ${filtered.length} dari ${allFiles.length} file soal`;

      if (!filtered.length) {
        grid.innerHTML = `
          <div class="soal-card status-card">
            <div class="soal-icon">🔎</div>
            <h3>Soal tidak ditemukan</h3>
            <p>
              Tidak ada file yang cocok. Periksa pencarian,
              filter, dan nama file di folder soal-soal.
            </p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(file => `
        <article class="soal-card">
          <div class="soal-icon">${getIcon(file.categories)}</div>
          <h3>${escapeHTML(file.title)}</h3>
          <p>File soal dari folder soal-soal KW Learning.</p>
          <a class="soal-btn" href="${escapeHTML(file.href)}">
            Buka Soal
          </a>
        </article>
      `).join("");
    }

    /* =========================================
       PESAN JIKA GAGAL MEMUAT SOAL
       ========================================= */

    function showLoadError(message) {
      jumlahSoal.textContent = "Daftar soal belum tersedia";

      grid.innerHTML = `
        <div class="soal-card status-card">
          <div class="soal-icon">⚠️</div>
          <h3>Daftar soal belum bisa dimuat</h3>
          <p>${escapeHTML(message)}</p>
          <button class="soal-btn" type="button" id="cobaLagi">
            Coba Lagi
          </button>
        </div>
      `;

      document
        .getElementById("cobaLagi")
        .addEventListener("click", loadSoalFiles);
    }

    /* =========================================
       MEMBACA FOLDER soal-soal DARI GITHUB API
       ========================================= */

    async function loadSoalFiles() {
      jumlahSoal.textContent = "Sedang memuat daftar soal...";

      grid.innerHTML = `
        <div class="soal-card status-card">
          <div class="soal-icon">⏳</div>
          <h3>Memuat daftar soal...</h3>
          <p>Mohon tunggu sebentar.</p>
        </div>
      `;

      const repoInfo = getRepositoryInfo();

      if (!repoInfo) {
        showLoadError(
          "Repositori GitHub tidak dapat dideteksi. " +
          "Isi GITHUB_OWNER dan GITHUB_REPO di bagian pengaturan script."
        );
        return;
      }

      const apiURL =
        `https://api.github.com/repos/` +
        `${encodeURIComponent(repoInfo.owner)}/` +
        `${encodeURIComponent(repoInfo.repo)}/contents/` +
        FOLDER_PATH;

      try {
        const response = await fetch(apiURL, {
          headers: {
            Accept: "application/vnd.github+json"
          }
        });

        if (!response.ok) {
          if (response.status === 404) {
            throw new Error(
              `Folder "${FOLDER_PATH}" atau repositori tidak ditemukan. ` +
              "Pastikan nama repositori dan folder benar, serta repositori publik."
            );
          }

          if (response.status === 403) {
            throw new Error(
              "Permintaan ke GitHub API dibatasi sementara. " +
              "Tunggu sebentar lalu tekan Coba Lagi."
            );
          }

          throw new Error(
            `GitHub API mengembalikan status ${response.status}.`
          );
        }

        const contents = await response.json();

        if (!Array.isArray(contents)) {
          throw new Error("Isi folder tidak terbaca sebagai daftar file.");
        }

        allFiles = contents
          .filter(item =>
            item.type === "file" &&
            /\.html?$/i.test(item.name)
          )
          .map(item => ({
            name: item.name,
            title: prettyTitle(item.name),
            categories: getCategories(item.name),
            href: `${FOLDER_PATH}/${
              item.name.split("/").map(encodeURIComponent).join("/")
            }`
          }))
          .sort((a, b) =>
            a.title.localeCompare(b.title, "id")
          );

        if (!allFiles.length) {
          showLoadError(
            `Belum ada file HTML di folder "${FOLDER_PATH}". ` +
            "Unggah file soal berformat .html ke folder tersebut di GitHub."
          );
          return;
        }

        renderFiles();

      } catch (error) {
        console.error("Gagal memuat bank soal:", error);

        showLoadError(
          error.message ||
          "Terjadi kesalahan saat memuat daftar soal."
        );
      }
    }

    /* =========================================
       FILTER KATEGORI
       ========================================= */

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        filterButtons.forEach(item =>
          item.classList.remove("active")
        );

        button.classList.add("active");
        activeFilter = button.dataset.filter;

        renderFiles();
      });
    });

    /* =========================================
       PENCARIAN SOAL
       ========================================= */

    searchInput.addEventListener("input", () => {
      searchKeyword = searchInput.value
        .toLocaleLowerCase("id")
        .trim();

      renderFiles();
    });

    /* MULAI MEMUAT SOAL */
    loadSoalFiles();
  </script>

  <script src="assets/js/include.js"></script>
</body>
</html>
